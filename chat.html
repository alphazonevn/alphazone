<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Group Chat AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Emoji Picker Scrollbar */
        #emoji-picker::-webkit-scrollbar { width: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-[100dvh] overflow-hidden flex flex-col items-center md:p-6 md:bg-slate-100">

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-4 right-4 bg-white border-l-4 border-indigo-500 shadow-xl rounded-lg p-4 flex items-center gap-3 z-50 transition-all duration-300 translate-x-[150%] opacity-0">
        <div class="bg-indigo-100 p-2 rounded-full text-indigo-600">
            <i class="ph ph-bell text-lg"></i>
        </div>
        <p id="toast-msg" class="text-slate-700 font-medium text-sm"></p>
    </div>

    <!-- MODAL: AI TÓM TẮT & THÀNH VIÊN -->
    <div id="info-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full relative transform scale-95 transition-transform duration-300" id="info-content-box">
            <button id="close-info" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="ph ph-x text-xl"></i>
            </button>
            <div class="flex items-center gap-2 text-indigo-600 mb-4" id="info-header">
                <i class="ph ph-sparkle text-xl" id="info-icon"></i>
                <h3 class="font-bold text-lg" id="info-title">Tiêu đề</h3>
            </div>
            <div id="info-content" class="text-slate-700 leading-relaxed text-sm max-h-[60vh] overflow-y-auto pr-2">
                <!-- Nội dung Modal -->
            </div>
        </div>
    </div>

    <!-- VIEW: ĐĂNG NHẬP -->
    <div id="login-view" class="w-full h-full flex items-center justify-center p-4 fade-in">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <div class="flex justify-center mb-6">
                <div class="bg-indigo-100 p-4 rounded-full text-indigo-600">
                    <i class="ph ph-chat-circle-text text-4xl"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">Smart Group Chat</h1>
            <p class="text-center text-slate-500 text-sm mb-6">Đăng nhập để kết nối với mọi người</p>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Số điện thoại / Tên hiển thị</label>
                    <input type="text" id="phone" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="Vd: 0901234567">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Mật khẩu</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">ID Phòng Chat</label>
                    <input type="text" id="roomId" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="Vd: room123">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition mt-4 shadow-md shadow-indigo-200 flex justify-center items-center gap-2">
                    Tham gia phòng chat
                </button>
            </form>
        </div>
    </div>

    <!-- VIEW: PHÒNG CHAT -->
    <div id="chat-view" class="bg-white w-full max-w-3xl h-full md:h-[85vh] md:rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-slate-200 hidden fade-in relative">
        
        <!-- Header -->
        <div class="bg-white px-4 md:px-6 py-4 border-b border-slate-100 flex justify-between items-center z-20 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 relative">
                    <i class="ph ph-users text-xl"></i>
                    <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-500 border-2 border-white"></span>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-slate-800 leading-tight">
                        Phòng: <span id="header-room-id" class="text-indigo-600"></span>
                    </h2>
                    <p class="text-xs text-slate-500">Bạn là: <span id="header-phone" class="font-medium"></span></p>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button id="btn-members" class="flex items-center justify-center w-9 h-9 bg-slate-50 text-slate-600 rounded-lg hover:bg-slate-100 transition" title="Thành viên">
                    <i class="ph ph-users-three text-lg"></i>
                </button>
                <button id="btn-summarize" class="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg text-sm font-medium hover:bg-indigo-100 transition disabled:opacity-50" title="Tóm tắt nội dung">
                    <i class="ph ph-sparkle text-lg"></i> <span class="hidden sm:inline">AI Tóm tắt</span>
                </button>
                <button id="btn-logout" class="flex items-center justify-center w-9 h-9 bg-rose-50 text-rose-500 rounded-lg hover:bg-rose-100 transition" title="Rời phòng">
                    <i class="ph ph-sign-out text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Khung Tin nhắn -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 bg-[#f8fafc] space-y-5">
            <!-- Tin nhắn sẽ được chèn vào đây -->
            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-slate-400 space-y-3">
                <i class="ph ph-chat-teardrop-text text-5xl opacity-20"></i>
                <p>Chưa có tin nhắn. Hãy là người đầu tiên!</p>
            </div>
        </div>
        
        <!-- Chỉ báo AI đang nhập -->
        <div id="ai-loading" class="hidden px-4 md:px-6 pb-2 bg-[#f8fafc]">
            <div class="bg-white shadow-sm border border-slate-100 w-fit text-indigo-600 px-4 py-2 rounded-2xl rounded-tl-sm text-sm flex items-center gap-2">
                <i class="ph ph-spinner animate-spin text-lg"></i> AI đang suy nghĩ...
            </div>
        </div>

        <!-- Emoji Picker (Hidden) -->
        <div id="emoji-picker" class="hidden absolute bottom-[80px] left-4 bg-white border border-slate-200 shadow-xl rounded-xl p-2 w-64 max-h-40 overflow-y-auto z-30 grid grid-cols-6 gap-2">
            <!-- Emojis chèn bằng JS -->
        </div>

        <!-- Footer / Khung nhập liệu -->
        <div class="p-4 bg-white border-t border-slate-100 z-20 shadow-[0_-10px_15px_-15px_rgba(0,0,0,0.1)]">
            <form id="chat-form" class="flex gap-2 relative">
                <button type="button" id="btn-emoji" class="p-2 text-slate-400 hover:text-amber-500 hover:bg-amber-50 rounded-lg transition flex items-center justify-center h-[46px] w-[46px]" title="Thêm Emoji">
                    <i class="ph ph-smiley text-2xl"></i>
                </button>
                
                <input type="text" id="message-input" placeholder="Nhập tin nhắn..." autocomplete="off" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all text-[15px]">
                
                <button type="button" id="btn-suggest" class="absolute right-[60px] top-1/2 -translate-y-1/2 p-2 text-indigo-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition group disabled:opacity-50" title="AI Gợi ý trả lời">
                    <i class="ph ph-magic-wand text-xl"></i>
                </button>

                <button type="submit" id="btn-send" disabled class="bg-indigo-600 text-white rounded-xl w-12 h-[46px] flex items-center justify-center hover:bg-indigo-700 transition disabled:bg-slate-300 disabled:cursor-not-allowed shadow-md shadow-indigo-100">
                    <i class="ph ph-paper-plane-right text-xl ml-0.5"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- GOOGLE APPS SCRIPT & APP LOGIC -->
    <script>
        // Đường dẫn Google Apps Script của bạn
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz18RGARK8ClJ_PfTr7padEDzCz57XUgmLh6alCrrD7KqFhRieJUSBjfHQlVwG1w0UlNA/exec";
        const apiKey = ""; // API Key Gemini (nếu có môi trường cấp)

        // State variables
        let loginData = { phone: '', roomId: '' };
        let messages = []; 
        let pollingInterval = null;
        let translatedTexts = {}; 

        // Danh sách Emoji phổ biến
        const emojis = ["😀","😂","🥰","😎","🤔","😭","😡","👍","🎉","❤️","🔥","✨","👀","🙏","💡","✅","❌","👋"];

        // DOM Elements
        const loginView = document.getElementById('login-view');
        const chatView = document.getElementById('chat-view');
        const loginForm = document.getElementById('login-form');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const btnSend = document.getElementById('btn-send');
        const messagesContainer = document.getElementById('messages-container');
        const emptyState = document.getElementById('empty-state');
        const headerPhone = document.getElementById('header-phone');
        const headerRoomId = document.getElementById('header-room-id');
        
        const btnLogout = document.getElementById('btn-logout');
        const btnSuggest = document.getElementById('btn-suggest');
        const btnSummarize = document.getElementById('btn-summarize');
        const btnMembers = document.getElementById('btn-members');
        const btnEmoji = document.getElementById('btn-emoji');
        const emojiPicker = document.getElementById('emoji-picker');
        const aiLoading = document.getElementById('ai-loading');
        
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const infoModal = document.getElementById('info-modal');
        const infoContentBox = document.getElementById('info-content-box');
        const infoTitle = document.getElementById('info-title');
        const infoIcon = document.getElementById('info-icon');
        const infoContent = document.getElementById('info-content');
        const closeInfoBtn = document.getElementById('close-info');

        // Utils: Render Emojis
        emojis.forEach(e => {
            const btn = document.createElement('button');
            btn.className = "text-xl hover:bg-slate-100 p-1 rounded transition";
            btn.textContent = e;
            btn.onclick = () => {
                messageInput.value += e;
                messageInput.focus();
                btnSend.disabled = false;
                emojiPicker.classList.add('hidden');
            };
            emojiPicker.appendChild(btn);
        });

        btnEmoji.onclick = () => emojiPicker.classList.toggle('hidden');

        // Ẩn emoji picker khi click ra ngoài
        document.addEventListener('click', (e) => {
            if (!btnEmoji.contains(e.target) && !emojiPicker.contains(e.target)) {
                emojiPicker.classList.add('hidden');
            }
        });

        // Utils: Tạo màu ngẫu nhiên dựa trên số điện thoại (Tránh trùng user)
        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return `hsl(${hash % 360}, 65%, 45%)`; // Màu đậm vừa phải
        }

        // Utils: Escape HTML to prevent XSS
        function escapeHTML(str) {
            return (str || "").toString().replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        // Utils: Parse Time chuẩn xác từ GAS
        function parseTimestamp(val) {
            if (!val) return Date.now();
            let ts = parseInt(val);
            if (isNaN(ts) || ts < 1000000000) {
                // Nếu là chuỗi ISO string hoặc định dạng Date
                ts = new Date(val).getTime();
            }
            return isNaN(ts) ? Date.now() : ts;
        }

        function formatTime(timestamp) {
            const d = new Date(timestamp);
            return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        }

        // 1. Xử lý Đăng nhập qua GAS
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const roomId = document.getElementById('roomId').value.trim();
            const btnSubmit = loginForm.querySelector('button[type="submit"]');
            
            if (phone && roomId) {
                const originalHtml = btnSubmit.innerHTML;
                btnSubmit.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i> Đang kết nối...';
                btnSubmit.disabled = true;

                try {
                    // Gửi request Đăng nhập (Dùng no-cors nếu cần, nhưng fetch thường tự redirect)
                    await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'login', phone, password })
                    }).catch(e => console.warn("Bỏ qua lỗi CORS khi login", e));
                    
                    loginData = { phone, roomId };
                    headerPhone.textContent = phone;
                    headerRoomId.textContent = roomId;
                    
                    loginView.classList.add('hidden');
                    chatView.classList.remove('hidden');
                    
                    startPolling();
                } catch (error) {
                    alert("Có lỗi kết nối. Đang thử vào phòng ngoại tuyến...");
                    console.error("Lỗi:", error);
                } finally {
                    btnSubmit.innerHTML = originalHtml;
                    btnSubmit.disabled = false;
                }
            }
        });

        // 2. Lấy dữ liệu tin nhắn (Polling) - Đã fix lỗi mất lịch sử
        async function fetchMessages() {
            try {
                const response = await fetch(`${GAS_URL}?roomId=${encodeURIComponent(loginData.roomId)}`);
                const data = await response.json();
                
                if (data.success && data.messages) {
                    // Xử lý chuẩn hóa dữ liệu từ Sheets
                    const fetchedMessages = data.messages.map(m => {
                        const ts = parseTimestamp(m.timestamp);
                        return {
                            id: ts + '_' + m.sender,
                            sender: m.sender.toString(),
                            text: m.text,
                            timestamp: ts
                        };
                    });

                    // Lọc trùng lặp ID (để kết hợp an toàn với Optimistic UI)
                    const isNewData = fetchedMessages.length > messages.filter(m => !m.isOptimistic).length;
                    
                    if (isNewData || messages.length === 0) {
                        const latestFetchedMsg = fetchedMessages[fetchedMessages.length - 1];
                        
                        // Push Notification
                        if (messages.length > 0 && latestFetchedMsg && latestFetchedMsg.sender !== loginData.phone) {
                            showToast(`Tin nhắn mới từ ${latestFetchedMsg.sender}`);
                        }

                        // Cập nhật mảng messages
                        messages = fetchedMessages;
                        renderMessages();
                    }
                }
            } catch (error) {
                console.error("Lỗi tải tin nhắn (có thể do CORS hoặc mạng):", error);
            }
        }

        function startPolling() {
            fetchMessages(); 
            pollingInterval = setInterval(fetchMessages, 3000); 
        }

        // 3. Hiển thị tin nhắn
        function renderMessages() {
            if (messages.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');
            
            // Xóa cũ
            Array.from(messagesContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            // Render
            messages.forEach(msg => {
                const isMine = msg.sender === loginData.phone;
                const timeStr = formatTime(msg.timestamp);
                const safeText = escapeHTML(msg.text);
                const translation = translatedTexts[msg.id];
                const userColor = stringToColor(msg.sender);
                const avatarChar = msg.sender.substring(0, 2).toUpperCase();

                const msgDiv = document.createElement('div');
                msgDiv.className = `flex fade-in items-end gap-2 ${isMine ? 'justify-end' : 'justify-start'}`;
                
                msgDiv.innerHTML = `
                    ${!isMine ? `
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-sm shrink-0 mb-5" style="background-color: ${userColor}">
                        ${avatarChar}
                    </div>` : ''}
                    
                    <div class="max-w-[75%] md:max-w-[65%] flex flex-col ${isMine ? 'items-end' : 'items-start'} group">
                        ${!isMine ? `<span class="text-[11px] text-slate-500 font-medium ml-1 mb-1" style="color: ${userColor}">${escapeHTML(msg.sender)}</span>` : ''}
                        
                        <div class="relative p-3.5 rounded-2xl ${isMine ? 'bg-indigo-600 text-white rounded-br-sm shadow-indigo-200' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'} shadow-sm">
                            <p class="text-[15px] leading-relaxed break-words whitespace-pre-wrap">${safeText}</p>
                            
                            ${translation ? `
                            <div class="mt-2 pt-2 border-t border-black/10 text-sm opacity-90 italic">
                                <span class="font-semibold text-xs opacity-75">Dịch: </span> ${escapeHTML(translation)}
                            </div>` : ''}

                            <!-- Action Buttons -->
                            <div class="absolute ${isMine ? '-left-16' : '-right-16'} top-1/2 -translate-y-1/2 flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                ${!isMine ? `
                                <button class="btn-translate p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition bg-white shadow-sm border border-slate-100" data-id="${msg.id}" data-text="${escapeHTML(msg.text)}" title="Dịch bằng AI">
                                    <i class="ph ph-translate text-sm"></i>
                                </button>` : ''}
                                <button class="btn-copy p-1.5 text-slate-400 hover:text-green-600 hover:bg-green-50 rounded-full transition bg-white shadow-sm border border-slate-100" data-text="${escapeHTML(msg.text)}" title="Sao chép">
                                    <i class="ph ph-copy text-sm"></i>
                                </button>
                            </div>
                        </div>
                        <span class="text-[10px] text-slate-400 mt-1 flex items-center gap-1">
                            ${timeStr} ${msg.isOptimistic ? '<i class="ph ph-clock text-[10px]"></i>' : ''}
                        </span>
                    </div>
                `;
                messagesContainer.appendChild(msgDiv);
            });
            
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 50);
        }

        // 4. Gửi tin nhắn qua GAS (Optimistic UI)
        messageInput.addEventListener('input', (e) => {
            btnSend.disabled = !e.target.value.trim();
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.value = '';
            btnSend.disabled = true;

            const tempTimestamp = Date.now();
            
            // Push ảo lên màn hình trước
            messages.push({
                id: tempTimestamp + '_' + loginData.phone,
                sender: loginData.phone,
                text: text,
                timestamp: tempTimestamp,
                isOptimistic: true // Cờ đánh dấu chưa sync server
            });
            renderMessages();
            
            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ 
                        action: "send_message", 
                        roomId: loginData.roomId,
                        sender: loginData.phone,
                        text: text
                    })
                }).catch(e => console.warn("Lỗi CORS nhưng dữ liệu có thể đã lưu", e));
                
                // Fetch lại để đồng bộ
                setTimeout(fetchMessages, 1000); 
            } catch (err) {
                showToast("Lỗi mạng khi gửi tin nhắn!");
            }
        });

        // ==========================================
        // TÍNH NĂNG MỚI: XEM THÀNH VIÊN
        // ==========================================
        btnMembers.addEventListener('click', () => {
            if (messages.length === 0) return showToast("Chưa có ai trong phòng!");
            
            // Lọc User duy nhất từ lịch sử tin nhắn
            const uniqueUsers = [...new Set(messages.map(m => m.sender))];
            
            infoTitle.textContent = `Thành viên (${uniqueUsers.length})`;
            infoIcon.className = "ph ph-users text-xl";
            
            let html = '<ul class="space-y-3 mt-2">';
            uniqueUsers.forEach(user => {
                const color = stringToColor(user);
                const isMe = user === loginData.phone;
                html += `
                    <li class="flex items-center gap-3 p-2 rounded-lg border border-slate-100 hover:bg-slate-50 transition">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background-color: ${color}">
                            ${user.substring(0, 2).toUpperCase()}
                        </div>
                        <span class="font-medium ${isMe ? 'text-indigo-600' : 'text-slate-700'}">${user} ${isMe ? '(Bạn)' : ''}</span>
                    </li>
                `;
            });
            html += '</ul>';
            
            infoContent.innerHTML = html;
            showModal();
        });

        // ==========================================
        // TÍNH NĂNG AI & TIỆN ÍCH (GEMINI)
        // ==========================================
        async function callGeminiAI(prompt) {
            if (!apiKey) {
                // Giả lập nếu thiếu API Key
                return "Tính năng AI yêu cầu API Key của Google Gemini để hoạt động.";
            }
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };

            let delay = 1000;
            for (let i = 0; i < 3; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Không thể tạo phản hồi.";
                } catch (error) {
                    if (i === 2) return "Hệ thống AI bận, thử lại sau.";
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        function toggleAILoading(show) {
            if (show) aiLoading.classList.remove('hidden');
            else aiLoading.classList.add('hidden');
            btnSuggest.disabled = show;
            btnSummarize.disabled = show;
        }

        // AI: Gợi ý trả lời
        btnSuggest.addEventListener('click', async () => {
            if (messages.length === 0) return showToast("Cần có lịch sử chat để gợi ý!");
            toggleAILoading(true);
            
            const context = messages.slice(-5).map(m => `${m.sender}: ${m.text}`).join('\n');
            const prompt = `Dựa vào hội thoại:\n${context}\nHãy đóng vai '${loginData.phone}', viết 1 câu trả lời ngắn (<15 từ) tiếng Việt. Chỉ trả về nội dung.`;
            
            const reply = await callGeminiAI(prompt);
            messageInput.value = reply.replace(/['"]/g, '').trim();
            btnSend.disabled = false;
            toggleAILoading(false);
            messageInput.focus();
        });

        // AI: Tóm tắt
        btnSummarize.addEventListener('click', async () => {
            if (messages.length === 0) return showToast("Chưa có tin nhắn để tóm tắt");
            toggleAILoading(true);
            
            const context = messages.slice(-20).map(m => `${m.sender}: ${m.text}`).join('\n');
            const prompt = `Tóm tắt ngắn gọn các ý chính của đoạn hội thoại sau bằng tiếng Việt (dưới 50 từ):\n\n${context}`;
            
            const summary = await callGeminiAI(prompt);
            
            infoTitle.textContent = "AI Tóm Tắt Lịch Sử";
            infoIcon.className = "ph ph-sparkle text-xl text-indigo-500";
            infoContent.innerHTML = `<p class="whitespace-pre-wrap">${escapeHTML(summary)}</p>`;
            
            toggleAILoading(false);
            showModal();
        });

        // Copy / Dịch (Event Delegation)
        messagesContainer.addEventListener('click', async (e) => {
            // Nút Copy
            const btnCopy = e.target.closest('.btn-copy');
            if (btnCopy) {
                const text = btnCopy.getAttribute('data-text');
                navigator.clipboard.writeText(text).then(() => showToast("Đã sao chép tin nhắn"));
                return;
            }

            // Nút Dịch
            const btnTranslate = e.target.closest('.btn-translate');
            if (btnTranslate) {
                const msgId = btnTranslate.getAttribute('data-id');
                const originalText = btnTranslate.getAttribute('data-text');
                const icon = btnTranslate.querySelector('i');
                
                if (translatedTexts[msgId]) return;

                icon.className = "ph ph-spinner animate-spin text-sm";
                btnTranslate.disabled = true;

                const prompt = `Dịch đoạn văn bản sau sang Tiếng Việt. Nếu đã là Tiếng Việt, dịch sang Tiếng Anh. Chỉ trả về kết quả:\n"${originalText}"`;
                const translated = await callGeminiAI(prompt);
                
                translatedTexts[msgId] = translated;
                renderMessages();
            }
        });

        // UI Utils: Modal & Toast
        function showModal() {
            infoModal.classList.remove('hidden');
            setTimeout(() => {
                infoModal.classList.remove('opacity-0');
                infoContentBox.classList.remove('scale-95');
            }, 10);
        }

        closeInfoBtn.addEventListener('click', () => {
            infoModal.classList.add('opacity-0');
            infoContentBox.classList.add('scale-95');
            setTimeout(() => infoModal.classList.add('hidden'), 300);
        });

        let toastTimeout;
        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.remove('translate-x-[150%]', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-x-[150%]', 'opacity-0');
            }, 3000);
        }

        // Đăng xuất
        btnLogout.addEventListener('click', () => {
            if (pollingInterval) clearInterval(pollingInterval);
            loginView.classList.remove('hidden');
            chatView.classList.add('hidden');
            loginData = { phone: '', roomId: '' };
            document.getElementById('password').value = '';
            messages = [];
            translatedTexts = {};
        });

    </script>
</body>
</html>
