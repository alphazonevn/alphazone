<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Group Chat AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Emoji Picker */
        #emoji-picker::-webkit-scrollbar { width: 4px; }
        
        /* Markdown Styles for AI Bot */
        .msg-content strong { font-weight: 700; color: inherit; }
        .msg-content em { font-style: italic; }
        .msg-content code { background: rgba(0,0,0,0.1); padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .msg-content pre { background: #1e293b; color: #f8fafc; padding: 10px; border-radius: 8px; overflow-x: auto; margin-top: 5px; }
        .msg-content pre code { background: transparent; color: inherit; padding: 0; }
        .msg-content ul { list-style-type: disc; margin-left: 20px; margin-top: 5px; }
        .msg-content ol { list-style-type: decimal; margin-left: 20px; margin-top: 5px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-[100dvh] overflow-hidden flex flex-col items-center md:p-6 md:bg-slate-200">

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-4 right-4 bg-white border-l-4 border-indigo-500 shadow-2xl rounded-lg p-4 flex items-center gap-3 z-50 transition-all duration-300 translate-x-[150%] opacity-0">
        <div class="bg-indigo-100 p-2 rounded-full text-indigo-600">
            <i class="ph ph-bell-ringing text-lg"></i>
        </div>
        <p id="toast-msg" class="text-slate-700 font-medium text-sm"></p>
    </div>

    <!-- MODAL (Thành viên / Tóm tắt) -->
    <div id="info-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full relative transform scale-95 transition-transform duration-300" id="info-content-box">
            <button id="close-info" class="absolute top-4 right-4 text-slate-400 hover:text-rose-500 transition bg-slate-100 rounded-full p-1">
                <i class="ph ph-x text-lg"></i>
            </button>
            <div class="flex items-center gap-2 text-indigo-600 mb-4" id="info-header">
                <i class="ph ph-sparkle text-xl" id="info-icon"></i>
                <h3 class="font-bold text-lg" id="info-title">Tiêu đề</h3>
            </div>
            <div id="info-content" class="text-slate-700 leading-relaxed text-sm max-h-[60vh] overflow-y-auto pr-2">
                <!-- Nội dung Modal -->
            </div>
        </div>
    </div>

    <!-- VIEW 1: ĐĂNG NHẬP -->
    <div id="login-view" class="w-full h-full flex items-center justify-center p-4 fade-in">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
            <div class="flex justify-center mb-6">
                <div class="bg-indigo-50 p-4 rounded-2xl text-indigo-600 shadow-inner">
                    <i class="ph ph-chats-circle text-5xl"></i>
                </div>
            </div>
            <h1 class="text-2xl font-extrabold text-center text-slate-800 mb-2">Smart Group Chat</h1>
            <p class="text-center text-slate-500 text-sm mb-8">Nền tảng chat nhóm tích hợp AI thông minh</p>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Tên hiển thị / SĐT</label>
                    <input type="text" id="phone" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition" placeholder="Ví dụ: Alex">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Mã Phòng Chat</label>
                    <input type="text" id="roomId" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition" placeholder="Ví dụ: room123">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Mật khẩu phòng (Trống nếu phòng mới)</label>
                    <input type="password" id="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition" placeholder="••••••••">
                </div>
                <button type="submit" id="btn-login-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition mt-6 shadow-lg shadow-indigo-200 flex justify-center items-center gap-2">
                    Vào Phòng Chat <i class="ph ph-sign-in text-lg"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- VIEW 2: PHÒNG CHAT -->
    <div id="chat-view" class="bg-white w-full max-w-4xl h-full md:h-[90vh] md:rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-slate-200 hidden fade-in relative">
        
        <!-- Header -->
        <div class="bg-white/80 backdrop-blur-md px-4 md:px-6 py-4 border-b border-slate-100 flex justify-between items-center z-20 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white relative shadow-md">
                    <i class="ph ph-users text-xl"></i>
                    <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-green-500 border-2 border-white"></span>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-slate-800 leading-tight flex items-center gap-1">
                        Phòng: <span id="header-room-id" class="text-indigo-600"></span>
                    </h2>
                    <p class="text-xs text-slate-500 font-medium">Đang đăng nhập: <span id="header-phone" class="text-slate-700 font-bold"></span></p>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button id="btn-members" class="flex items-center justify-center w-10 h-10 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 hover:text-slate-800 transition shadow-sm" title="Thành viên">
                    <i class="ph ph-users-three text-xl"></i>
                </button>
                <button id="btn-summarize" class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-indigo-50 to-purple-50 text-indigo-700 rounded-xl text-sm font-bold hover:shadow-md transition disabled:opacity-50 border border-indigo-100" title="AI Tóm tắt toàn bộ">
                    <i class="ph ph-magic-wand text-lg"></i> <span class="hidden sm:inline">Tóm Tắt</span>
                </button>
                <button id="btn-logout" class="flex items-center justify-center w-10 h-10 bg-rose-50 text-rose-500 rounded-xl hover:bg-rose-100 hover:text-rose-600 transition shadow-sm" title="Rời phòng">
                    <i class="ph ph-sign-out text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Khung Tin nhắn -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50/50 space-y-6 relative scroll-smooth">
            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-slate-400 space-y-4">
                <div class="p-6 bg-white rounded-full shadow-sm border border-slate-100">
                    <i class="ph ph-chats text-6xl text-slate-300"></i>
                </div>
                <div class="text-center">
                    <p class="font-medium text-slate-600">Chưa có tin nhắn nào!</p>
                    <p class="text-sm mt-1">Mẹo: Gõ <span class="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-mono text-xs">@AI</span> kèm câu hỏi để gọi Bot hỗ trợ nhé.</p>
                </div>
            </div>
            <!-- Tin nhắn JS sẽ render tại đây -->
        </div>

        <!-- Nút Cuộn xuống -->
        <button id="btn-scroll-bottom" class="hidden absolute bottom-[90px] right-6 bg-indigo-600/90 backdrop-blur text-white rounded-full p-2.5 shadow-xl hover:bg-indigo-700 transition transform hover:scale-110 z-30 animate-bounce">
            <i class="ph ph-arrow-down text-xl"></i>
        </button>
        
        <!-- Chỉ báo AI đang nhập -->
        <div id="ai-loading" class="hidden absolute bottom-[80px] left-6 z-30 fade-in">
            <div class="bg-white/90 backdrop-blur shadow-lg border border-slate-100 w-fit text-indigo-600 px-4 py-2.5 rounded-2xl rounded-bl-sm text-sm font-medium flex items-center gap-2">
                <i class="ph ph-spinner-gap animate-spin text-lg"></i> AI đang xử lý...
            </div>
        </div>

        <!-- Emoji Picker -->
        <div id="emoji-picker" class="hidden absolute bottom-[85px] left-4 bg-white border border-slate-200 shadow-2xl rounded-2xl p-3 w-72 max-h-48 overflow-y-auto z-40 grid grid-cols-6 gap-2">
            <!-- Emojis js chèn -->
        </div>

        <!-- Footer / Input -->
        <div class="p-4 bg-white border-t border-slate-100 z-20 shadow-[0_-10px_20px_-15px_rgba(0,0,0,0.05)] relative">
            <div id="sending-indicator" class="hidden absolute -top-8 left-1/2 -translate-x-1/2 text-xs text-indigo-600 font-bold flex items-center gap-1.5 bg-indigo-50 px-4 py-1.5 rounded-full shadow-sm border border-indigo-100">
                <i class="ph ph-paper-plane-right animate-pulse"></i> Đang gửi...
            </div>

            <form id="chat-form" class="flex gap-2.5 relative items-end">
                <button type="button" id="btn-emoji" class="p-3 text-slate-400 hover:text-amber-500 hover:bg-amber-50 rounded-xl transition flex items-center justify-center shrink-0" title="Thêm Emoji">
                    <i class="ph ph-smiley text-2xl"></i>
                </button>
                
                <div class="flex-1 relative bg-slate-50 border border-slate-200 rounded-2xl focus-within:ring-2 focus-within:ring-indigo-500/50 focus-within:border-indigo-500 transition-all flex items-center">
                    <textarea id="message-input" rows="1" placeholder="Nhập tin nhắn... (Gõ @AI để gọi bot)" class="w-full bg-transparent border-none focus:ring-0 px-4 py-3.5 resize-none max-h-32 text-[15px] outline-none" style="min-height: 52px;"></textarea>
                    
                    <button type="button" id="btn-suggest" class="absolute right-2 p-2 text-indigo-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition group shrink-0" title="AI Gợi ý trả lời nhanh">
                        <i class="ph ph-lightbulb text-xl group-hover:animate-pulse"></i>
                    </button>
                </div>

                <button type="submit" id="btn-send" disabled class="bg-indigo-600 text-white rounded-2xl w-[52px] h-[52px] flex items-center justify-center hover:bg-indigo-700 hover:shadow-lg hover:shadow-indigo-200 transition disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed shrink-0">
                    <i class="ph ph-paper-plane-right text-2xl ml-0.5"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- LOGIC SCRIPT -->
    <script>
        // CẤU HÌNH API
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwpUoYmiJpmMl068kp9dHW-FKxknMeZXNe65n0JzmabY4wtrYOp59x0NQA9y5weDSXtbQ/exec"; // Dán URL Web App mới triển khai vào đây
        const apiKey = ""; // API Key Gemini

        let loginData = { phone: '', roomId: '', password: '' };
        let messages = []; 
        let renderedMessageIds = new Set();
        let pollingInterval = null;
        let translatedTexts = {};
        const AI_BOT_NAME = "Smart AI 🤖";

        const emojis = ["😀","😂","🥰","😎","🤔","😭","😡","👍","🎉","❤️","🔥","✨","👀","🙏","💡","✅","❌","👋","💯","🚀","🌟","☕"];

        const dom = {
            loginView: document.getElementById('login-view'),
            chatView: document.getElementById('chat-view'),
            loginForm: document.getElementById('login-form'),
            chatForm: document.getElementById('chat-form'),
            msgInput: document.getElementById('message-input'),
            btnSend: document.getElementById('btn-send'),
            msgContainer: document.getElementById('messages-container'),
            emptyState: document.getElementById('empty-state'),
            headerPhone: document.getElementById('header-phone'),
            headerRoomId: document.getElementById('header-room-id'),
            aiLoading: document.getElementById('ai-loading'),
            btnScroll: document.getElementById('btn-scroll-bottom'),
            btnEmoji: document.getElementById('btn-emoji'),
            emojiPicker: document.getElementById('emoji-picker')
        };

        // Auto-resize textarea
        dom.msgInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim() === '') this.style.height = '52px';
            dom.btnSend.disabled = !this.value.trim();
        });

        // Enter to send
        dom.msgInput.addEventListener('keydown', function(e) {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if(!dom.btnSend.disabled) dom.chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // Setup Emojis
        emojis.forEach(e => {
            const btn = document.createElement('button');
            btn.className = "text-2xl hover:bg-slate-100 p-2 rounded-xl transition transform hover:scale-110";
            btn.textContent = e;
            btn.onclick = () => {
                dom.msgInput.value += e;
                dom.msgInput.focus();
                dom.btnSend.disabled = false;
                dom.emojiPicker.classList.add('hidden');
            };
            dom.emojiPicker.appendChild(btn);
        });

        dom.btnEmoji.onclick = () => dom.emojiPicker.classList.toggle('hidden');
        document.addEventListener('click', (e) => {
            if (!dom.btnEmoji.contains(e.target) && !dom.emojiPicker.contains(e.target)) dom.emojiPicker.classList.add('hidden');
        });

        function stringToColor(str) {
            if(str === AI_BOT_NAME) return '#8b5cf6'; // Màu tím cho Bot
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${hash % 360}, 65%, 45%)`; 
        }

        function escapeHTML(str) {
            return (str || "").toString().replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        // Parse cơ bản Markdown cho câu trả lời của AI
        function parseMarkdown(text) {
            let html = escapeHTML(text);
            // Code block
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Bold
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // Italic
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            return html;
        }

        function formatTime(timestamp) {
            const d = new Date(timestamp);
            if(isNaN(d.getTime())) return "";
            return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        }

        dom.loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const roomId = document.getElementById('roomId').value.trim();
            const btnSubmit = document.getElementById('btn-login-submit');
            
            if (!phone || !roomId) return;

            const originalHtml = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<i class="ph ph-spinner-gap animate-spin text-xl"></i> Đang xác thực...';
            btnSubmit.disabled = true;

            try {
                // Gọi GET request tới Apps Script backend để xác thực
                const url = `${GAS_URL}?action=login&roomId=${encodeURIComponent(roomId)}&phone=${encodeURIComponent(phone)}&password=${encodeURIComponent(password)}`;
                const response = await fetch(url);
                const result = await response.json();

                if (!result.success) {
                    showToast(result.message || "Đăng nhập thất bại");
                    return; // Chặn nếu sai pass hoặc trùng user
                }

                // Thành công
                loginData = { phone, roomId, password };
                dom.headerPhone.textContent = phone;
                dom.headerRoomId.textContent = roomId;
                
                dom.loginView.classList.add('hidden');
                dom.chatView.classList.remove('hidden');
                
                startPolling();
                showToast("Đăng nhập thành công!");
                
            } catch (error) {
                console.error(error);
                showToast("Lỗi mạng! Không thể kết nối tới máy chủ.");
            } finally {
                btnSubmit.innerHTML = originalHtml;
                btnSubmit.disabled = false;
            }
        });

        async function fetchMessages() {
            try {
                const url = `${GAS_URL}?action=get_messages&roomId=${encodeURIComponent(loginData.roomId)}`;
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success && result.messages) {
                    messages = result.messages.map((m, index) => ({
                        id: m.timestamp + '_' + m.sender + '_' + index, // Đảm bảo ID độc nhất
                        sender: m.sender.toString(),
                        text: m.text,
                        timestamp: m.timestamp
                    }));
                    renderMessagesIncremental();
                }
            } catch (error) {
                console.warn("Polling error (có thể do kết nối mạng):", error);
            }
        }

        function startPolling() {
            fetchMessages(); 
            pollingInterval = setInterval(fetchMessages, 2500); 
        }

        function isAtBottom() {
            return (dom.msgContainer.scrollHeight - dom.msgContainer.clientHeight) <= (dom.msgContainer.scrollTop + 150);
        }

        function scrollToBottom() {
            dom.msgContainer.scrollTop = dom.msgContainer.scrollHeight;
            dom.btnScroll.classList.add('hidden');
        }

        dom.msgContainer.addEventListener('scroll', () => {
            if (isAtBottom()) dom.btnScroll.classList.add('hidden');
        });
        dom.btnScroll.addEventListener('click', scrollToBottom);

        function renderMessagesIncremental() {
            if (messages.length === 0) {
                dom.emptyState.classList.remove('hidden');
                return;
            }
            dom.emptyState.classList.add('hidden');
            
            let wasAtBottom = isAtBottom();
            let addedNew = false;
            const fragment = document.createDocumentFragment();

            messages.forEach(msg => {
                if (!renderedMessageIds.has(msg.id)) {
                    renderedMessageIds.add(msg.id);
                    addedNew = true;
                    
                    const isMine = msg.sender === loginData.phone;
                    const isBot = msg.sender === AI_BOT_NAME;
                    const timeStr = formatTime(msg.timestamp);
                    // Dùng parseMarkdown cho text (hữu ích nếu là bot AI trả lời)
                    const htmlText = parseMarkdown(msg.text); 
                    const translation = translatedTexts[msg.id];
                    const userColor = stringToColor(msg.sender);
                    const avatarChar = isBot ? '<i class="ph ph-robot"></i>' : msg.sender.substring(0, 2).toUpperCase();

                    const msgDiv = document.createElement('div');
                    msgDiv.id = `msg-${msg.id}`;
                    msgDiv.className = `flex fade-in items-end gap-2.5 ${isMine ? 'justify-end' : 'justify-start'} mt-4`;
                    
                    // Bubble CSS classes
                    let bubbleClass = isMine 
                        ? 'bg-gradient-to-br from-indigo-600 to-indigo-700 text-white rounded-br-sm shadow-md' 
                        : (isBot ? 'bg-gradient-to-br from-purple-50 to-indigo-50 border border-purple-200 text-slate-800 rounded-bl-sm shadow-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm shadow-sm');

                    msgDiv.innerHTML = `
                        ${!isMine ? `
                        <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-md shrink-0 mb-5 border-2 border-white" style="background-color: ${userColor}">
                            ${avatarChar}
                        </div>` : ''}
                        
                        <div class="max-w-[80%] md:max-w-[70%] flex flex-col ${isMine ? 'items-end' : 'items-start'} group">
                            ${!isMine ? `<span class="text-[11px] text-slate-500 font-bold ml-1.5 mb-1 opacity-80" style="color: ${userColor}">${escapeHTML(msg.sender)}</span>` : ''}
                            
                            <div class="relative p-3.5 px-4 rounded-2xl ${bubbleClass}">
                                <div class="msg-content text-[15px] leading-relaxed break-words whitespace-pre-wrap">${htmlText}</div>
                                
                                ${translation ? `
                                <div class="mt-3 pt-3 border-t border-black/10 text-sm opacity-90 bg-black/5 p-2 rounded-lg">
                                    <div class="font-bold text-xs opacity-75 mb-1 flex items-center gap-1"><i class="ph ph-translate"></i> Bản dịch:</div> 
                                    <span class="trans-text">${parseMarkdown(translation)}</span>
                                </div>` : '<div class="trans-container hidden mt-3 pt-3 border-t border-black/10 text-sm opacity-90 bg-black/5 p-2 rounded-lg"><div class="font-bold text-xs opacity-75 mb-1 flex items-center gap-1"><i class="ph ph-translate"></i> Bản dịch:</div><span class="trans-text"></span></div>'}

                                <!-- Tooltip Actions -->
                                <div class="absolute ${isMine ? '-left-[72px]' : '-right-[72px]'} top-1/2 -translate-y-1/2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    ${!isMine ? `
                                    <button class="btn-translate p-1.5 text-slate-500 hover:text-indigo-600 hover:bg-white rounded-full transition bg-white/50 backdrop-blur shadow-sm border border-slate-200" data-id="${msg.id}" data-text="${escapeHTML(msg.text)}" title="Dịch văn bản">
                                        <i class="ph ph-translate text-sm"></i>
                                    </button>` : ''}
                                    <button class="btn-copy p-1.5 text-slate-500 hover:text-green-600 hover:bg-white rounded-full transition bg-white/50 backdrop-blur shadow-sm border border-slate-200" data-text="${escapeHTML(msg.text)}" title="Sao chép">
                                        <i class="ph ph-copy text-sm"></i>
                                    </button>
                                </div>
                            </div>
                            <span class="text-[10px] text-slate-400 mt-1 font-medium flex items-center gap-1 px-1">${timeStr}</span>
                        </div>
                    `;
                    fragment.appendChild(msgDiv);
                }
            });

            if (addedNew) {
                dom.msgContainer.appendChild(fragment);
                const lastMsg = messages[messages.length - 1];
                if (wasAtBottom || (lastMsg && lastMsg.sender === loginData.phone)) {
                    scrollToBottom();
                } else if (lastMsg.sender !== loginData.phone) {
                    dom.btnScroll.classList.remove('hidden');
                    if(lastMsg.sender !== AI_BOT_NAME) showToast(`Tin nhắn mới từ ${lastMsg.sender}`);
                }
            }
        }

        async function sendToServer(senderName, textContent) {
            const payload = { action: "send_message", roomId: loginData.roomId, sender: senderName, text: textContent };
            await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload) // Gửi dạng text thô JSON (tránh OPTIONS preflight nếu có thể)
            }).catch(e => console.warn("Background send complete", e));
        }

        dom.chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = dom.msgInput.value.trim();
            if (!text) return;

            // Xử lý UI gửi tin
            dom.msgInput.value = '';
            dom.msgInput.style.height = '52px';
            dom.btnSend.disabled = true;
            document.getElementById('sending-indicator').classList.remove('hidden');
            
            try {
                // 1. Gửi tin nhắn của người dùng lên Server
                await sendToServer(loginData.phone, text);
                await fetchMessages(); // Fetch ngay để hiện tin nhắn
                setTimeout(scrollToBottom, 100);

                // 2. TÍNH NĂNG THÔNG MINH: Đánh thức Bot AI nếu có tag @AI
                if (text.toLowerCase().startsWith('@ai ')) {
                    const question = text.substring(4).trim();
                    if(question) {
                        dom.aiLoading.classList.remove('hidden'); // Bật loading Bot
                        
                        // Cung cấp bối cảnh (5 tin nhắn gần nhất)
                        const context = messages.slice(-5).map(m => `${m.sender}: ${m.text}`).join('\n');
                        const prompt = `Đây là nhóm chat. Bối cảnh gần đây:\n${context}\n\nNgười dùng '${loginData.phone}' vừa hỏi bạn (AI Bot) câu này: "${question}".\nHãy trả lời một cách tự nhiên, ngắn gọn, súc tích bằng tiếng Việt. Có thể dùng markdown để định dạng.`;
                        
                        const aiReply = await callGeminiAI(prompt);
                        
                        // Gửi câu trả lời của AI vào nhóm chat
                        await sendToServer(AI_BOT_NAME, aiReply);
                        await fetchMessages();
                        scrollToBottom();
                        dom.aiLoading.classList.add('hidden');
                    }
                }

            } catch (err) {
                showToast("Lỗi gửi tin nhắn!");
            } finally {
                document.getElementById('sending-indicator').classList.add('hidden');
            }
        });

        async function callGeminiAI(prompt) {
            if (!apiKey) return "⚠️ Lỗi: Chưa cấu hình API Key của Google Gemini trong mã nguồn Frontend.";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Xin lỗi, tôi không thể trả lời lúc này.";
            } catch (error) {
                return "⚠️ Không thể kết nối tới AI. Vui lòng thử lại sau.";
            }
        }

        // Nút Xem thành viên
        document.getElementById('btn-members').addEventListener('click', () => {
            if (messages.length === 0) return showToast("Chưa có ai trong phòng!");
            const uniqueUsers = [...new Set(messages.map(m => m.sender))];
            
            document.getElementById('info-title').textContent = `Thành viên (${uniqueUsers.length})`;
            document.getElementById('info-icon').className = "ph ph-users text-2xl text-indigo-500";
            
            let html = '<ul class="space-y-2 mt-2">';
            uniqueUsers.forEach(user => {
                const color = stringToColor(user);
                const isMe = user === loginData.phone;
                const isBot = user === AI_BOT_NAME;
                html += `
                    <li class="flex items-center gap-3 p-2.5 rounded-xl border border-slate-100 hover:bg-slate-50 transition bg-white">
                        <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shadow-sm" style="background-color: ${color}">
                            ${isBot ? '<i class="ph ph-robot"></i>' : user.substring(0, 2).toUpperCase()}
                        </div>
                        <span class="font-semibold ${isMe ? 'text-indigo-600' : 'text-slate-700'}">${user} ${isMe ? '<span class="text-xs text-indigo-400 bg-indigo-50 px-2 py-0.5 rounded-full ml-1">(Bạn)</span>' : ''}</span>
                    </li>
                `;
            });
            html += '</ul>';
            
            document.getElementById('info-content').innerHTML = html;
            showModal();
        });

        // Nút Gợi ý trả lời
        document.getElementById('btn-suggest').addEventListener('click', async () => {
            if (messages.length === 0) return showToast("Cần có lịch sử chat để gợi ý!");
            document.getElementById('btn-suggest').querySelector('i').classList.replace('ph-lightbulb', 'ph-spinner-gap');
            document.getElementById('btn-suggest').querySelector('i').classList.add('animate-spin');
            
            const context = messages.slice(-6).map(m => `${m.sender}: ${m.text}`).join('\n');
            const prompt = `Dựa vào hội thoại:\n${context}\nHãy đóng vai '${loginData.phone}', viết 1 câu trả lời ngắn gọn, thông minh để chat lại. Trả về đúng nội dung câu trả lời.`;
            
            const reply = await callGeminiAI(prompt);
            dom.msgInput.value = reply.replace(/['"]/g, '').trim();
            dom.btnSend.disabled = false;
            
            document.getElementById('btn-suggest').querySelector('i').classList.replace('ph-spinner-gap', 'ph-lightbulb');
            document.getElementById('btn-suggest').querySelector('i').classList.remove('animate-spin');
            dom.msgInput.focus();
        });

        // Tóm tắt lịch sử
        document.getElementById('btn-summarize').addEventListener('click', async () => {
            if (messages.length === 0) return showToast("Chưa có tin nhắn để tóm tắt");
            dom.aiLoading.classList.remove('hidden');
            
            const context = messages.slice(-30).map(m => `${m.sender}: ${m.text}`).join('\n');
            const prompt = `Hãy tóm tắt ngắn gọn, dễ hiểu các ý chính của đoạn hội thoại sau bằng tiếng Việt. Sử dụng gạch đầu dòng (markdown):\n\n${context}`;
            
            const summary = await callGeminiAI(prompt);
            
            document.getElementById('info-title').textContent = "AI Phân Tích & Tóm Tắt";
            document.getElementById('info-icon').className = "ph ph-magic-wand text-2xl text-purple-500";
            document.getElementById('info-content').innerHTML = `<div class="msg-content p-2">${parseMarkdown(summary)}</div>`;
            
            dom.aiLoading.classList.add('hidden');
            showModal();
        });

        // Click Event (Copy & Dịch)
        dom.msgContainer.addEventListener('click', async (e) => {
            const btnCopy = e.target.closest('.btn-copy');
            if (btnCopy) {
                const text = btnCopy.getAttribute('data-text');
                const temp = document.createElement("textarea");
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand("copy");
                document.body.removeChild(temp);
                showToast("Đã sao chép vào khay nhớ tạm");
                return;
            }

            const btnTranslate = e.target.closest('.btn-translate');
            if (btnTranslate) {
                const msgId = btnTranslate.getAttribute('data-id');
                const originalText = btnTranslate.getAttribute('data-text');
                const icon = btnTranslate.querySelector('i');
                const msgDiv = document.getElementById(`msg-${msgId}`);
                
                if (translatedTexts[msgId]) return;

                icon.className = "ph ph-spinner-gap animate-spin text-sm";
                btnTranslate.disabled = true;

                const prompt = `Dịch văn bản sau sang Tiếng Việt (hoặc Tiếng Anh nếu đang là Tiếng Việt). Giữ nguyên định dạng, chỉ trả về nội dung:\n"${originalText}"`;
                const translated = await callGeminiAI(prompt);
                
                translatedTexts[msgId] = translated;
                
                // Update DOM directly
                if (msgDiv) {
                    const transContainer = msgDiv.querySelector('.trans-container');
                    const transText = msgDiv.querySelector('.trans-text');
                    if(transContainer && transText) {
                        transText.innerHTML = parseMarkdown(translated);
                        transContainer.classList.remove('hidden');
                    }
                }
                icon.className = "ph ph-translate text-sm";
            }
        });

        function showModal() {
            const modal = document.getElementById('info-modal');
            const box = document.getElementById('info-content-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
            }, 10);
        }

        document.getElementById('close-info').addEventListener('click', () => {
            const modal = document.getElementById('info-modal');
            const box = document.getElementById('info-content-box');
            modal.classList.add('opacity-0');
            box.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        });

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('translate-x-[150%]', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.add('translate-x-[150%]', 'opacity-0'), 3500);
        }

        document.getElementById('btn-logout').addEventListener('click', () => {
            if (pollingInterval) clearInterval(pollingInterval);
            dom.loginView.classList.remove('hidden');
            dom.chatView.classList.add('hidden');
            
            loginData = { phone: '', roomId: '', password: '' };
            document.getElementById('password').value = '';
            messages = [];
            renderedMessageIds.clear();
            translatedTexts = {};
            
            Array.from(dom.msgContainer.children).forEach(child => {
                if (child.id !== 'empty-state' && child.id !== 'btn-scroll-bottom') child.remove();
            });
        });

    </script>
</body>
</html>
