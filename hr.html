<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" href="https://cdn.abphotos.link/photos/resized/40x40/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR SmartKit - Quản trị thông minh</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ICON COMPONENTS (Inline SVG) ---
    const IconBriefcase = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>;
    const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>;
    const IconWand = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"></path><path d="m14 7 3 3"></path><path d="M5 6v4"></path><path d="M19 14v4"></path><path d="M10 2v2"></path><path d="M7 8H3"></path><path d="M21 16h-4"></path><path d="M11 3H9"></path></svg>;
    const IconMail = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>;
    const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;
    const IconCheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
    const IconLoader = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;
    const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
    const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
    const IconSparkles = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>;
    const IconSend = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;
    const IconFileCsv = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
    const IconDatabase = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>;
    const IconCode = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>;
    const IconEye = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
    const IconGmail = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>;
    const IconPaperPlane = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;

    // --- MAIN APP ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('candidates');
      const [toast, setToast] = useState(null);
      
      const [apiUrl, setApiUrl] = useState(localStorage.getItem('hr_api_url') || '');
      const [isConfiguring, setIsConfiguring] = useState(!localStorage.getItem('hr_api_url'));
      const [connectionStatus, setConnectionStatus] = useState('demo'); 
      
      const [columns, setColumns] = useState([]);
      const [candidates, setCandidates] = useState([]);
      const [isLoading, setIsLoading] = useState(false);

      // State thông minh: Dùng để đẩy thông tin từ CRM sang Tab Email
      const [prefillData, setPrefillData] = useState(null);

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      const callAPI = async (action, payload = {}) => {
        if (!apiUrl) throw new Error("Chưa cấu hình API URL");
        try {
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, ...payload })
          });
          const result = await res.json();
          if (result.status !== 'success') throw new Error(result.message);
          return result.data;
        } catch (err) {
          console.error("API Call Error:", err);
          throw err;
        }
      };

      useEffect(() => {
        if (!isConfiguring) {
          fetchData();
        }
      }, [isConfiguring]);

      const fetchData = async () => {
        setIsLoading(true);
        if (apiUrl) {
          try {
            const data = await callAPI('getAppData');
            setColumns(data.columns.filter(c => c.id !== 'id'));
            setCandidates(data.candidates);
            setConnectionStatus('connected');
          } catch (error) {
            setConnectionStatus('error');
            showToast("Lỗi kết nối CSDL. Vui lòng kiểm tra lại URL!");
            setMockData();
          }
        } else {
          setConnectionStatus('demo');
          setMockData();
        }
        setIsLoading(false);
      };

      const setMockData = () => {
        setColumns([
          { id: 'Họ và tên', label: 'Họ và tên' },
          { id: 'Vị trí ứng tuyển', label: 'Vị trí ứng tuyển' },
          { id: 'Email', label: 'Email' },
          { id: 'Trạng thái', label: 'Trạng thái' }
        ]);
        setCandidates([
          { id: '1', 'Họ và tên': 'Lâm Tuấn Kiệt', 'Vị trí ứng tuyển': 'Idol Livestream', 'Email': 'kiet@gmail.com', 'Trạng thái': 'Chờ phỏng vấn' },
          { id: '2', 'Họ và tên': 'Nguyễn Văn A', 'Vị trí ứng tuyển': 'Nhân viên Media', 'Email': 'nguyenvana@gmail.com', 'Trạng thái': 'Đã nhận việc' }
        ]);
      };

      // TÍNH NĂNG MỚI: Nhảy từ bảng ứng viên sang Tab Email và tự điền
      const handleJumpToEmail = (cand) => {
        // Tìm các key tương ứng
        let nameKey = Object.keys(cand).find(k => k.toLowerCase().includes('tên'));
        let posKey = Object.keys(cand).find(k => k.toLowerCase().includes('vị trí'));
        let emailKey = Object.keys(cand).find(k => k.toLowerCase() === 'email');

        setPrefillData({
          candId: cand.id,
          name: cand[nameKey] || '',
          position: cand[posKey] || '',
          email: cand[emailKey] || ''
        });
        setActiveTab('emails');
        showToast("Đã lấy thông tin ứng viên!");
      };

      return (
        <div className="flex flex-col md:flex-row h-screen bg-slate-50 relative">
          {/* Modal Cấu hình Database */}
          {isConfiguring && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-200">
                <div className="bg-indigo-600 p-6 text-white">
                  <h3 className="text-xl font-bold flex items-center"><IconDatabase /> <span className="ml-2">Cấu hình Lưu trữ Đám mây (Apps Script)</span></h3>
                  <p className="text-indigo-100 mt-2 text-sm">Để ứng dụng có thể lưu ứng viên trực tiếp vào Google Sheets, vui lòng nhập Web App URL của bạn.</p>
                </div>
                <div className="p-6 space-y-4">
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">Web App URL (Apps Script)</label>
                    <input 
                      type="text" 
                      className="w-full border border-slate-300 focus:ring-2 focus:ring-indigo-500 rounded-lg p-3 outline-none text-sm" 
                      placeholder="https://script.google.com/macros/s/.../exec"
                      value={apiUrl}
                      onChange={e => setApiUrl(e.target.value)}
                    />
                  </div>
                  <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 text-sm text-slate-600">
                    <span className="font-bold">Lưu ý:</span> Web App URL phải được Publish với quyền truy cập <b>"Anyone" (Bất kỳ ai)</b>.
                  </div>
                  <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button 
                      onClick={() => { 
                        setApiUrl(''); 
                        localStorage.removeItem('hr_api_url'); 
                        setIsConfiguring(false); 
                      }} 
                      className="px-5 py-2.5 bg-slate-100 text-slate-700 hover:bg-slate-200 font-medium rounded-lg transition-colors"
                    >
                      Dùng thử (Demo)
                    </button>
                    <button 
                      onClick={() => { 
                        if(!apiUrl) return showToast('Vui lòng nhập URL!');
                        localStorage.setItem('hr_api_url', apiUrl); 
                        setIsConfiguring(false); 
                      }} 
                      className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors flex items-center"
                    >
                      <IconCheckCircle /> <span className="ml-2">Lưu & Kết nối</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Sidebar */}
          <aside className="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col flex-shrink-0">
            <div className="h-16 flex items-center px-6 border-b border-slate-200">
              <div className="text-indigo-600 mr-2"><IconBriefcase /></div>
              <h1 className="font-bold text-xl text-slate-800">HR SmartKit</h1>
            </div>
            <nav className="flex-1 py-4 px-3 space-y-1 overflow-y-auto">
              <NavItem icon={IconUsers} label="Quản lý Ứng viên" isActive={activeTab === 'candidates'} onClick={() => setActiveTab('candidates')} />
              <NavItem icon={IconWand} label="Trợ lý tạo JD" isActive={activeTab === 'jd-builder'} onClick={() => setActiveTab('jd-builder')} />
              <NavItem icon={IconMail} label="Mẫu thư (Email)" isActive={activeTab === 'emails'} onClick={() => setActiveTab('emails')} />
            </nav>
            <div className="p-4 border-t border-slate-200 text-xs text-center flex flex-col items-center">
              <button 
                onClick={() => setIsConfiguring(true)}
                className="w-full mb-2 py-2 border border-slate-200 rounded-md flex justify-center items-center text-slate-600 hover:bg-slate-50 transition-colors"
              >
                <IconDatabase /> <span className="ml-1">Cấu hình DB</span>
              </button>
              {connectionStatus === 'connected' && (
                <span className="text-green-600 font-medium flex items-center justify-center bg-green-50 w-full py-1.5 rounded">
                  <div className="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></div> Đã kết nối Sheets
                </span>
              )}
              {connectionStatus === 'error' && (
                <span className="text-red-500 font-medium flex items-center justify-center bg-red-50 w-full py-1.5 rounded">
                  Lỗi kết nối API
                </span>
              )}
              {connectionStatus === 'demo' && (
                <span className="text-slate-500 font-medium flex items-center justify-center bg-slate-100 w-full py-1.5 rounded">
                  Chế độ Offline (Demo)
                </span>
              )}
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden">
            <header className="h-16 bg-white border-b border-slate-200 flex items-center px-8 shadow-sm flex-shrink-0">
              <h2 className="text-lg md:text-xl font-semibold text-slate-800">
                {activeTab === 'candidates' && 'Cơ sở dữ liệu Ứng viên (Đồng bộ Real-time)'}
                {activeTab === 'jd-builder' && 'Tạo Job Description Thông minh'}
                {activeTab === 'emails' && 'Mẫu thư Tuyển dụng (Free Bird)'}
              </h2>
            </header>

            <div className="flex-1 overflow-y-auto p-4 md:p-8 relative">
              {isLoading && (
                <div className="absolute inset-0 bg-white/70 flex flex-col items-center justify-center z-10">
                  <div className="text-indigo-600 mb-2"><IconLoader /></div>
                  <p className="text-sm font-medium text-slate-600">Đang đồng bộ dữ liệu...</p>
                </div>
              )}
              
              {!isLoading && activeTab === 'candidates' && (
                <CandidatesTab 
                  columns={columns} setColumns={setColumns}
                  candidates={candidates} setCandidates={setCandidates}
                  callAPI={callAPI} connectionStatus={connectionStatus} showToast={showToast}
                  onJumpToEmail={handleJumpToEmail}
                />
              )}
              {!isLoading && activeTab === 'jd-builder' && <JdBuilderTab showToast={showToast} />}
              {!isLoading && activeTab === 'emails' && (
                <EmailsTab 
                  showToast={showToast} 
                  prefillData={prefillData} 
                  callAPI={callAPI} 
                  connectionStatus={connectionStatus}
                  columns={columns}
                  updateLocalCandidate={(id, colId, val) => {
                    const newCands = [...candidates];
                    const idx = newCands.findIndex(c => c.id === id);
                    if(idx > -1) newCands[idx][colId] = val;
                    setCandidates(newCands);
                  }}
                />
              )}
            </div>
          </main>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-lg flex items-center animate-bounce z-50">
              <div className="text-green-400 mr-2"><IconCheckCircle /></div>
              {toast}
            </div>
          )}
        </div>
      );
    };

    // --- SUB COMPONENTS ---

    const NavItem = ({ icon: Icon, label, isActive, onClick }) => (
      <button
        onClick={onClick}
        className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${
          isActive 
            ? 'bg-indigo-50 text-indigo-700 font-medium' 
            : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
        }`}
      >
        <div className={isActive ? 'text-indigo-600' : 'text-slate-400'}><Icon /></div>
        <span>{label}</span>
      </button>
    );

    // 1. Tab Quản lý Ứng viên (Đồng bộ Google Sheets)
    const CandidatesTab = ({ columns, setColumns, candidates, setCandidates, callAPI, connectionStatus, showToast, onJumpToEmail }) => {
      const [newFieldName, setNewFieldName] = useState('');
      const [isAddingField, setIsAddingField] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');

      const handleAddField = async () => {
        if (!newFieldName.trim()) return;
        setIsAddingField(false);
        setIsSaving(true);
        
        if (connectionStatus === 'connected') {
          try {
            const data = await callAPI('addColumn', { colName: newFieldName });
            setColumns(data.columns.filter(c => c.id !== 'id'));
            setCandidates(data.candidates);
            showToast(`Đã thêm trường tự động: "${newFieldName}"`);
          } catch (err) {
            showToast("Lỗi khi thêm trường!");
          }
        } else {
          setTimeout(() => {
            setColumns([...columns, { id: newFieldName, label: newFieldName }]);
            showToast(`(Demo) Đã tạo cột: "${newFieldName}"`);
          }, 500);
        }
        setIsSaving(false);
        setNewFieldName('');
      };

      const handleAddCandidate = async () => {
        const newCand = {};
        columns.forEach(c => newCand[c.id] = '');
        newCand['Họ và tên'] = 'Ứng viên mới';
        setIsSaving(true);

        if (connectionStatus === 'connected') {
          try {
            const data = await callAPI('addCandidate', { candidateObj: newCand });
            setColumns(data.columns.filter(c => c.id !== 'id'));
            setCandidates(data.candidates);
            showToast("Đã tạo ứng viên mới!");
          } catch (err) {
            showToast("Lỗi khi tạo ứng viên!");
          }
        } else {
          setTimeout(() => {
            setCandidates([...candidates, { id: Date.now().toString(), ...newCand }]);
            showToast("(Demo) Đã tạo ứng viên!");
          }, 500);
        }
        setIsSaving(false);
      };

      const updateCellValue = (id, colId, value) => {
        const newCands = [...candidates];
        const idx = newCands.findIndex(c => c.id === id);
        if (idx > -1) {
          newCands[idx][colId] = value;
          setCandidates(newCands);
        }
      };

      const syncCellToSheets = async (id, colId, value) => {
        if (connectionStatus === 'connected') {
          try {
            await callAPI('updateCandidate', { id, colId, value });
            showToast("Đã lưu tự động");
          } catch (err) {
            showToast("Lỗi khi lưu dữ liệu!");
          }
        }
      };

      const exportToCSV = () => {
        if (candidates.length === 0) return showToast("Không có dữ liệu để xuất!");
        
        const headers = columns.map(c => c.label).join(",");
        const rows = candidates.map(cand => 
          columns.map(c => `"${(String(cand[c.id] || '')).replace(/"/g, '""')}"`).join(",")
        );
        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers, ...rows].join("\n");
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `DS_UngVien_${new Date().toLocaleDateString('vi-VN')}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Đã xuất file CSV thành công!");
      };

      const filteredCandidates = candidates.filter(cand => 
        Object.values(cand).some(val => 
          String(val).toLowerCase().includes(searchTerm.toLowerCase())
        )
      );

      const getSmartStatusStyle = (label, value) => {
        if (!label.toLowerCase().includes('trạng thái') && !label.toLowerCase().includes('status')) return '';
        if (!value) return '';
        
        const val = String(value).toLowerCase();
        if (val.includes('nhận') || val.includes('đậu') || val.includes('pass') || val.includes('ok')) 
          return 'bg-green-100 text-green-800 font-medium border-green-200';
        if (val.includes('rớt') || val.includes('từ chối') || val.includes('fail') || val.includes('hủy')) 
          return 'bg-red-100 text-red-800 font-medium border-red-200';
        if (val.includes('phỏng vấn') || val.includes('chờ') || val.includes('pv') || val.includes('gửi thư')) 
          return 'bg-amber-100 text-amber-800 font-medium border-amber-200';
          
        return 'bg-slate-100 text-slate-800 font-medium border-slate-200';
      };

      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-full">
          <div className="p-4 border-b border-slate-200 flex flex-wrap justify-between items-center bg-slate-50/50 gap-4">
            <div className="flex space-x-2">
              <button 
                onClick={handleAddCandidate}
                disabled={isSaving}

                  <button onClick={handleAddField} className="bg-slate-800 text-white px-3 py-1.5 rounded-md text-sm font-medium hover:bg-slate-900">Lưu</button>

                >
                  <IconPlus /> <span>Tạo cột mở rộng</span>
                </button>
              )}
              
              <button 
                onClick={exportToCSV}
                className="flex items-center space-x-2 bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-100 transition-colors"
                title="Xuất dữ liệu ra file Excel/CSV"
              >
                <IconFileCsv /> <span>Xuất CSV</span>
              </button>
            </div>
            
            <div className="flex items-center space-x-4">
              <div className="relative">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                  <IconSearch />
                </div>
                <input 
                  type="text" 
                  placeholder="Tìm kiếm ứng viên..." 
                  className="pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm w-48 md:w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                />
              </div>
              {isSaving && <span className="text-sm text-indigo-600 font-medium animate-pulse flex items-center"><div className="mr-2"><IconLoader /></div> Đang đồng bộ...</span>}
            </div>
          </div>

          <div className="overflow-x-auto overflow-y-auto flex-1 p-2">
            <table className="w-full text-left border-collapse min-w-[600px]">
              <thead className="sticky top-0 bg-slate-50 z-10 shadow-sm rounded-t-lg">
                <tr className="text-slate-600 text-sm border-b border-slate-200">
                  <th className="py-3 px-4 font-semibold whitespace-nowrap w-16">Tools</th>
                  {columns.map(col => (
                    <th key={col.id} className="py-3 px-4 font-semibold whitespace-nowrap">
                      {col.label}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filteredCandidates.length === 0 ? (
                  <tr><td colSpan={columns.length + 1} className="text-center py-8 text-slate-500">
                    {searchTerm ? "Không tìm thấy ứng viên nào phù hợp." : "Chưa có dữ liệu ứng viên."}
                  </td></tr>
                ) : (
                  filteredCandidates.map((candidate) => (
                    <tr key={candidate.id} className="border-b border-slate-100 hover:bg-slate-50/80 group transition-colors">
                      {/* TÍNH NĂNG MỚI: Nút gửi thư cho từng hàng */}
                      <td className="py-2 px-4 text-center">
                        <button 
                          onClick={() => onJumpToEmail(candidate)}
                          className="p-1.5 text-indigo-500 hover:bg-indigo-100 hover:text-indigo-700 rounded transition-colors"
                          title="Gửi Email (Tự động điền)"
                        >
                          <IconMail />
                        </button>
                      </td>
                      {columns.map(col => {
                        const statusClass = getSmartStatusStyle(col.label, candidate[col.id]);
                        return (
                          <td key={`${candidate.id}-${col.id}`} className="py-2 px-4 text-sm text-slate-800">
                            <input 
                              type="text"
                              className={`bg-transparent border hover:border-slate-300 focus:border-indigo-500 focus:bg-white rounded px-2 py-1.5 w-full transition-all outline-none ${statusClass ? statusClass : 'border-transparent'}`}
                              value={candidate[col.id] || ''}
                              onChange={(e) => updateCellValue(candidate.id, col.id, e.target.value)}
                              onBlur={(e) => syncCellToSheets(candidate.id, col.id, e.target.value)}
                              placeholder="..."
                            />
                          </td>
                        );
                      })}
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

          content: `VỊ TRÍ: TRỢ LÝ PHIÊN DỊCH TIẾNG TRUNG\nCấp bậc: [LEVEL]\n\n1. MÔ TẢ CÔNG VIỆC:\n- Hỗ trợ phiên dịch trực tiếp Trung - Việt trong các cuộc họp, trao đổi công việc trong nội bộ công ty\n- Phiên dịch cá văn bản, hợp đồng, tài liệu trong công ty\n- Ngoài ra còn có các công việc khác theo chỉ thị củ cấp trên .\n- Là cầu nối giữa Lãnh đạo và nội bộ nhân sự trong công ty.\n\n2. YÊU CẦU CÔNG VIỆC:\n- Tiếng Trung thành thạo 4 kỹ năng ( HSK5 trở lên )\n- Có kinh nghiệm ít nhất 1 năm về phiên dịch tiếng Trung / Việt\n- Sử dụng thành thạo tin học văn phòng ( Word, Excel, Outlook,.. )\n- Kỹ năng phiên dịch song song, kỹ năng giao tiếp, phản xạ ngôn ngữ, xử lý tình huống tốt.\n- Có trách nhiệm trong công việc\n\n3. QUYỀN LỢI:\n- Lương cơ bản: 14.000.000 - 15.000.000 VND\n- Thử việc 1 tháng\n- Phụ cấp : chuyên cần\n- Đặc biệt:\n  + KÝ HỢP ĐỒNG LAO ĐỘNG\n  + Đóng BHXH, BHYT, BHTN đầy đủ theo quy định\n\n4. THÔNG TIN CÔNG TY:\n- Thời gian làm việc: 9:00 - 18:00 ( Không OT )\n- Được off 1 ngày trong tuần\n- Office address: Số 1 Trương Đình Hợi, p18, Quận 4, TP. HCM`
        },
        'operator': {
          role: 'Vận hành Live - Livestream Operation Executive',
          skills: 'Vận hành live, OBS, Bắt trend nhanh',
          content: `VỊ TRÍ: VẬN HÀNH LIVE - LIVESTREAM OPERATION EXECUTIVE\nCấp bậc: [LEVEL]\n\n1. MÔ TẢ CÔNG VIỆC:\n- Tìm kiếm user cho IDOL ( khi có user sẽ đưa cho IDOL tự chăm - Hỗ trợ trong việc nhắn tin giữa IDOL và user, giải quyết vấn đề )\n- Ngồi cạnh MC hỗ trợ điều khiển các thiết bị Live ( đèn, âm thanh,..) đảm bảo đường truyền live ổn định.\n- Làm việc với MC, IDOL để briefing nội dung\n- Sau khi xuống live kiểm tra các thiết bị 1 lượt.\n\n2. YÊU CẦU CÔNG VIỆC:\n- Có kinh nghiệm Vận hành live từ 6 tháng trở lên\n- Có kinh nghiệm vận hành trên các nền tảng MXH\n- Sử dụng thành thạo tin học văn phòng ( Word, Excel, Outlook,..)\n- Có kinh nghiệm làm việc với đội nhóm\n- Giao tiếp Tiếng Anh cơ bản\n- Bắt trend nhanh, lập kế hoạch quản lý time tốt\n- Có trách nhiệm trong công việc.\n\n3. QUYỀN LỢI:\n- Lương cơ bản: 15.000.000 - 16.000.000 VND\n- Daily bonus hấp dẫn từ 200.000 - 1.700.000 VND\n- KÝ HỢP ĐỒNG HỢP TÁC\n- Phụ cấp : Chuyên cần, tiền thưởng hiệu suất, thưởng KPI\n- Được đào tạo bài bản trong công việc dẫn live và quản lý IDOL\n\n4. THÔNG TIN CÔNG TY:\n- Thời gian làm việc: 8:00 - 17:00 ( Không OT )\n- Được off 1 ngày trong tuần (Không OFF Thứ 7, CN)\n- Office address: Số 1 Trương Đình Hợi, p18, Quận 4, TP. HCM`
        }
      };

      const handlePresetChange = (e) => {

            if (tone === 'creative') {

                .replace('1. MÔ TẢ CÔNG VIỆC:', '🎯 1. SỨ MỆNH CỦA BẠN:')

              } else {
                template = `VỊ TRÍ: ${role.toUpperCase()}\nCấp bậc: ${level}\n\n1. MÔ TẢ CÔNG VIỆC:\n- Tham gia phát triển và thực thi các kế hoạch liên quan đến vị trí ${role}.\n- Chủ động nghiên cứu, đề xuất các giải pháp nâng cao hiệu quả công việc.\n- Phối hợp với các phòng ban khác để đảm bảo tiến độ dự án.\n- Báo cáo kết quả định kỳ cho quản lý trực tiếp.\n\n2. YÊU CẦU CÔNG VIỆC:\n- Có kinh nghiệm làm việc ở vị trí tương đương (Level yêu cầu: ${level}).\n- Nắm vững các kỹ năng chuyên môn: ${skills || 'Kỹ năng giải quyết vấn đề, làm việc nhóm'}.\n- Tinh thần trách nhiệm cao, chịu được áp lực công việc, có tư duy logic tốt.\n- Tiếng Anh giao tiếp và đọc hiểu tài liệu chuyên ngành là một lợi thế.\n\n3. QUYỀN LỢI ĐƯỢC HƯỞNG:\n- Mức lương cạnh tranh, tương xứng với năng lực (Thỏa thuận khi phỏng vấn).\n- Lương tháng 13, thưởng hiệu quả công việc, thưởng các dịp Lễ/Tết.\n- Đóng BHXH, BHYT đầy đủ theo quy định của pháp luật.\n- Môi trường làm việc năng động, trẻ trung, cơ hội thăng tiến rõ ràng.\n- Khám sức khỏe định kỳ, tham gia Company Trip hàng năm.`;
              }
            } else {
              template = `JOB TITLE: ${role.toUpperCase()}\nLevel: ${level}\n\n1. JOB DESCRIPTION:\n- Participate in developing and executing plans related to ${role}.\n- Proactively research and propose solutions to improve efficiency.\n- Coordinate with cross-functional teams to ensure project timelines.\n- Report performance metrics to the direct manager.\n\n2. REQUIREMENTS:\n- Proven experience in a similar role (Level: ${level}).\n- Core competencies: ${skills || 'Problem-solving skills, teamwork'}.\n- High sense of responsibility, ability to work under pressure, good logical thinking.\n- English proficiency is a must.\n\n3. BENEFITS:\n- Competitive salary commensurate with experience.\n- 13th-month salary, performance bonus, holiday bonuses.\n- Full social insurance, health insurance according to labor laws.\n- Dynamic, youthful working environment with clear promotion opportunities.\n- Annual health check-ups and Company Trip.`;
            }
          }
          
          setResult(template.trim());
          setIsGenerating(false);
          showToast("Đã xuất Job Description thành công!");
        }, 800);
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(result).then(() => showToast("Đã copy JD vào clipboard!"));
      };
      
      const downloadTxt = () => {

        element.href = URL.createObjectURL(file);
        element.download = `JD_${role.replace(/\s+/g, '_')}.txt`;

        element.click();
        showToast("Đã tải xuống file TXT!");
      };

      const generateAIPrompt = () => {
        if (!result) return showToast("Vui lòng tạo JD trước!");
        const prompt = `Hãy đóng vai một chuyên gia nhân sự (Headhunter) xuất sắc. Tôi có một bản nháp Mô tả công việc (Job Description) cho vị trí ${role} (Cấp bậc: ${level}). \nHãy viết lại bản JD này sao cho chuyên nghiệp, rõ ràng, thu hút ứng viên và tối ưu hóa các từ khóa: ${skills}.\n\nĐây là bản gốc:\n"""\n${result}\n"""`;
        navigator.clipboard.writeText(prompt).then(() => showToast("Đã copy lệnh Prompt AI vào clipboard!"));
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full">

                  className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-indigo-50/50 font-medium text-indigo-900"

                >
                  <option value="custom">-- Tự nhập vị trí (Custom) --</option>
                  <option value="idol">Idol Livestream on Tiktok</option>
                  <option value="mc">MC Livestream on Tiktok</option>
                  <option value="media">Nhân viên Media (Chụp ảnh - Edit - Quay - Dựng)</option>
                  <option value="makeup">Makeup Artist - Chuyên viên trang điểm</option>

                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Cấp bậc (Level)</label>
                  <select

                  >

    // 3. Tab Mẫu Email
    const EmailsTab = ({ showToast, prefillData, callAPI, connectionStatus, columns, updateLocalCandidate }) => {

          [id]: prev[id] === 'code' ? 'preview' : 'code'
        }));
      };

      const fillTemplate = (htmlText) => {

          .replace(/LÂM TUẤN KIỆT/g, candName || 'LÂM TUẤN KIỆT')

          .replace(/\[Ngày trong tuần\], Ngày \[DD\/MM\/YYYY\]|23\/05\/2026|18\/05\/2026/g, date || '[Ngày]')
          .replace(/\[Giờ:Phút\]|09:00 - 16:00|9h30/g, time || '[Giờ]')
          .replace(/\[Địa chỉ công ty hoặc Link phòng họp\]|Số 1 Trương Định Hội, Phường 18, Quận 4, TP\. HCM|1 Trương Đình Hợi, P\.18, Q\.4/g, location || '[Địa điểm]')
          .replace(/\[Giờ\] ngày \[DD\/MM\/YYYY\]|19\/05\/2026|17\/05\/2026/g, deadline || '[Hạn chót]')
          .replace(/\[Số điện thoại\]|\[Số điện thoại HR\]|0706013785|0879342346/g, hrPhone || '[Số điện thoại HR]');
      };

      const templates = [
        {
          id: 1, 
          name: "1. Thư mời Phỏng vấn (FREE BIRD)",
          statusTag: "Đã mời Phỏng vấn",
          subject: "FREE BIRD ENTERTAINMENT - THƯ MỜI PHỎNG VẤN - [Vị Trí]",
          isHtml: true,
          body: `<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>THƯ MỜI PHỎNG VẤN - FREE BIRD ENTERTAINMENT</title>
  <style type="text/css">
    body { margin: 0; padding: 0; min-width: 100%; background-color: #000000; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }

              <h3 className="font-semibold text-slate-800 text-sm flex items-center">
                <span className="w-2 h-2 rounded-full bg-indigo-500 mr-2 animate-pulse"></span>
                Bộ Tinh chỉnh Cá nhân hóa Tự động
              </h3>
              {candId && <span className="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-1 rounded-full">Đang đồng bộ với CRM</span>}
            </div>
            
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Email Ứng Viên (*)</label>
                <input type="email" placeholder="VD: ungvien@gmail.com" value={candEmail} onChange={(e)=>setCandEmail(e.target.value)} className="w-full px-3 py-2 border border-blue-300 bg-blue-50 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none font-medium" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Tên Ứng Viên</label>
                <input type="text" placeholder="VD: Nguyễn Văn A" value={candName} onChange={(e)=>setCandName(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Vị trí</label>
                <input type="text" placeholder="VD: Marketing Manager" value={position} onChange={(e)=>setPosition(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Ngày (Phỏng vấn/Làm việc)</label>
                <input type="text" placeholder="VD: 25/06/2026" value={date} onChange={(e)=>setDate(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Giờ</label>
                <input type="text" placeholder="VD: 09:30" value={time} onChange={(e)=>setTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
              <div className="col-span-2">
                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Địa điểm / Link Meeting</label>
                <input type="text" placeholder="VD: Tầng 3, Tòa nhà ABC" value={location} onChange={(e)=>setLocation(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">SĐT HR Liên hệ</label>
                <input type="text" placeholder="VD: 090xxxxxxx" value={hrPhone} onChange={(e)=>setHrPhone(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 pb-10">
            {templates.map(tpl => (
              <div key={tpl.id} className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col h-auto min-h-[600px]">
                <div className="mb-3 border-b border-slate-100 pb-3 flex justify-between items-start">
                  <div>
                    <h3 className="font-bold text-slate-800 text-lg">{tpl.name}</h3>
                    <div className="mt-1 text-sm">
                      <span className="font-semibold text-slate-500">Subject: </span>
                      <span className="text-indigo-700 font-medium">{fillTemplate(tpl.subject)}</span>
                    </div>
                  </div>
                  
                  <button 
                    onClick={() => toggleViewMode(tpl.id)} 
                    className="flex items-center text-xs space-x-1 px-3 py-1.5 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded transition-colors whitespace-nowrap"
                    title={viewModes[tpl.id] === 'code' ? 'Xem lại giao diện trực quan' : 'Hiện Full mã HTML nguồn'}
                  >
                    {viewModes[tpl.id] === 'code' ? <IconEye /> : <IconCode />}
                    <span>{viewModes[tpl.id] === 'code' ? 'Xem giao diện' : 'Xem Code HTML'}</span>
                  </button>
                </div>
                
                <div className="flex-1 bg-slate-900 rounded-lg overflow-y-auto mb-4 border border-slate-700 shadow-inner relative max-h-[550px]">
                  {viewModes[tpl.id] === 'code' ? (
                    <pre className="p-4 text-[13px] text-green-400 whitespace-pre-wrap font-mono leading-relaxed">
                      {fillTemplate(tpl.body)}
                    </pre>
                  ) : (
                    <div 
                      className="w-full h-full"
                      dangerouslySetInnerHTML={{ __html: fillTemplate(tpl.body) }}
                    />
                  )}
                </div>
                
                <div className="flex flex-col space-y-2 mt-auto">
                  {/* Nút gửi mail tự động qua hệ thống */}
                  <button 
                    onClick={() => sendViaAppsScript(tpl.id, tpl.subject, tpl.body, tpl.statusTag)}
                    disabled={isSending[tpl.id]}
                    className="w-full flex items-center justify-center space-x-2 bg-indigo-600 text-white hover:bg-indigo-700 py-3 rounded-lg font-medium transition-colors shadow-sm disabled:opacity-70"
                  >
                    {isSending[tpl.id] ? <IconLoader /> : <IconPaperPlane />}
                    <span>{isSending[tpl.id] ? "Đang xử lý gửi..." : "Gửi trực tiếp (Tự động cập nhật CRM)"}</span>
                  </button>

                  <div className="flex space-x-2">
                    <button 
                      onClick={() => handleSendDirectEmail(tpl.subject, tpl.body)}
                      className="flex-1 flex items-center justify-center space-x-2 bg-slate-100 text-slate-700 hover:bg-slate-200 py-2.5 rounded-lg font-medium transition-colors text-sm"
                    >
                      <IconGmail /> <span>Mở qua Gmail</span>
                    </button>
                    <button 
                      onClick={() => handleCopyHTMLCode(tpl.subject, tpl.body)}
                      className="flex-1 flex items-center justify-center space-x-2 bg-slate-100 text-slate-700 hover:bg-slate-200 py-2.5 rounded-lg font-medium transition-colors text-sm"
                    >
                      <IconCopy /> <span>Copy HTML</span>
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
