<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALPHA ZONE - Mail Workspace</title>
    <link rel="icon" type="image/png" href="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --primary: #D4AF37; 
            --primary-hover: #F3CA45;
            --bg: #0A0A0C;
            --surface: #141518;
            --surface-hover: #1E1F24;
            --text: #F3F4F6; 
            --text-sub: #9CA3AF; 
            --border: #27272A;
            --danger: #EF4444;
            --unread: #3B82F6;
            --success: #10B981;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000;
            color: var(--text); 
            height: 100vh; 
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100vh; background-color: var(--bg);
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        @media (min-width: 501px) {
            .app-container { height: 90vh; max-height: 850px; border-radius: 24px; border: 1px solid var(--border); }
        }

        .view { display: none; height: 100%; flex-direction: column; position: absolute; width: 100%; top: 0; left: 0; background: var(--bg); z-index: 1; animation: fade 0.2s ease; }
        .view.active { display: flex; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* Auth */
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.08) 0%, var(--bg) 60%); }
        .auth-card { width: 100%; max-width: 340px; }
        .field-group { margin-bottom: 16px; }
        .field-label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; margin-left: 4px; font-weight: 500; }
        .field { width: 100%; padding: 16px; border: 1.5px solid var(--border); border-radius: 14px; background: var(--surface); color: #FFF; font-size: 15px; transition: 0.2s; font-family: inherit; }
        .field:focus { border-color: var(--primary); background: #1A1A20; box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); }
        
        .btn { background: var(--surface); color: var(--text); border: none; width: 100%; padding: 16px; border-radius: 14px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-gold { background: var(--primary); color: #000; }
        .btn-gold:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn:active { transform: scale(0.97); }

        /* App UI */
        .header { padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 12px; background: rgba(10,10,12,0.9); backdrop-filter: blur(20px); z-index: 10; border-bottom: 1px solid var(--border); }
        .menu-btn { padding: 8px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .search-box { flex: 1; background: var(--surface); height: 44px; border-radius: 22px; display: flex; align-items: center; padding: 0 16px; gap: 10px; border: 1px solid transparent; transition: 0.2s; }
        .search-box input { border: none; background: transparent; flex: 1; color: #FFF; font-size: 15px; }

        /* Mail List Items */
        .mail-list { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .mail-item { padding: 16px; display: flex; gap: 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; position: relative; }
        .mail-item:hover { background: var(--surface); }
        .mail-item.unread .sender-name { font-weight: 700; color: #FFF; }
        .mail-item.unread .subject-text { font-weight: 600; color: #FFF; }
        .mail-item.unread::before { content: ''; position: absolute; left: 6px; top: 32px; width: 8px; height: 8px; background: var(--unread); border-radius: 50%; }

        .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 600; font-size: 16px; flex-shrink: 0; background-size: cover; background-position: center; border: 1px solid var(--border); text-transform: uppercase; }
        .ava-1 { background: #A7F3D0; } .ava-2 { background: #FDE68A; } .ava-3 { background: #FECACA; } .ava-4 { background: #BFDBFE; } .ava-5 { background: var(--primary); }

        .mail-content-wrapper { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .mail-header-row { display: flex; justify-content: space-between; align-items: baseline; }
        .sender-name { font-size: 15px; color: #E5E7EB; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .time-badge { font-size: 11px; color: var(--text-sub); flex-shrink: 0; }
        .subject-text { font-size: 14px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .preview-text { font-size: 12px; color: #6B7280; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

        /* Panels */
        .panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 90; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .panel.open { transform: translateX(0); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--bg); }
        .action-icon { cursor: pointer; color: var(--text-sub); transition: 0.2s; }
        .action-icon:hover { color: #FFF; }

        /* Sidebar */
        .sidebar-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; opacity: 0; visibility: hidden; transition: 0.3s; backdrop-filter: blur(2px); }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar { position: absolute; top: 0; left: -280px; width: 280px; height: 100%; background: #0E0F12; z-index: 101; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .sidebar.active { left: 0; }
        .sb-header { padding: 30px 20px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .sb-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; color: var(--text-sub); cursor: pointer; font-weight: 500; transition: 0.2s; }
        .sb-item:hover { background: var(--surface); color: #FFF; }
        .sb-item.active { background: rgba(212, 175, 55, 0.1); color: var(--primary); border-right: 3px solid var(--primary); }

        /* Attachments */
        .attach-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0; border-top: 1px solid var(--border); margin-top: 10px; }
        .attach-tag { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .attach-tag i { color: var(--primary); }
        .attach-tag .remove { cursor: pointer; color: var(--danger); margin-left: 4px; }

        /* Compose */
        .compose-toolbar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); background: #0A0A0C; }
        .tool-btn { padding: 8px; border-radius: 10px; color: var(--text-sub); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .tool-btn:hover { background: var(--surface); color: #FFF; }

        /* Profile */
        .profile-ava-section { text-align: center; margin-bottom: 30px; }
        .profile-ava-large { width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 16px; border: 2px solid var(--primary); background-size: cover; background-position: center; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; background-color: var(--surface); font-size: 40px; font-weight: 700; color: #FFF; }
        .profile-ava-large .edit-badge { position: absolute; bottom: 4px; right: 4px; background: var(--primary); color: #000; padding: 8px; border-radius: 50%; border: 3px solid var(--bg); display: flex; }

        .fab { position: absolute; bottom: 24px; right: 24px; width: 60px; height: 60px; background: var(--primary); border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(212,175,55,0.4); z-index: 80; cursor: pointer; transition: 0.2s; color: #000; }
        .fab:hover { transform: scale(1.05); }

        .toast { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 14px 28px; border-radius: 30px; font-size: 14px; font-weight: 600; opacity: 0; visibility: hidden; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s; white-space: nowrap; }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

        #c-body:empty:before { content: attr(data-placeholder); color: #6B7280; pointer-events: none; }
        #c-body { line-height: 1.6; outline: none; }
        #c-body img { max-width: 100%; border-radius: 12px; margin: 12px 0; }

        .skeleton { background: linear-gradient(90deg, var(--surface) 25%, #2A2B30 50%, var(--surface) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 4px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .lucide-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">

    <!-- LOGIN VIEW -->
    <div id="login-view" class="view active">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div style="text-align: center; margin-bottom: 40px;">
                    <img src="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png" style="width: 80px; margin-bottom: 20px;">
                    <h2 style="font-weight: 700; font-size: 28px; letter-spacing: -0.5px;">Alpha Mail</h2>
                    <p style="color: var(--text-sub); font-size: 15px; margin-top: 8px;">Workspace an toàn & riêng tư</p>
                </div>
                <div class="field-group">
                    <input type="email" id="l-email" class="field" placeholder="Email của bạn">
                </div>
                <div class="field-group">
                    <input type="password" id="l-pass" class="field" placeholder="Mật khẩu">
                </div>
                <button class="btn btn-gold" id="btn-login" onclick="auth('login')">Đăng nhập</button>
                <div style="text-align: center; margin-top: 30px;">
                    <span style="color: var(--text-sub); font-size: 14px; cursor: pointer;" onclick="switchV('signup-view')">Chưa có tài khoản? <b style="color: #FFF;">Đăng ký ngay</b></span>
                </div>
            </div>
        </div>
    </div>

    <!-- SIGNUP VIEW -->
    <div id="signup-view" class="view">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h2 style="font-weight: 700; font-size: 26px; margin-bottom: 8px;">Đăng ký</h2>
                <p style="color: var(--text-sub); font-size: 14px; margin-bottom: 30px;">Nhận địa chỉ @alphazone.io.vn miễn phí</p>
                <div class="field-group">
                    <input type="text" id="s-prefix" class="field" placeholder="Tên người dùng (vd: huy)">
                </div>
                <div class="field-group">
                    <input type="password" id="s-pass" class="field" placeholder="Mật khẩu">
                </div>
                <button class="btn btn-gold" id="btn-signup" onclick="auth('signup')">Hoàn tất đăng ký</button>
                <button class="btn" style="margin-top:14px; border: 1px solid var(--border); background: transparent;" onclick="switchV('login-view')">Quay lại</button>
            </div>
        </div>
    </div>

    <!-- SETUP PROFILE (Bắt buộc sau đăng ký) -->
    <div id="setup-view" class="view">
        <div class="auth-wrapper" style="background: var(--bg);">
            <div class="auth-card">
                <h2 style="font-weight: 700; font-size: 26px; margin-bottom: 8px;">Chào mừng!</h2>
                <p style="color: var(--text-sub); font-size: 14px; margin-bottom: 30px;">Hãy hoàn tất hồ sơ để bắt đầu</p>
                
                <div class="profile-ava-section">
                    <div id="setup-ava-preview" class="profile-ava-large" onclick="document.getElementById('setup-ava-input').click()">
                        <span id="setup-ava-text">?</span>
                        <div class="edit-badge"><i data-lucide="camera" size="18"></i></div>
                    </div>
                    <input type="file" id="setup-ava-input" hidden accept="image/*" onchange="handleAvaSelect(this, 'setup-ava-preview', 'setup-ava-text')">
                </div>

                <div class="field-group">
                    <label class="field-label">Họ và tên</label>
                    <input type="text" id="setup-name" class="field" placeholder="Vd: Nguyễn Văn A">
                </div>
                <div class="field-group">
                    <label class="field-label">Số điện thoại</label>
                    <input type="tel" id="setup-phone" class="field" placeholder="Nhập SĐT của bạn">
                </div>
                <button class="btn btn-gold" onclick="saveProfile(true)">Vào Hộp Thư</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP VIEW -->
    <div id="app-view" class="view">
        <div class="header">
            <div class="menu-btn" onclick="toggleSidebar()"><i data-lucide="menu" color="#FFF"></i></div>
            <div class="search-box">
                <i data-lucide="search" size="18" color="#9CA3AF"></i>
                <input type="text" id="q" placeholder="Tìm kiếm trong thư..." oninput="renderMails()">
            </div>
            <div class="avatar" id="header-ava" onclick="toggleSidebar()" style="width: 32px; height: 32px; font-size: 13px; cursor: pointer;"></div>
        </div>
        
        <div id="mail-list" class="mail-list"></div>
        <div class="fab" onclick="openCompose()"><i data-lucide="plus" size="32"></i></div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sb-header" onclick="openProfile()">
            <div id="sidebar-ava" class="avatar" style="width: 54px; height: 54px; margin-bottom: 12px; font-size: 20px;"></div>
            <h3 id="sidebar-name" style="color: #FFF; font-size: 17px; font-weight: 600;">Người dùng</h3>
            <p id="sb-email" style="color: var(--text-sub); font-size: 13px; margin-top: 2px;"></p>
        </div>
        <div style="flex: 1; padding: 12px 0;">
            <div id="nav-inbox" class="sb-item active" onclick="setFolder('inbox')"><i data-lucide="inbox" size="20"></i> Hộp thư đến</div>
            <div id="nav-sent" class="sb-item" onclick="setFolder('sent')"><i data-lucide="send" size="20"></i> Đã gửi</div>
            <div id="nav-profile" class="sb-item" onclick="openProfile()"><i data-lucide="user-cog" size="20"></i> Cài đặt tài khoản</div>
        </div>
        <div style="padding: 20px; border-top: 1px solid var(--border);">
            <div class="sb-item" style="padding: 10px; color: var(--danger);" onclick="logout()"><i data-lucide="log-out" size="20"></i> Đăng xuất</div>
        </div>
    </div>

    <!-- PROFILE PANEL -->
    <div id="profile-panel" class="panel">
        <div class="panel-header">
            <i data-lucide="arrow-left" class="action-icon" onclick="closePanel('profile-panel')"></i>
            <span style="font-weight: 600; font-size: 16px;">Thông tin cá nhân</span>
            <div style="width: 24px;"></div>
        </div>
        <div class="panel-content">
            <div class="profile-ava-section">
                <div id="profile-ava-preview" class="profile-ava-large" onclick="document.getElementById('profile-ava-input').click()">
                    <span id="profile-ava-text"></span>
                    <div class="edit-badge"><i data-lucide="camera" size="20"></i></div>
                </div>
                <input type="file" id="profile-ava-input" hidden accept="image/*" onchange="handleAvaSelect(this, 'profile-ava-preview', 'profile-ava-text')">
            </div>

            <div style="margin-bottom: 40px;">
                <h4 style="font-size: 13px; color: var(--primary); letter-spacing: 1px; margin-bottom: 20px; font-weight: 700;">DỮ LIỆU CƠ BẢN</h4>
                <div class="field-group">
                    <label class="field-label">Họ và tên</label>
                    <input type="text" id="p-name" class="field">
                </div>
                <div class="field-group">
                    <label class="field-label">Số điện thoại</label>
                    <input type="tel" id="p-phone" class="field">
                </div>
                <button class="btn btn-gold" id="btn-save-p" onclick="saveProfile(false)">Lưu thay đổi</button>
            </div>

            <div style="margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--border);">
                <h4 style="font-size: 13px; color: var(--danger); letter-spacing: 1px; margin-bottom: 20px; font-weight: 700;">BẢO MẬT</h4>
                <div class="field-group">
                    <input type="password" id="p-old-pass" class="field" placeholder="Mật khẩu hiện tại">
                </div>
                <div class="field-group">
                    <input type="password" id="p-new-pass" class="field" placeholder="Mật khẩu mới">
                </div>
                <button class="btn" style="border: 1px solid var(--border); background: transparent;" onclick="changePassword()">Cập nhật mật khẩu</button>
            </div>
        </div>
    </div>

    <!-- READ MAIL PANEL -->
    <div id="read-panel" class="panel">
        <div class="panel-header">
            <i data-lucide="arrow-left" class="action-icon" onclick="closePanel('read-panel')"></i>
            <div style="display: flex; gap: 18px;">
                <i data-lucide="reply" class="action-icon" onclick="replyMail()" title="Trả lời"></i>
                <i data-lucide="trash-2" class="action-icon" style="color: var(--danger)" onclick="deleteMail()" title="Xóa thư"></i>
            </div>
        </div>
        <div class="panel-content" style="padding: 0;">
            <div style="padding: 24px;">
                <h2 id="r-sub" style="font-size: 22px; font-weight: 700; margin-bottom: 26px; line-height: 1.4;"></h2>
                <div style="display: flex; gap: 14px; align-items: center;">
                    <div id="r-ava" class="avatar ava-5"></div>
                    <div style="flex: 1;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span id="r-sender" style="font-weight: 600; font-size: 15px; color: #FFF;"></span>
                            <span id="r-time" style="font-size: 12px; color: var(--text-sub);"></span>
                        </div>
                        <div id="r-email" style="font-size: 13px; color: var(--text-sub); margin-top: 2px;"></div>
                    </div>
                </div>
                <!-- Attachments Read Area -->
                <div id="r-attachments" class="attach-list" style="display: none;"></div>
            </div>
            <div style="background: #FFF; border-radius: 20px 20px 0 0; min-height: 400px; overflow: hidden; margin-top: 10px;">
                <iframe id="r-body-frame" style="width: 100%; height: 600px; border: none; background: #FFF;" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin"></iframe>
            </div>
        </div>
    </div>

    <!-- COMPOSE PANEL -->
    <div id="compose-panel" class="panel">
        <div class="panel-header">
            <i data-lucide="x" class="action-icon" onclick="closePanel('compose-panel')"></i>
            <span style="font-weight: 600; font-size: 16px;">Soạn thư mới</span>
            <i data-lucide="send" class="action-icon" style="color: var(--primary)" onclick="sendMail()" id="btn-send"></i>
        </div>
        
        <div class="compose-toolbar">
            <div class="tool-btn" onclick="document.getElementById('attach-input').click()" title="Đính kèm tệp">
                <i data-lucide="paperclip" size="19"></i>
            </div>
            <input type="file" id="attach-input" hidden multiple onchange="handleFileAttach(this)">
            <div class="tool-btn" onclick="insertImagePrompt()" title="Chèn hình ảnh">
                <i data-lucide="image" size="19"></i>
            </div>
            <div style="width: 1px; height: 20px; background: var(--border); margin: 0 4px;"></div>
            <div class="tool-btn" onclick="document.execCommand('bold')" title="In đậm">
                <i data-lucide="bold" size="19"></i>
            </div>
            <div class="tool-btn" onclick="document.execCommand('italic')" title="In nghiêng">
                <i data-lucide="italic" size="19"></i>
            </div>
        </div>

        <div class="panel-content" style="padding: 0 18px;">
            <input type="email" id="c-to" class="field" style="border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 18px 4px; background: transparent;" placeholder="Đến (Email người nhận)">
            <input type="text" id="c-sub" class="field" style="border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 18px 4px; background: transparent;" placeholder="Chủ đề">
            
            <div id="c-attachments" class="attach-list" style="display: none;"></div>

            <div id="c-body" contenteditable="true" style="width: 100%; flex: 1; min-height: 300px; color: #FFF; padding: 24px 4px; font-size: 16px;" data-placeholder="Viết nội dung thư tại đây..."></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbzbBcaEIPlzEnbW7VEN9aBdz3hcI46_NS-tB-4UnWU6YtHuO3cTo48AZA74tTujlV1o/exec";
    
    // Recovery Logic: Restore from storage
    let user = localStorage.getItem('alpha_user') || "";
    let profile = JSON.parse(localStorage.getItem('alpha_profile_' + user) || "{}");
    let mails = JSON.parse(localStorage.getItem('alpha_cache_' + user) || "[]");
    let localSent = JSON.parse(localStorage.getItem('alpha_sent_' + user) || "[]");
    let readStatus = JSON.parse(localStorage.getItem('alpha_read_' + user) || "{}");
    
    let currentFolder = 'inbox'; 
    let activeMail = null;
    let currentAttachments = [];

    // --- RECOVERY CORE LOGIC ---
    const fetchWithTimeout = async (url, options = {}, time = 15000) => {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), time);
        try {
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        } catch(e) { throw e; }
    };

    function showToast(msg) {
        const t = document.getElementById('toast'); t.innerText = msg;
        t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
    }

    function switchV(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        lucide.createIcons();
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sb-overlay').classList.toggle('active');
    }

    function openPanel(id) { document.getElementById(id).classList.add('open'); lucide.createIcons(); }
    function closePanel(id) { document.getElementById(id).classList.remove('open'); }

    // Smart Date Formatter (Restored)
    function formatSmartDate(dateStr) {
        if(!dateStr) return "";
        const d = new Date(dateStr);
        if(isNaN(d.getTime())) return dateStr;
        const now = new Date();
        const isToday = d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        if(isToday) return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleDateString('vi-VN', { day: 'numeric', month: 'short' });
    }

    // Avatar Color Gen (Restored)
    function getAvaClass(str) {
        const colors = ['ava-1', 'ava-2', 'ava-3', 'ava-4', 'ava-5'];
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
        return colors[Math.abs(hash) % colors.length];
    }

    // Sender Extractor (Restored)
    function extractSender(fullSender) {
        if(!fullSender) return { name: "Người gửi ẩn danh", email: "" };
        const match = fullSender.match(/^(.*?)\s*<(.+)>$/);
        if(match) return { name: match[1].replace(/"/g, '').trim() || match[2].split('@')[0], email: match[2] };
        return { name: fullSender.split('@')[0], email: fullSender };
    }

    // --- AUTH & SETUP ---
    async function auth(type) {
        const prefix = type === 'login' ? 'l' : 's';
        let email = document.getElementById(`${prefix}-email`)?.value || document.getElementById(`${prefix}-prefix`).value;
        email = email.trim().toLowerCase();
        const pass = document.getElementById(`${prefix}-pass`).value.trim();
        
        if(type === 'signup' && !email.includes('@')) email += "@alphazone.io.vn";
        if(!email || !pass) return showToast("Vui lòng điền đủ thông tin");

        const btn = document.getElementById(`btn-${type}`);
        btn.innerHTML = `<i data-lucide="loader-2" class="lucide-spin"></i> Đang xử lý...`;
        btn.style.pointerEvents = 'none';
        lucide.createIcons();

        try {
            const r = await fetchWithTimeout(API, {method:'POST', body: JSON.stringify({action:type, email, pass})});
            const d = await r.json();
            if(d.status === 'success') {
                user = email; 
                localStorage.setItem('alpha_user', user);
                if(type === 'signup' || !profile.name) {
                    switchV('setup-view');
                    document.getElementById('setup-ava-text').innerText = user.charAt(0).toUpperCase();
                } else {
                    initApp();
                }
            } else showToast(d.message);
        } catch(e) { showToast("Lỗi kết nối máy chủ"); }
        finally { 
            btn.innerHTML = type === 'login' ? "Đăng nhập" : "Hoàn tất đăng ký";
            btn.style.pointerEvents = 'auto';
            lucide.createIcons();
        }
    }

    function handleAvaSelect(input, previewId, textId) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                const preview = document.getElementById(previewId);
                preview.style.backgroundImage = `url(${e.target.result})`;
                document.getElementById(textId).innerText = "";
                profile.avatar = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function saveProfile(isSetup) {
        const nameInput = document.getElementById(isSetup ? 'setup-name' : 'p-name');
        const phoneInput = document.getElementById(isSetup ? 'setup-phone' : 'p-phone');
        
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        
        if(isSetup && !name) return showToast("Hãy cho chúng tôi biết tên của bạn");

        profile.name = name || profile.name;
        profile.phone = phone || profile.phone;
        
        localStorage.setItem('alpha_profile_' + user, JSON.stringify(profile));
        showToast("Đã lưu thông tin hồ sơ");
        
        if(isSetup) initApp();
        else {
            updateUIWithProfile();
            closePanel('profile-panel');
        }
    }

    function updateUIWithProfile() {
        const name = profile.name || user.split('@')[0];
        const ava = profile.avatar || "";
        
        document.getElementById('sidebar-name').innerText = name;
        document.getElementById('sb-email').innerText = user;
        
        const headerAva = document.getElementById('header-ava');
        const sideAva = document.getElementById('sidebar-ava');
        
        [headerAva, sideAva].forEach(el => {
            if(ava) {
                el.style.backgroundImage = `url(${ava})`;
                el.innerText = "";
            } else {
                el.style.backgroundImage = "";
                el.innerText = name.charAt(0).toUpperCase();
                el.className = `avatar ${getAvaClass(name)}`;
            }
        });
    }

    function openProfile() {
        document.getElementById('p-name').value = profile.name || "";
        document.getElementById('p-phone').value = profile.phone || "";
        const preview = document.getElementById('profile-ava-preview');
        const text = document.getElementById('profile-ava-text');
        
        if(profile.avatar) {
            preview.style.backgroundImage = `url(${profile.avatar})`;
            text.innerText = "";
        } else {
            preview.style.backgroundImage = "";
            text.innerText = (profile.name || user).charAt(0).toUpperCase();
        }
        
        if(document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
        openPanel('profile-panel');
    }

    // --- ATTACHMENTS LOGIC ---
    function handleFileAttach(input) {
        if (!input.files.length) return;
        const container = document.getElementById('c-attachments');
        container.style.display = 'flex';

        for (let file of input.files) {
            if(file.size > 10 * 1024 * 1024) { showToast(`Tệp ${file.name} quá lớn (>10MB)`); continue; }
            const fileId = 'file_' + Math.random().toString(36).substr(2, 9);
            const reader = new FileReader();
            reader.onload = e => {
                currentAttachments.push({ id: fileId, name: file.name, type: file.type, data: e.target.result });
                const tag = document.createElement('div');
                tag.className = 'attach-tag';
                tag.id = fileId;
                tag.innerHTML = `<i data-lucide="file-text"></i> <span>${file.name}</span> <i data-lucide="x" class="remove" onclick="removeAttach('${fileId}')"></i>`;
                container.appendChild(tag);
                lucide.createIcons();
            };
            reader.readAsDataURL(file);
        }
        input.value = ""; 
    }

    function removeAttach(id) {
        currentAttachments = currentAttachments.filter(a => a.id !== id);
        document.getElementById(id).remove();
        if(currentAttachments.length === 0) document.getElementById('c-attachments').style.display = 'none';
    }

    // --- MAIL APP LOGIC ---
    async function initApp() {
        switchV('app-view');
        updateUIWithProfile();
        syncMails();
        renderMails();
        setInterval(syncMails, 45000); // Tăng tần suất đồng bộ lên 45s
    }

    async function syncMails() {
        if(!user) return;
        try {
            const r = await fetchWithTimeout(`${API}?email=${user}`);
            const data = await r.json();
            if(JSON.stringify(data) !== JSON.stringify(mails)) {
                mails = data;
                localStorage.setItem('alpha_cache_' + user, JSON.stringify(mails));
                if(currentFolder === 'inbox') renderMails();
            }
        } catch(e) { console.log("Sync error"); }
    }

    function setFolder(folder) {
        currentFolder = folder;
        document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`nav-${folder}`).classList.add('active');
        toggleSidebar();
        renderMails();
    }

    function renderMails() {
        const list = document.getElementById('mail-list');
        const q = document.getElementById('q').value.toLowerCase();
        let source = currentFolder === 'inbox' ? mails : localSent;
        
        const filtered = source.filter(m => (m.subject + (m.sender||"") + (m.to||"") + (m.body||"")).toLowerCase().includes(q));
        
        if(!filtered.length) {
            list.innerHTML = `<div style="text-align:center; padding:100px 20px; opacity:0.3;"><i data-lucide="mail-search" size="48"></i><p style="margin-top:12px;">Hộp thư trống</p></div>`;
            lucide.createIcons();
            return;
        }

        list.innerHTML = filtered.map(m => {
            const isUnread = currentFolder === 'inbox' && !readStatus[m.id];
            const displayPerson = currentFolder === 'sent' ? (m.to || "Người nhận") : (m.sender || "Hệ thống");
            const senderData = extractSender(displayPerson);
            const previewText = (m.body || "").replace(/<[^>]+>/g, ' ').substring(0, 100);
            
            return `
                <div class="mail-item ${isUnread ? 'unread' : ''}" onclick="viewMail('${m.id}')">
                    <div class="avatar ${getAvaClass(senderData.name)}">${senderData.name.charAt(0).toUpperCase()}</div>
                    <div class="mail-content-wrapper">
                        <div class="mail-header-row">
                            <span class="sender-name">${senderData.name}</span>
                            <span class="time-badge">${formatSmartDate(m.time)}</span>
                        </div>
                        <span class="subject-text">${m.subject || '(Không có chủ đề)'}</span>
                        <span class="preview-text">${previewText}</span>
                    </div>
                </div>`;
        }).join('');
    }

    function viewMail(id) {
        activeMail = mails.find(x => x.id === id) || localSent.find(x => x.id === id);
        if(!activeMail) return;

        if(currentFolder === 'inbox') {
            readStatus[id] = true;
            localStorage.setItem('alpha_read_' + user, JSON.stringify(readStatus));
            renderMails();
        }

        const displayPerson = currentFolder === 'sent' ? (activeMail.to || "Người nhận") : (activeMail.sender || "Người gửi");
        const senderData = extractSender(displayPerson);

        document.getElementById('r-sub').innerText = activeMail.subject || "(Không có chủ đề)";
        document.getElementById('r-sender').innerText = senderData.name;
        document.getElementById('r-email').innerText = senderData.email || activeMail.sender;
        document.getElementById('r-time').innerText = new Date(activeMail.time).toLocaleString('vi-VN');
        
        const ava = document.getElementById('r-ava');
        ava.innerText = senderData.name.charAt(0).toUpperCase();
        ava.className = `avatar ${getAvaClass(senderData.name)}`;

        // Attachments Area
        const rAttach = document.getElementById('r-attachments');
        if(activeMail.attachments && activeMail.attachments.length) {
            rAttach.style.display = 'flex';
            rAttach.innerHTML = activeMail.attachments.map(a => `
                <div class="attach-tag" onclick="downloadFile('${a.data}', '${a.name}')" style="cursor:pointer">
                    <i data-lucide="download-cloud"></i> <span>${a.name}</span>
                </div>
            `).join('');
            lucide.createIcons();
        } else {
            rAttach.style.display = 'none';
        }

        const frame = document.getElementById('r-body-frame');
        // Render rich media if it's plain text, else use srcdoc for HTML
        const isHTML = /<\/?[a-z][\s\S]*>/i.test(activeMail.body);
        let content = activeMail.body;
        if(!isHTML) content = activeMail.body.replace(/\n/g, '<br>').replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');

        frame.srcdoc = `
            <!DOCTYPE html>
            <html>
            <head><style>body { font-family: 'Inter', -apple-system, sans-serif; padding: 20px; line-height: 1.6; color: #1F2937; margin:0; } img { max-width: 100%; height: auto; border-radius: 8px; }</style></head>
            <body>${content}</body>
            </html>
        `;
        
        openPanel('read-panel');
    }

    function downloadFile(data, name) {
        const link = document.createElement('a');
        link.href = data;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function openCompose() {
        currentAttachments = [];
        document.getElementById('c-attachments').innerHTML = "";
        document.getElementById('c-attachments').style.display = 'none';
        document.getElementById('c-to').value = "";
        document.getElementById('c-sub').value = "";
        document.getElementById('c-body').innerHTML = "";
        openPanel('compose-panel');
    }

    function insertImagePrompt() {
        const url = prompt("Dán đường dẫn (URL) hình ảnh vào đây:");
        if(url) {
            document.getElementById('c-body').focus();
            document.execCommand('insertHTML', false, `<img src="${url}" alt="Hình ảnh">`);
        }
    }

    function replyMail() {
        if(!activeMail) return;
        const senderData = extractSender(activeMail.sender);
        const sub = activeMail.subject.startsWith("Re:") ? activeMail.subject : "Re: " + activeMail.subject;
        closePanel('read-panel');
        openCompose();
        document.getElementById('c-to').value = senderData.email || activeMail.sender;
        document.getElementById('c-sub').value = sub;
        document.getElementById('c-body').innerHTML = `<br><br><div style="border-left: 2px solid var(--border); padding-left: 12px; color: var(--text-sub);">--- Trả lời thư ---<br>${activeMail.body}</div>`;
    }

    async function sendMail() {
        const to = document.getElementById('c-to').value.trim();
        const sub = document.getElementById('c-sub').value.trim();
        const body = document.getElementById('c-body').innerHTML;
        
        if(!to || (!body && !currentAttachments.length)) return showToast("Vui lòng nhập người nhận và nội dung");
        
        const btn = document.getElementById('btn-send');
        btn.style.opacity = '0.3'; btn.style.pointerEvents = 'none';
        showToast("Đang gửi thư...");

        try {
            const payload = { action: 'send', from: user, to, subject: sub, body, attachments: currentAttachments };
            const r = await fetchWithTimeout(API, {method: 'POST', body: JSON.stringify(payload)});
            const d = await r.json();
            if(d.status === 'success') {
                showToast("Đã gửi thành công!");
                localSent.unshift({ id: 'sent_'+Date.now(), to, subject: sub, body, time: new Date().toISOString(), attachments: currentAttachments });
                localStorage.setItem('alpha_sent_' + user, JSON.stringify(localSent));
                closePanel('compose-panel');
                if(currentFolder === 'sent') renderMails();
            } else showToast("Lỗi: " + d.message);
        } catch(e) { showToast("Lỗi kết nối khi gửi thư"); }
        finally { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
    }

    async function deleteMail() {
        if(!activeMail) return;
        if(!confirm("Bạn có chắc chắn muốn xóa thư này?")) return;
        
        if(currentFolder === 'sent') {
            localSent = localSent.filter(x => x.id !== activeMail.id);
            localStorage.setItem('alpha_sent_' + user, JSON.stringify(localSent));
            closePanel('read-panel'); renderMails(); showToast("Đã xóa thư gửi");
            return;
        }

        showToast("Đang xóa...");
        try {
            const r = await fetchWithTimeout(API, {method: 'POST', body: JSON.stringify({ action: 'delete', email: user, id: activeMail.id })});
            const d = await r.json();
            if(d.status === 'success') {
                mails = mails.filter(x => x.id !== activeMail.id);
                localStorage.setItem('alpha_cache_' + user, JSON.stringify(mails));
                closePanel('read-panel'); renderMails(); showToast("Đã xóa thư");
            }
        } catch(e) { showToast("Lỗi đồng bộ xóa"); }
    }

    function logout() {
        if(confirm("Xác nhận đăng xuất khỏi hệ thống?")) {
            localStorage.removeItem('alpha_user');
            location.reload();
        }
    }

    window.onload = () => { 
        lucide.createIcons(); 
        if(user) initApp(); 
    };
</script>
