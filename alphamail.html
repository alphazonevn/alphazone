<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALPHA ZONE - Mail Workspace</title>
    <link rel="icon" type="image/png" href="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --primary: #D4AF37; 
            --primary-hover: #F3CA45;
            --bg: #0A0A0C;
            --surface: #141518;
            --surface-hover: #1E1F24;
            --text: #F3F4F6; 
            --text-sub: #9CA3AF; 
            --border: #27272A;
            --danger: #EF4444;
            --unread: #3B82F6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000;
            color: var(--text); 
            height: 100vh; 
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        /* App Container */
        .app-container {
            width: 100%; max-width: 480px; height: 100vh; background-color: var(--bg);
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        @media (min-width: 501px) {
            .app-container { height: 90vh; max-height: 850px; border-radius: 24px; border: 1px solid var(--border); }
        }

        .view { display: none; height: 100%; flex-direction: column; position: absolute; width: 100%; top: 0; left: 0; background: var(--bg); z-index: 1; animation: fade 0.2s ease; }
        .view.active { display: flex; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* Auth */
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.08) 0%, var(--bg) 60%); }
        .auth-card { width: 100%; max-width: 340px; }
        .field { width: 100%; padding: 16px; border: 1.5px solid var(--border); border-radius: 14px; background: var(--surface); color: #FFF; font-size: 15px; margin-bottom: 16px; transition: 0.2s; font-family: inherit; }
        .field:focus { border-color: var(--primary); background: #1A1A20; box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); }
        
        .btn { background: var(--surface); color: var(--text); border: none; width: 100%; padding: 16px; border-radius: 14px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-gold { background: var(--primary); color: #000; }
        .btn-gold:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,175,55,0.25); }
        .btn:active { transform: scale(0.96); }

        /* Header & Search */
        .header { padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 12px; background: rgba(10,10,12,0.9); backdrop-filter: blur(20px); z-index: 10; border-bottom: 1px solid var(--border); }
        .menu-btn { padding: 8px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .menu-btn:active { background: var(--surface); }
        .search-box { flex: 1; background: var(--surface); height: 44px; border-radius: 22px; display: flex; align-items: center; padding: 0 16px; gap: 10px; border: 1px solid transparent; transition: 0.2s; }
        .search-box:focus-within { border-color: var(--border); background: #1A1A20; }
        .search-box input { border: none; background: transparent; flex: 1; color: #FFF; font-size: 15px; }

        /* Mail List */
        .mail-list { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .mail-item { padding: 16px; display: flex; gap: 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; position: relative; }
        .mail-item:hover { background: var(--surface); }
        .mail-item.unread .sender-name { font-weight: 700; color: #FFF; }
        .mail-item.unread .subject-text { font-weight: 600; color: #FFF; }
        .mail-item.unread::before { content: ''; position: absolute; left: 6px; top: 32px; width: 8px; height: 8px; background: var(--unread); border-radius: 50%; }

        .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 600; font-size: 16px; flex-shrink: 0; text-transform: uppercase; }
        .ava-1 { background: #A7F3D0; } .ava-2 { background: #FDE68A; } .ava-3 { background: #FECACA; } .ava-4 { background: #BFDBFE; } .ava-5 { background: var(--primary); }
        
        .mail-content-wrapper { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .mail-header-row { display: flex; justify-content: space-between; align-items: baseline; }
        .sender-name { font-size: 15px; color: #E5E7EB; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .time-badge { font-size: 12px; color: var(--text-sub); flex-shrink: 0; margin-left: 10px; }
        .subject-text { font-size: 14px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .preview-text { font-size: 13px; color: #6B7280; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

        /* Skeleton Loader */
        .skeleton { background: linear-gradient(90deg, var(--surface) 25%, #2A2B30 50%, var(--surface) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 4px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Sidebar */
        .sidebar-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; opacity: 0; visibility: hidden; transition: 0.3s; backdrop-filter: blur(2px); }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar { position: absolute; top: 0; left: -280px; width: 280px; height: 100%; background: #101114; z-index: 101; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .sidebar.active { left: 0; }
        .sb-header { padding: 30px 20px 20px; border-bottom: 1px solid var(--border); }
        .sb-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; color: var(--text-sub); cursor: pointer; font-weight: 500; transition: 0.2s; }
        .sb-item:hover { background: var(--surface); color: #FFF; }
        .sb-item.active { background: rgba(212, 175, 55, 0.1); color: var(--primary); border-right: 3px solid var(--primary); }

        /* Overlays (Detail & Compose) */
        .panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 90; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .panel.open { transform: translateX(0); }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--bg); }
        .action-group { display: flex; gap: 15px; align-items: center; }
        .action-icon { cursor: pointer; color: var(--text-sub); transition: 0.2s; }
        .action-icon:hover { color: #FFF; }

        .panel-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        
        /* Iframe Email Render */
        .iframe-container { flex: 1; background: #FFF; border-radius: 12px; margin-top: 20px; overflow: hidden; display: flex; flex-direction: column; min-height: 400px; }
        iframe.mail-body-frame { width: 100%; flex: 1; border: none; background: #FFF; }

        .fab { position: absolute; bottom: 24px; right: 24px; width: 56px; height: 56px; background: var(--primary); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(212,175,55,0.4); z-index: 80; cursor: pointer; transition: 0.2s; color: #000; }
        .fab:hover { transform: scale(1.05); }
        .fab:active { transform: scale(0.95); }

        .toast { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; opacity: 0; visibility: hidden; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s; white-space: nowrap; }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

        /* Compose Rich Text Styles */
        #c-body:empty:before { content: attr(data-placeholder); color: #6B7280; pointer-events: none; display: block; }
        #c-body img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
        #c-body a { color: #3B82F6; text-decoration: underline; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- Auth Views -->
    <div id="login-view" class="view active">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div style="text-align: center; margin-bottom: 32px;">
                    <img src="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png" style="width: 70px; margin-bottom: 16px;" alt="Logo">
                    <h2 style="font-weight: 600; font-size: 24px; letter-spacing: 0.5px;">Alpha Mail</h2>
                    <p style="color: var(--text-sub); font-size: 14px; margin-top: 6px;">Nền tảng giao tiếp an toàn</p>
                </div>
                <input type="email" id="l-email" class="field" placeholder="Email đăng nhập">
                <input type="password" id="l-pass" class="field" placeholder="Mật khẩu">
                <button class="btn btn-gold" id="btn-login" onclick="auth('login')">Tiếp tục</button>
                <div style="text-align: center; margin-top: 24px;">
                    <span style="color: var(--text-sub); font-size: 14px; cursor: pointer;" onclick="switchV('signup-view')">Chưa có tài khoản? <b style="color: #FFF;">Tạo mới</b></span>
                </div>
            </div>
        </div>
    </div>

    <div id="signup-view" class="view">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h2 style="font-weight: 600; margin-bottom: 8px; font-size: 24px;">Đăng ký</h2>
                <p style="color: var(--text-sub); font-size: 14px; margin-bottom: 24px;">Tạo địa chỉ @alphazone.io.vn</p>
                <input type="text" id="s-prefix" class="field" placeholder="Tên người dùng (vd: admin)">
                <input type="password" id="s-pass" class="field" placeholder="Tạo mật khẩu">
                <button class="btn btn-gold" id="btn-signup" onclick="auth('signup')">Hoàn tất đăng ký</button>
                <button class="btn" style="margin-top:12px; background: transparent; border: 1px solid var(--border);" onclick="switchV('login-view')">Quay lại</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-view" class="view">
        <div class="header">
            <div class="menu-btn" onclick="toggleSidebar()"><i data-lucide="menu" color="#FFF"></i></div>
            <div class="search-box">
                <i data-lucide="search" size="18" color="#9CA3AF"></i>
                <input type="text" id="q" placeholder="Tìm kiếm trong thư..." oninput="renderMails()">
            </div>
            <div class="avatar ava-5" id="header-ava" style="width: 32px; height: 32px; font-size: 14px; cursor: pointer;" onclick="toggleSidebar()">?</div>
        </div>
        
        <div id="mail-list" class="mail-list"></div>
        
        <div class="fab" onclick="openCompose()"><i data-lucide="pen" size="22"></i></div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sb-header">
            <h3 style="color: #FFF; font-size: 18px; margin-bottom: 4px;">Alpha Workspace</h3>
            <p id="sb-email" style="color: var(--text-sub); font-size: 13px;"></p>
        </div>
        <div style="padding: 10px 0; flex: 1;">
            <div class="sb-item active" onclick="setFolder('inbox')"><i data-lucide="inbox" size="20"></i> Hộp thư đến</div>
            <div class="sb-item" onclick="setFolder('sent')"><i data-lucide="send" size="20"></i> Đã gửi</div>
            <div class="sb-item" onclick="setFolder('trash')"><i data-lucide="trash-2" size="20"></i> Thùng rác</div>
        </div>
        <div style="padding: 20px; border-top: 1px solid var(--border);">
            <div class="sb-item" style="padding: 10px; color: var(--danger);" onclick="logout()"><i data-lucide="log-out" size="20"></i> Đăng xuất</div>
        </div>
    </div>

    <!-- Read Mail Panel -->
    <div id="read-panel" class="panel">
        <div class="panel-header">
            <i data-lucide="arrow-left" class="action-icon" onclick="closePanel('read-panel')"></i>
            <div class="action-group">
                <i data-lucide="reply" class="action-icon" onclick="replyMail()" title="Trả lời"></i>
                <i data-lucide="trash" class="action-icon" style="color: var(--danger)" onclick="deleteMail()" title="Xóa"></i>
            </div>
        </div>
        <div class="panel-content" style="padding: 0;">
            <div style="padding: 24px 24px 0 24px;">
                <h2 id="r-sub" style="font-size: 22px; font-weight: 600; margin-bottom: 24px; line-height: 1.4; word-break: break-word;"></h2>
                <div style="display: flex; gap: 14px; align-items: center; margin-bottom: 8px;">
                    <div id="r-ava" class="avatar ava-1"></div>
                    <div style="flex: 1;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div id="r-sender" style="font-weight: 600; font-size: 15px; color: #FFF;"></div>
                            <div id="r-time" style="font-size: 12px; color: var(--text-sub);"></div>
                        </div>
                        <div id="r-email" style="font-size: 13px; color: var(--text-sub); margin-top: 2px;"></div>
                    </div>
                </div>
            </div>
            <div class="iframe-container">
                <!-- Sandbox mode để chặn chạy script, bảo mật tuyệt đối -->
                <iframe id="r-body-frame" class="mail-body-frame" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
            </div>
        </div>
    </div>

    <!-- Compose Panel -->
    <div id="compose-panel" class="panel">
        <div class="panel-header">
            <i data-lucide="x" class="action-icon" onclick="closePanel('compose-panel')"></i>
            <span style="font-weight: 600; font-size: 15px;">Soạn thư</span>
            <i data-lucide="send" class="action-icon" style="color: var(--primary)" onclick="sendMail()"></i>
        </div>
        <div class="panel-content" style="padding: 0 16px;">
            <input type="email" id="c-to" class="field" style="background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 16px 4px; margin: 0;" placeholder="Tới (Email người nhận)">
            <input type="text" id="c-sub" class="field" style="background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 16px 4px; margin: 0;" placeholder="Chủ đề">
            <!-- Thay thế textarea bằng thẻ div contenteditable để hỗ trợ copy/paste hình ảnh và link -->
            <div id="c-body" contenteditable="true" style="width: 100%; flex: 1; background: transparent; border: none; color: #FFF; padding: 20px 4px; font-family: inherit; font-size: 15px; outline: none; overflow-y: auto; line-height: 1.6;" data-placeholder="Nội dung email... (Hỗ trợ chèn link và hình ảnh)"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

</div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzbBcaEIPlzEnbW7VEN9aBdz3hcI46_NS-tB-4UnWU6YtHuO3cTo48AZA74tTujlV1o/exec";
        let user = localStorage.getItem('alpha_user') || "";
        let mails = [];
        let localSent = JSON.parse(localStorage.getItem('alpha_sent_' + user) || "[]");
        let readStatus = JSON.parse(localStorage.getItem('alpha_read_' + user) || "{}");
        let currentFolder = 'inbox'; // inbox, sent, trash
        let activeMail = null;

        // --- Core Utilities ---
        const fetchWithTimeout = async (url, options = {}, time = 15000) => {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), time);
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function btnLoad(id, isLoading, text) {
            const btn = document.getElementById(id);
            btn.innerHTML = isLoading ? `<i data-lucide="loader-2" class="lucide-spin"></i> Xử lý...` : text;
            btn.style.pointerEvents = isLoading ? 'none' : 'auto';
            btn.style.opacity = isLoading ? '0.7' : '1';
            lucide.createIcons();
        }

        function switchV(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            lucide.createIcons();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sb-overlay').classList.toggle('active');
        }

        function openPanel(id) { document.getElementById(id).classList.add('open'); lucide.createIcons(); }
        function closePanel(id) { document.getElementById(id).classList.remove('open'); }

        // --- Formatting & Parsing ---
        function formatSmartDate(dateStr) {
            if(!dateStr) return "";
            const d = new Date(dateStr);
            if(isNaN(d.getTime())) return dateStr;
            const now = new Date();
            const isToday = d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            if(isToday) return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            return d.toLocaleDateString('vi-VN', { day: 'numeric', month: 'short' });
        }

        function extractSender(fullSender) {
            const match = fullSender.match(/^(.*?)\s*<(.+)>$/);
            if(match) return { name: match[1].replace(/"/g, '').trim() || match[2].split('@')[0], email: match[2] };
            return { name: fullSender.split('@')[0], email: fullSender };
        }

        function getAvaClass(str) {
            const colors = ['ava-1', 'ava-2', 'ava-3', 'ava-4', 'ava-5'];
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        function parseTextToRichMedia(text) {
            // Chuyển đổi mã HTML an toàn
            let safeText = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Tìm và chuyển đổi URL thành Link hoặc Ảnh
            const urlRegex = /(https?:\/\/[^\s]+)/ig;
            safeText = safeText.replace(urlRegex, function(url) {
                if (url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                    return `<br><img src="${url}" style="max-width: 100%; border-radius: 8px; margin: 10px 0;"><br>`;
                } else {
                    return `<a href="${url}" target="_blank" style="color: #3B82F6; text-decoration: underline;">${url}</a>`;
                }
            });
            
            return safeText.replace(/\n/g, '<br>');
        }

        // --- Logic App ---
        async function auth(type) {
            const prefix = type === 'login' ? 'l' : 's';
            let email = document.getElementById(`${prefix}-email`)?.value || document.getElementById(`${prefix}-prefix`).value;
            email = email.trim().toLowerCase();
            const pass = document.getElementById(`${prefix}-pass`).value.trim();
            
            if(type === 'signup' && !email.includes('@')) email += "@alphazone.io.vn";
            if(!email || !pass) return showToast("Nhập đầy đủ thông tin!");

            btnLoad(`btn-${type}`, true, "Tiếp tục");
            try {
                const r = await fetchWithTimeout(API, {method:'POST', body: JSON.stringify({action:type, email, pass})});
                const d = await r.json();
                if(d.status === 'success') {
                    user = email; localStorage.setItem('alpha_user', user); initApp();
                } else showToast(d.message);
            } catch(e) { showToast("Lỗi kết nối máy chủ"); }
            finally { btnLoad(`btn-${type}`, false, type === 'login' ? "Tiếp tục" : "Hoàn tất đăng ký"); }
        }

        function initApp() {
            switchV('app-view');
            document.getElementById('header-ava').innerText = user.charAt(0);
            document.getElementById('sb-email').innerText = user;
            
            try { mails = JSON.parse(localStorage.getItem('alpha_cache_' + user) || "[]"); } catch(e){}
            
            renderMails();
            syncMails();
            setInterval(syncMails, 30000);
        }

        async function syncMails() {
            if(!user) return;
            try {
                const r = await fetchWithTimeout(`${API}?email=${user}`, {}, 20000);
                const data = await r.json();
                
                if(JSON.stringify(data) !== JSON.stringify(mails)) {
                    // Logic hiển thị Toast đẩy
                    if (mails.length > 0 && data.length > mails.length) {
                        const newCount = data.length - mails.length;
                        showToast(`🔔 Bạn có ${newCount} thư mới!`);
                    }

                    mails = data;
                    localStorage.setItem('alpha_cache_' + user, JSON.stringify(mails));
                    if(currentFolder === 'inbox') renderMails();
                }
            } catch(e) { console.log("Lỗi đồng bộ: ", e); }
        }

        function setFolder(folder) {
            currentFolder = folder;
            document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            toggleSidebar();
            renderMails();
        }

        function showSkeleton() {
            const list = document.getElementById('mail-list');
            list.innerHTML = Array(6).fill('').map(() => `
                <div class="mail-item" style="pointer-events:none;">
                    <div class="avatar skeleton" style="background-color:transparent"></div>
                    <div class="mail-content-wrapper">
                        <div class="skeleton" style="height:14px; width:40%; margin-bottom:6px"></div>
                        <div class="skeleton" style="height:12px; width:70%; margin-bottom:4px"></div>
                        <div class="skeleton" style="height:12px; width:90%"></div>
                    </div>
                </div>`).join('');
        }

        function renderMails() {
            if(mails.length === 0 && currentFolder === 'inbox') showSkeleton();
            setTimeout(() => {
                const list = document.getElementById('mail-list');
                const q = document.getElementById('q').value.toLowerCase();
                
                let source = currentFolder === 'inbox' ? mails : (currentFolder === 'sent' ? localSent : []);
                
                const filtered = source.filter(m => {
                    const str = (m.subject + m.sender + (m.to||"") + m.body).toLowerCase();
                    return str.includes(q);
                });
                
                if(filtered.length === 0) {
                    list.innerHTML = `
                        <div style="text-align:center; padding:80px 20px; color:var(--text-sub);">
                            <i data-lucide="${currentFolder==='inbox'?'inbox':(currentFolder==='sent'?'send':'trash')}" size="48" style="opacity:0.3; margin-bottom:16px;"></i>
                            <div style="font-weight:500;">Không có thư nào</div>
                        </div>`;
                    lucide.createIcons(); return;
                }

                list.innerHTML = filtered.map((m) => {
                    if(!m.id) m.id = 'local_' + Math.random().toString(36).substr(2, 9);
                    
                    const isUnread = currentFolder === 'inbox' && !readStatus[m.id];
                    const targetPerson = currentFolder === 'sent' ? `Đến: ${m.to}` : m.sender;
                    const senderData = extractSender(targetPerson);
                    const avaChar = senderData.name.charAt(0).toUpperCase() || '?';
                    const timeStr = formatSmartDate(m.time);
                    const previewText = (m.body || "").replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').substring(0, 100);

                    return `
                    <div class="mail-item ${isUnread ? 'unread' : ''}" onclick="viewMail('${m.id}')">
                        <div class="avatar ${getAvaClass(senderData.name)}">${avaChar}</div>
                        <div class="mail-content-wrapper">
                            <div class="mail-header-row">
                                <span class="sender-name">${senderData.name}</span>
                                <span class="time-badge">${timeStr}</span>
                            </div>
                            <span class="subject-text">${m.subject || '(Không có chủ đề)'}</span>
                            <span class="preview-text">${previewText}</span>
                        </div>
                    </div>`;
                }).join('');
                lucide.createIcons();
            }, mails.length === 0 ? 500 : 0);
        }

        function viewMail(id) {
            let m = mails.find(x => x.id === id) || localSent.find(x => x.id === id);
            if(!m) return;
            activeMail = m;

            if(currentFolder === 'inbox') {
                readStatus[id] = true;
                localStorage.setItem('alpha_read_' + user, JSON.stringify(readStatus));
                renderMails();
            }

            const targetPerson = currentFolder === 'sent' ? `Đến: ${m.to}` : m.sender;
            const senderData = extractSender(targetPerson);
            
            document.getElementById('r-sub').innerText = m.subject || "(Không có chủ đề)";
            document.getElementById('r-sender').innerText = senderData.name;
            document.getElementById('r-email').innerText = senderData.email;
            document.getElementById('r-time').innerText = new Date(m.time).toLocaleString('vi-VN');
            
            const ava = document.getElementById('r-ava');
            ava.innerText = senderData.name.charAt(0).toUpperCase();
            ava.className = `avatar ${getAvaClass(senderData.name)}`;

            const frame = document.getElementById('r-body-frame');
            const isHTML = /<\/?[a-z][\s\S]*>/i.test(m.body);
            
            let safeBody = m.body.replace(/<a /gi, '<a target="_blank" ');

            if (isHTML) {
                frame.srcdoc = safeBody;
            } else {
                // Tích hợp khả năng tự nhận diện Link/Hình ảnh
                const parsedBody = parseTextToRichMedia(safeBody);
                const styledHTML = `
                    <html style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6; color: #111;">
                        <body style="margin:0; padding: 15px; word-wrap: break-word;">
                            ${parsedBody}
                        </body>
                    </html>`;
                frame.srcdoc = styledHTML;
            }
            
            openPanel('read-panel');
        }

        // --- Gửi Thư ---
        function openCompose() {
            document.getElementById('c-to').value = "";
            document.getElementById('c-sub').value = "";
            document.getElementById('c-body').innerHTML = ""; // Đã đổi sang innerHTML
            openPanel('compose-panel');
        }

        function replyMail() {
            if(!activeMail) return;
            const senderData = extractSender(activeMail.sender);
            let sub = activeMail.subject || "";
            if(!sub.toLowerCase().startsWith('re:')) sub = "Re: " + sub;
            
            closePanel('read-panel');
            document.getElementById('c-to').value = senderData.email;
            document.getElementById('c-sub').value = sub;
            document.getElementById('c-body').innerHTML = "<br><br><div style='color: #9CA3AF;'>--- Trả lời thư ---</div><br>"; // Đã đổi sang innerHTML
            openPanel('compose-panel');
        }

        async function sendMail() {
            const to = document.getElementById('c-to').value.trim();
            const subject = document.getElementById('c-sub').value.trim();
            const body = document.getElementById('c-body').innerHTML; // Lấy nội dung HTML để giữ hình/link
            
            if(!to || !body || body === "<br>") return showToast("Vui lòng điền người nhận và nội dung");
            
            showToast("Đang gửi...");
            try {
                const r = await fetchWithTimeout(API, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'send', from: user, to, subject, body })
                });
                const d = await r.json();
                if(d.status === 'success') {
                    showToast("Đã gửi thành công");
                    localSent.unshift({ id: 'sent_'+Date.now(), to: to, subject: subject, body: body, time: new Date().toISOString() });
                    localStorage.setItem('alpha_sent_' + user, JSON.stringify(localSent));
                    closePanel('compose-panel');
                    if(currentFolder === 'sent') renderMails();
                } else showToast("Lỗi: " + d.message);
            } catch(e) { showToast("Lỗi mạng khi gửi"); }
        }

        async function deleteMail() {
            if(!activeMail) return;
            if(!confirm("Xóa thư này vĩnh viễn?")) return;
            
            if(currentFolder === 'sent') {
                localSent = localSent.filter(x => x.id !== activeMail.id);
                localStorage.setItem('alpha_sent_' + user, JSON.stringify(localSent));
                closePanel('read-panel');
                renderMails();
                showToast("Đã xóa thư đã gửi");
                return;
            }

            showToast("Đang xóa...");
            try {
                const r = await fetchWithTimeout(API, {
                    method: 'POST', 
                    body: JSON.stringify({ action: 'delete', email: user, id: activeMail.id })
                });
                const d = await r.json();
                if(d.status === 'success') {
                    mails = mails.filter(x => x.id !== activeMail.id);
                    localStorage.setItem('alpha_cache_' + user, JSON.stringify(mails));
                    closePanel('read-panel');
                    renderMails();
                    showToast("Đã xóa thư");
                }
            } catch(e) { showToast("Lỗi đồng bộ xóa"); }
        }

        function logout() { 
            if(confirm("Đăng xuất khỏi tài khoản?")) {
                localStorage.removeItem('alpha_user'); 
                location.reload(); 
            }
        }

        window.onload = () => { 
            lucide.createIcons();
            if(user) initApp(); 
        };
    </script>
</body>
</html>
