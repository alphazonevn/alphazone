<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Zone + AlphaMail</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:#030303;
    color:#fff;
}

/* ===== LANDING ===== */
.mesh-gradient{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
    radial-gradient(at 0% 0%, rgba(255,95,31,.15), transparent 50%),
    radial-gradient(at 100% 100%, rgba(30,64,175,.15), transparent 50%);
}

.btn-main{
    background:#ff5f1f;
    color:#000;
    font-weight:800;
}

/* ===== MAIL APP ===== */
#mail-app{
    position:fixed;
    inset:0;
    background:#000;
    z-index:9999;
    display:none;
    flex-direction:column;
}

.mail-card{
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:#030303;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

</style>
</head>

<body>

<div class="mesh-gradient"></div>

<!-- NAV -->
<nav class="fixed top-0 w-full p-6 flex justify-between z-50">
    <div class="font-bold">ALPHA ZONE</div>
    <div class="flex gap-6 text-sm">
        <button onclick="openMail()">Mail</button>
    </div>
</nav>

<!-- HERO -->
<section class="min-h-screen flex items-center justify-center text-center">
    <div>
        <h1 class="text-6xl font-bold mb-6">ALPHA ZONE</h1>
        <button onclick="openMail()" class="btn-main px-10 py-4">
            MỞ ALPHAMAIL
        </button>
    </div>
</section>

<!-- ================= MAIL APP ================= -->
<div id="mail-app">

<!-- HEADER -->
<div class="flex justify-between p-4 border-b border-white/10">
    <span>AlphaMail</span>
    <button onclick="closeMail()">Đóng</button>
</div>

<!-- LOGIN -->
<div id="auth" class="flex-1 flex items-center justify-center">
    <div class="space-y-4 text-center">
        <input id="user" placeholder="username"
            class="border px-4 py-2 text-black">
        <br>
        <button onclick="login()" class="btn-main px-6 py-2">Login</button>
    </div>
</div>

<!-- APP -->
<div id="app" style="display:none;" class="flex flex-col h-full">

<div id="mail-list" class="flex-1 overflow-y-auto"></div>

<div class="bottom-nav">
    <button onclick="loadInbox()">Inbox</button>
    <button onclick="compose()">+</button>
    <button onclick="loadSent()">Sent</button>
</div>

</div>

</div>

<!-- ================= SCRIPT ================= -->
<script>
let user=null;
let mails=[];
let sent=[];

function openMail(){
    document.getElementById("mail-app").style.display="flex";
    document.body.style.overflow="hidden";
}

function closeMail(){
    document.getElementById("mail-app").style.display="none";
    document.body.style.overflow="auto";
}

function login(){
    user=document.getElementById("user").value;
    if(!user) return alert("Nhập user");

    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="flex";

    loadInbox();
}

function render(list){
    const el=document.getElementById("mail-list");

    if(list.length===0){
        el.innerHTML="<p class='p-10 opacity-30'>Trống</p>";
        return;
    }

    el.innerHTML=list.map(m=>`
        <div class="mail-card p-4">
            <b>${m.from||m.to}</b>
            <div>${m.subject||'No subject'}</div>
        </div>
    `).join("");
}

function loadInbox(){
    render(mails);
}

function loadSent(){
    render(sent);
}

function compose(){
    const to=prompt("To:");
    const msg=prompt("Message:");

    if(!to||!msg) return;

    sent.unshift({
        to,
        subject:"(no subject)",
        body:msg
    });

    alert("Đã gửi");
}
</script>

</body>
</html>
