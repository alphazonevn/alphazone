<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ALPHA ZONE - Mail Workspace</title>
    <link rel="icon" type="image/png" href="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --primary: #D4AF37; 
            --bg: #000000;
            --surface: #121214;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-sub: #8E8E93;
            --danger: #FF453A;
            --success: #34C759;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); color: var(--text); 
            height: 100dvh; margin: 0; overflow: hidden;
            display: flex; justify-content: center;
        }

        .app-container {
            width: 100%; max-width: 500px; height: 100%; background-color: var(--bg);
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Views */
        .view { display: none; height: 100%; flex-direction: column; position: absolute; width: 100%; top: 0; left: 0; background: var(--bg); z-index: 1; }
        .view.active { display: flex; animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Inputs */
        .field { 
            width: 100%; padding: 18px; border-radius: 16px; border: 1px solid var(--border); 
            background: var(--surface); color: white; font-size: 16px; outline: none; transition: 0.3s;
        }
        .field:focus { border-color: var(--primary); }

        .btn { 
            background: var(--primary); color: black; border: none; width: 100%; padding: 18px; 
            border-radius: 16px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s;
        }

        /* Header */
        .header { 
            padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); 
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
        }

        /* Mail List */
        .mail-list { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 100px; -webkit-overflow-scrolling: touch; }
        .mail-card { 
            background: var(--surface); padding: 20px; border-radius: 20px; margin-bottom: 12px; 
            border: 1px solid var(--border); position: relative;
        }
        .mail-card.unread::after {
            content: ''; position: absolute; top: 20px; right: 20px; width: 8px; height: 8px;
            background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success);
        }

        /* Stats */
        .stats-container { display: flex; gap: 12px; padding: 16px; overflow-x: auto; scrollbar-width: none; }
        .stat-card { min-width: 110px; background: var(--surface); padding: 12px; border-radius: 16px; border: 1px solid var(--border); }
        .stat-label { font-size: 8px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
        .stat-value { font-size: 11px; font-weight: 700; color: var(--primary); }

        /* Panels */
        .panel { 
            position: fixed; inset: 0; background: var(--bg); z-index: 100; 
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
        }
        .panel.open { transform: translateY(0); }

        /* Floating Action Button */
        .fab { 
            position: absolute; bottom: 34px; right: 24px; width: 64px; height: 64px; 
            background: var(--primary); border-radius: 22px; display: flex; align-items: center; 
            justify-content: center; box-shadow: 0 12px 30px rgba(212,175,55,0.3); z-index: 50;
        }

        /* Notification */
        .push-notif {
            position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 16px; right: 16px; 
            background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border);
            padding: 16px; border-radius: 24px; display: flex; gap: 12px; align-items: center;
            transform: translateY(-150%); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 9999;
        }
        .push-notif.show { transform: translateY(0); }

        /* Sidebar */
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); opacity: 0; visibility: hidden; transition: 0.3s; z-index: 150; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--surface); z-index: 151; transition: 0.3s; border-right: 1px solid var(--border); }
        .sidebar.active { left: 0; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        /* Attachments */
        .attachment-pill {
            display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
            background: rgba(255,255,255,0.05); border-radius: 100px; font-size: 12px; margin-top: 8px;
            border: 1px solid var(--border);
        }

        .lucide-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">

    <!-- PUSH NOTIFICATION -->
    <div id="push-notif" class="push-notif">
        <div id="push-icon-bg" style="background: var(--primary); padding: 8px; border-radius: 12px;">
            <i data-lucide="bell" color="black" size="20"></i>
        </div>
        <div style="flex: 1">
            <p id="push-title" style="font-size: 13px; font-weight: 700; margin: 0;">Alpha Mail</p>
            <p id="push-body" style="font-size: 12px; color: var(--text-sub); margin: 2px 0 0 0;">Thông báo từ hệ thống</p>
        </div>
    </div>

    <audio id="sound-pop" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>

    <!-- AUTH VIEW -->
    <div id="login-view" class="view active">
        <div class="auth-wrapper" style="padding: 40px 24px; text-align: center; margin: auto;">
            <img src="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png" style="width: 80px; margin-bottom: 30px;">
            <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 40px;">Elite Login</h1>
            <div style="margin-bottom: 16px;"><input type="email" id="l-email" class="field" placeholder="Email"></div>
            <div style="margin-bottom: 24px;"><input type="password" id="l-pass" class="field" placeholder="Mật khẩu"></div>
            <button class="btn" id="btn-login" onclick="auth()">Xác nhận</button>
        </div>
    </div>

    <!-- MAIN APP VIEW -->
    <div id="app-view" class="view">
        <header class="header">
            <div onclick="toggleSidebar()"><i data-lucide="menu" color="white"></i></div>
            <div style="text-align: center;">
                <p id="folder-name" style="font-size: 10px; font-weight: 800; color: var(--primary); letter-spacing: 2px; text-transform: uppercase;">Workspace</p>
                <p id="user-display" style="font-size: 14px; font-weight: 600;">Alpha User</p>
            </div>
            <div onclick="sync()"><i data-lucide="refresh-cw" size="20" id="sync-icon"></i></div>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <p class="stat-label">Trạng thái</p>
                <p class="stat-value" style="color: var(--success);">Đã kết nối</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Tổng thư</p>
                <p id="stat-total" class="stat-value">0 Thư</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Dung lượng</p>
                <p class="stat-value">Unlimited</p>
            </div>
        </div>

        <div id="mail-list" class="mail-list"></div>
        <div class="fab" onclick="openCompose()"><i data-lucide="plus" size="32" color="black"></i></div>
    </div>

    <!-- COMPOSE PANEL -->
    <div id="compose-panel" class="panel">
        <div class="header">
            <div onclick="closePanel('compose-panel')"><i data-lucide="x"></i></div>
            <p style="font-weight: 700;">Soạn thư</p>
            <div onclick="sendMail()"><i data-lucide="send" color="var(--primary)"></i></div>
        </div>
        <div style="padding: 20px; flex: 1; display: flex; flex-direction: column; overflow-y: auto;">
            <input type="email" id="c-to" class="field" style="background:transparent; border:none; border-bottom:1px solid var(--border); border-radius:0;" placeholder="Tới">
            <input type="text" id="c-sub" class="field" style="background:transparent; border:none; border-bottom:1px solid var(--border); border-radius:0;" placeholder="Chủ đề">
            <textarea id="c-body" style="flex: 1; background:transparent; border:none; color:white; padding:20px 0; outline:none; font-size:16px; resize:none;" placeholder="Nội dung thư..."></textarea>
            
            <!-- Attachment Section -->
            <div id="attachment-area" style="padding: 10px 0;">
                <label for="file-input" style="display:flex; align-items:center; gap:8px; color:var(--primary); font-size:14px; font-weight:600;">
                    <i data-lucide="paperclip" size="18"></i> Đính kèm tệp
                </label>
                <input type="file" id="file-input" style="display:none" onchange="handleFile(this)">
                <div id="file-preview" style="margin-top:10px;"></div>
            </div>
        </div>
    </div>

    <!-- READ PANEL -->
    <div id="read-panel" class="panel">
        <div class="header">
            <div onclick="closePanel('read-panel')"><i data-lucide="chevron-left"></i></div>
            <div style="display:flex; gap:20px;">
                <i data-lucide="trash-2" color="var(--danger)" onclick="deleteMail()"></i>
                <i data-lucide="reply" onclick="reply()"></i>
            </div>
        </div>
        <div id="read-content" style="padding: 24px; overflow-y: auto;"></div>
    </div>

    <!-- SETTINGS PANEL -->
    <div id="settings-panel" class="panel">
        <div class="header">
            <div onclick="closePanel('settings-panel')"><i data-lucide="x"></i></div>
            <p style="font-weight: 700;">Thông tin cá nhân</p>
            <div onclick="saveProfile()"><i data-lucide="check" color="var(--success)"></i></div>
        </div>
        <div style="padding: 24px;">
            <p style="font-size:12px; color:var(--text-sub); margin-bottom:8px;">Tên hiển thị</p>
            <input type="text" id="p-name" class="field" style="margin-bottom:24px;">
            
            <p style="font-size:12px; color:var(--text-sub); margin-bottom:8px;">Mật khẩu mới (Để trống nếu không đổi)</p>
            <input type="password" id="p-pass" class="field" style="margin-bottom:40px;">

            <button class="btn" style="background:var(--danger); color:white;" onclick="logout()">Đăng xuất tài khoản</button>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div style="padding: 60px 24px 30px; border-bottom: 1px solid var(--border);">
            <div style="width: 56px; height: 56px; background: var(--primary); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: black; margin-bottom: 16px;" id="side-ava">A</div>
            <p id="side-name" style="font-weight: 700; font-size: 18px; margin: 0;">Alpha User</p>
            <p id="side-email" style="font-size: 13px; color: var(--text-sub); margin-top: 4px;">user@alphazone.io.vn</p>
        </div>
        <div style="padding: 20px;">
            <div style="padding: 16px; display: flex; gap: 16px; align-items: center; color: var(--primary);" onclick="setFolder('inbox')"><i data-lucide="inbox"></i> Hộp thư đến</div>
            <div style="padding: 16px; display: flex; gap: 16px; align-items: center; opacity: 0.6;" onclick="setFolder('sent')"><i data-lucide="navigation"></i> Đã gửi</div>
            <div style="padding: 16px; display: flex; gap: 16px; align-items: center; opacity: 0.6;" onclick="openSettings()"><i data-lucide="settings"></i> Cài đặt</div>
        </div>
    </div>

</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbzbBcaEIPlzEnbW7VEN9aBdz3hcI46_NS-tB-4UnWU6YtHuO3cTo48AZA74tTujlV1o/exec";
    
    let user = localStorage.getItem('alpha_user') || "";
    let mails = JSON.parse(localStorage.getItem('alpha_cache_' + user) || "[]");
    let readStatus = JSON.parse(localStorage.getItem('alpha_read_' + user) || "{}");
    let currentFolder = 'inbox';
    let activeMail = null;
    let attachedFile = null;

    // --- UI HELPERS ---
    function showToast(title, body, isSuccess = true) {
        document.getElementById('push-title').innerText = title;
        document.getElementById('push-body').innerText = body;
        document.getElementById('push-icon-bg').style.background = isSuccess ? 'var(--primary)' : 'var(--danger)';
        const el = document.getElementById('push-notif');
        el.classList.add('show');
        document.getElementById('sound-pop').play().catch(()=>{});
        setTimeout(() => el.classList.remove('show'), 3500);
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sb-overlay').classList.toggle('active');
    }

    function switchView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        lucide.createIcons();
    }

    function openPanel(id) { document.getElementById(id).classList.add('open'); }
    function closePanel(id) { document.getElementById(id).classList.remove('open'); }

    // --- FILE HANDLING ---
    function handleFile(input) {
        const file = input.files[0];
        if(!file) return;
        if(file.size > 5 * 1024 * 1024) {
            showToast("Lỗi", "Kích thước tệp tối đa 5MB", false);
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            attachedFile = {
                name: file.name,
                type: file.type,
                data: e.target.result.split(',')[1]
            };
            document.getElementById('file-preview').innerHTML = `
                <div class="attachment-pill">
                    <i data-lucide="file" size="14"></i> ${file.name} 
                    <i data-lucide="x" size="14" style="margin-left:10px;" onclick="removeFile()"></i>
                </div>
            `;
            lucide.createIcons();
        };
        reader.readAsDataURL(file);
    }

    function removeFile() {
        attachedFile = null;
        document.getElementById('file-preview').innerHTML = '';
        document.getElementById('file-input').value = '';
    }

    // --- AUTH & SYNC ---
    async function auth() {
        const email = document.getElementById('l-email').value.trim();
        const pass = document.getElementById('l-pass').value.trim();
        if(!email || !pass) return;

        const btn = document.getElementById('btn-login');
        btn.innerHTML = `<i data-lucide="loader-2" class="lucide-spin"></i>`;
        lucide.createIcons();

        try {
            const r = await fetch(API, {method:'POST', body: JSON.stringify({action:'login', email, pass})});
            const d = await r.json();
            if(d.status === 'success') {
                user = email;
                localStorage.setItem('alpha_user', user);
                initApp();
            } else {
                showToast("Lỗi", d.message, false);
                btn.innerText = "Xác nhận";
            }
        } catch(e) { showToast("Lỗi", "Không thể kết nối API", false); btn.innerText = "Xác nhận"; }
    }

    function initApp() {
        switchView('app-view');
        document.getElementById('user-display').innerText = user.split('@')[0];
        document.getElementById('side-name').innerText = user.split('@')[0];
        document.getElementById('side-email').innerText = user;
        sync();
        setInterval(sync, 60000);
    }

    async function sync() {
        const icon = document.getElementById('sync-icon');
        icon.classList.add('lucide-spin');
        try {
            const r = await fetch(`${API}?email=${user}`);
            const data = await r.json();
            if(mails.length > 0 && data.length > mails.length) {
                showToast(data[0].sender.split('<')[0], data[0].subject);
            }
            mails = data;
            localStorage.setItem('alpha_cache_' + user, JSON.stringify(mails));
            render();
        } catch(e) {} finally { icon.classList.remove('lucide-spin'); }
    }

    function render() {
        const list = document.getElementById('mail-list');
        document.getElementById('stat-total').innerText = mails.length + " Thư";
        
        list.innerHTML = mails.map(m => `
            <div class="mail-card ${!readStatus[m.id] ? 'unread' : ''}" onclick="read('${m.id}')">
                <p style="font-size: 11px; color: var(--primary); font-weight: 800; text-transform: uppercase; margin-bottom: 8px;">${m.sender.split('<')[0]}</p>
                <p style="font-size: 15px; font-weight: 700; margin-bottom: 6px;">${m.subject || '(Không tiêu đề)'}</p>
                <p style="font-size: 13px; color: var(--text-sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${m.body}</p>
                ${m.hasAttachment ? '<div class="attachment-pill" style="margin-top:12px;"><i data-lucide="paperclip" size="12"></i> Chứa đính kèm</div>' : ''}
            </div>
        `).join('');
        lucide.createIcons();
    }

    function read(id) {
        activeMail = mails.find(x => x.id === id);
        readStatus[id] = true;
        localStorage.setItem('alpha_read_' + user, JSON.stringify(readStatus));
        render();

        const content = document.getElementById('read-content');
        content.innerHTML = `
            <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 20px;">${activeMail.subject}</h1>
            <div style="display:flex; gap:12px; margin-bottom:30px;">
                <div style="width:44px; height:44px; background:var(--surface); border-radius:12px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); font-weight:800;">${activeMail.sender.charAt(0)}</div>
                <div>
                    <p style="font-weight:700;">${activeMail.sender.split('<')[0]}</p>
                    <p style="font-size:12px; color:var(--text-sub);">${activeMail.sender}</p>
                </div>
            </div>
            <div style="font-size:16px; line-height:1.7; color:rgba(255,255,255,0.8); white-space:pre-wrap; margin-bottom:30px;">${activeMail.body}</div>
            <div id="read-attachments"></div>
        `;
        openPanel('read-panel');
    }

    async function sendMail() {
        const to = document.getElementById('c-to').value.trim();
        const sub = document.getElementById('c-sub').value.trim();
        const body = document.getElementById('c-body').value.trim();
        if(!to || !body) return;

        showToast("Hệ thống", "Đang truyền tải...");
        closePanel('compose-panel');

        try {
            const payload = { action: 'send', from: user, to, subject: sub, body, attachment: attachedFile };
            const r = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            const d = await r.json();
            if(d.status === 'success') {
                showToast("Hoàn tất", "Thư đã được gửi đi");
                removeFile();
            }
        } catch(e) { showToast("Lỗi", "Gửi thư thất bại", false); }
    }

    // --- PROFILE ---
    function openSettings() {
        document.getElementById('p-name').value = user.split('@')[0];
        document.getElementById('p-pass').value = '';
        toggleSidebar();
        openPanel('settings-panel');
    }

    async function saveProfile() {
        const name = document.getElementById('p-name').value.trim();
        const pass = document.getElementById('p-pass').value.trim();
        
        showToast("Hệ thống", "Đang cập nhật hồ sơ...");
        try {
            const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'update_profile', email: user, name, pass }) });
            const d = await r.json();
            if(d.status === 'success') {
                showToast("Thành công", "Đã cập nhật thông tin");
                closePanel('settings-panel');
                document.getElementById('user-display').innerText = name;
            }
        } catch(e) { showToast("Lỗi", "Không thể cập nhật", false); }
    }

    function openCompose() { removeFile(); openPanel('compose-panel'); }
    function logout() { localStorage.clear(); location.reload(); }

    window.onload = () => { 
        lucide.createIcons();
        if(user) initApp(); 
    };
</script>

</body>
</html>
