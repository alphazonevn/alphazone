<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Zone | Minimalist Digital Solutions</title>
    <meta name="description" content="Alpha Zone cung cấp các giải pháp số tối giản, thanh lịch và tối ưu cho người dùng hiện đại.">
    <meta name="theme-color" content="#050505">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://alphazone.io.vn/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Alpha Zone | Minimalist Digital Solutions">
    <meta property="og:description" content="Khám phá catalog dịch vụ số cao cấp, quy trình thanh toán rõ ràng và hỗ trợ nhanh qua Zalo.">
    <meta property="og:image" content="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png">
    <meta property="og:url" content="https://alphazone.io.vn/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png">
    
    <!-- External Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Elegant Fonts (Outfit & JetBrains Thin) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500&family=JetBrains+Mono:wght@100;200;300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #ff5f1f;
            --bg: #050505;
            --surface: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08);
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: #fff;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Minimalist Mesh Background */
        .ambient-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 95, 31, 0.05) 0px, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(30, 64, 175, 0.05) 0px, transparent 40%);
            z-index: -1;
            filter: blur(60px);
            pointer-events: none;
        }

        /* Nav Glass */
        .glass-nav {
            background: rgba(5, 5, 5, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }

        /* Thin Minimal Cards */
        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-card:hover {
            border-color: rgba(255, 95, 31, 0.3);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-4px);
        }

        /* Ghost Buttons */
        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-weight: 300;
            border-radius: 12px;
            transition: all 0.4s ease;
        }

        .btn-ghost:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-accent {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 300;
            border-radius: 12px;
            transition: all 0.4s ease;
        }

        .btn-accent:hover {
            background: var(--accent);
            color: #000;
        }

        /* Search Input */
        .search-input {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: #fff;
            font-weight: 200;
            transition: all 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Fade Animations */
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Receipt PDF Styling */
        .receipt-card {
            background: #ffffff;
            color: #000;
            border-radius: 24px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
        }

        /* Minimal Scrollbar */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Production Polish */
        * { box-sizing: border-box; }
        a, button, input { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, input:focus-visible, a:focus-visible { outline: 1px solid rgba(255, 95, 31, 0.7); outline-offset: 4px; }
        .mobile-menu { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, opacity 0.35s ease; opacity: 0; }
        .mobile-menu.open { max-height: 240px; opacity: 1; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        @media (max-width: 640px) { .receipt-card { border-radius: 20px; padding: 28px !important; } }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <noscript><div style="padding:16px;text-align:center;background:#ff5f1f;color:#050505;font-family:Arial,sans-serif;position:relative;z-index:9999;">Trình duyệt cần bật JavaScript để xem catalog và tạo hóa đơn Alpha Zone.</div></noscript>

    <!-- Navigation Bar -->
    <nav class="glass-nav fixed top-0 w-full z-[100] px-6 md:px-12 py-4 flex justify-between items-center transition-all duration-300">
        <div class="flex items-center gap-4 cursor-pointer group" onclick="navigate('home')">
            <div class="w-8 h-8 rounded-full overflow-hidden opacity-90 group-hover:opacity-100 transition-opacity">
                <img src="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png" class="w-full h-full object-cover grayscale contrast-125">
            </div>
            <div class="flex flex-col">
                <span class="font-light tracking-[0.2em] text-sm uppercase leading-none">Alpha<span class="font-medium text-orange-500">Zone</span></span>
                <span class="text-[7px] uppercase tracking-[0.3em] text-white/30 font-light mt-1">Minimalist Workspace</span>
            </div>
        </div>
        
        <div class="hidden md:flex items-center gap-10 text-[9px] font-light uppercase tracking-[0.2em] text-white/50">
            <a href="javascript:void(0)" onclick="navigate('home')" class="hover:text-white transition-colors">Catalog</a>
            <a href="javascript:void(0)" onclick="scrollToServices()" class="hover:text-white transition-colors">Services</a>
            <a href="https://zalo.me/0357130499" target="_blank" class="hover:text-white transition-colors">Support</a>
        </div>

        <div class="flex items-center gap-2">
            <button id="sync-btn" onclick="syncData()" class="text-[8px] font-light uppercase tracking-[0.2em] border border-white/10 px-4 py-2 rounded-lg hover:bg-white hover:text-black transition-all">Sync Data</button>
            <button onclick="toggleMobileMenu()" class="md:hidden text-white/70 border border-white/10 px-3 py-2 rounded-lg hover:bg-white hover:text-black transition-all" aria-label="Open navigation menu">
                <span class="block w-4 h-[1px] bg-current mb-1"></span><span class="block w-4 h-[1px] bg-current"></span>
            </button>
        </div>
    </nav>

    <div id="mobile-menu" class="mobile-menu fixed top-[65px] left-0 right-0 z-[90] md:hidden glass-nav px-6 safe-bottom">
        <div class="py-5 flex flex-col gap-4 text-[10px] font-light uppercase tracking-[0.25em] text-white/60">
            <a href="javascript:void(0)" onclick="navigate('home')" class="hover:text-white transition-colors">Catalog</a>
            <a href="javascript:void(0)" onclick="scrollToServices()" class="hover:text-white transition-colors">Services</a>
            <a href="https://zalo.me/0357130499" target="_blank" rel="noopener" class="hover:text-white transition-colors">Support Zalo</a>
        </div>
    </div>

    <!-- Main Content Area -->
    <main id="app-container" class="pt-32 pb-24 px-6 md:px-12 lg:px-24 min-h-screen">
        <!-- Initial Loader -->
        <div class="flex flex-col items-center justify-center min-h-[60vh] gap-4">
            <div class="w-8 h-8 border-[1px] border-white/10 border-t-white/80 rounded-full animate-spin"></div>
            <p class="text-white/40 font-light tracking-[0.3em] uppercase text-[9px] animate-pulse">Initializing Alpha Core...</p>
        </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="border-t border-white/5 py-12 px-6 text-center">
        <div class="max-w-4xl mx-auto flex flex-col items-center justify-center gap-6">
            <img src="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png" class="w-6 h-6 grayscale opacity-20">
            <p class="text-[9px] font-light uppercase tracking-[0.4em] text-white/20">© 2026 Alpha Zone Elite. Crafted with minimal perfection.</p>
        </div>
    </footer>

    <!-- Custom Toast System -->
    <div id="toast-container" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // --- CONFIGURATION ---
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1B2FMQ9pKHFQpY4eFMIqnEEHEqvgqq72USV86HgH6d5E/export?format=csv&gid=1122697140';
        const CACHE_KEY = 'alphazone_products_minimal';
        const LOGO_URL = 'https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png';
        const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80';
        const FALLBACK_PRODUCTS = [
            { id: 'az-demo-01', title: 'Premium Digital Workspace', category: 'Workspace', price: 'Contact', duration: 'Flexible', image: LOGO_URL, description: 'Gói dịch vụ mẫu hiển thị khi chưa thể đồng bộ dữ liệu từ Google Sheets.', features: ['Catalog vẫn hoạt động khi mất kết nối', 'Có thể đồng bộ lại bằng nút Sync Data', 'Hỗ trợ đặt hàng qua Zalo'] },
            { id: 'az-demo-02', title: 'Account Service', category: 'Digital Service', price: 'Contact', duration: 'Monthly', image: FALLBACK_IMAGE, description: 'Giải pháp số được trình bày theo phong cách tối giản của Alpha Zone.', features: ['Quy trình rõ ràng', 'Tạo hóa đơn tự động', 'Tải PDF sau khi thanh toán'] }
        ];
        
        let allProducts = [];
        let categories = [];

        // --- TOAST SYSTEM ---
        function showToast(message, type = 'default') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'text-green-400 border-green-500/30' : (type === 'error' ? 'text-red-400 border-red-500/30' : 'text-white border-white/10');
            
            toast.className = `bg-black/80 backdrop-blur-md border ${color} px-6 py-3 rounded-xl text-[10px] font-light uppercase tracking-[0.2em] shadow-2xl transition-all duration-500 opacity-0 transform translate-y-4`;
            toast.innerHTML = message;
            
            container.appendChild(toast);
            
            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');
            });

            // Animate out
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // --- APP ENGINE ---
        async function initApp() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    setProducts(data.products);
                    handleRoute();
                }
            } catch (error) {
                console.warn('Cache unavailable:', error);
                setProducts(FALLBACK_PRODUCTS);
                handleRoute();
            }
            await syncData(true);
        }

        function normalizeProduct(row, idx) {
            return {
                id: String(row.ID || `az-${idx}`).trim(),
                title: String(row.Title || '').trim(),
                category: String(row.Category || 'Uncategorized').trim(),
                price: String(row.Price || 'Contact').trim(),
                duration: String(row.Duration || 'Lifetime').trim(),
                image: String(row.Image_URL || FALLBACK_IMAGE).trim(),
                description: String(row.Description || 'Exclusive digital solution by Alpha Zone.').trim(),
                features: row.Features ? String(row.Features).split('|').map(f => f.trim()).filter(Boolean) : []
            };
        }

        function setProducts(products) {
            allProducts = Array.isArray(products) && products.length ? products : FALLBACK_PRODUCTS;
            categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
        }

        async function syncData(isInitial = false) {
            const btn = document.getElementById('sync-btn');
            if (btn) btn.innerText = 'SYNCING...';

            try {
                const response = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const parsedProducts = results.data
                            .filter(row => row.Title && String(row.Title).trim() !== "")
                            .map((row, idx) => normalizeProduct(row, idx));
                        setProducts(parsedProducts);
                        
                        localStorage.setItem(CACHE_KEY, JSON.stringify({
                            syncedAt: new Date().toISOString(),
                            products: allProducts
                        }));

                        if (btn) {
                            btn.innerText = 'SYNCED';
                            setTimeout(() => btn.innerText = 'Sync Data', 2000);
                        }
                        
                        if (!isInitial) showToast('Database synchronized successfully', 'success');
                        if (isInitial || !window.location.hash) handleRoute();
                    }
                });
            } catch (error) {
                console.error("Sync Error:", error);
                if (!allProducts.length) {
                    setProducts(FALLBACK_PRODUCTS);
                    handleRoute();
                }
                if (btn) btn.innerText = 'SYNC FAILED';
                if (!isInitial) showToast('Failed to connect to database. Showing cached/fallback data.', 'error');
            }
        }

        function handleRoute() {
            const hash = window.location.hash || '#home';
            if (hash === '#home') {
                renderHome();
            } else if (hash.startsWith('#category-')) {
                renderCategoryPage(decodeURIComponent(hash.replace('#category-', '')));
            } else if (hash.startsWith('#product-')) {
                renderProductDetail(decodeURIComponent(hash.replace('#product-', '')));
            } else if (hash.startsWith('#checkout-')) {
                renderCheckout(decodeURIComponent(hash.replace('#checkout-', '')));
            } else {
                renderHome();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigate(path) { closeMobileMenu(); window.location.hash = path; }

        function toggleMobileMenu() { document.getElementById('mobile-menu')?.classList.toggle('open'); }
        function closeMobileMenu() { document.getElementById('mobile-menu')?.classList.remove('open'); }

        function scrollToServices() {
            if (window.location.hash !== '#home') {
                navigate('home');
                setTimeout(() => document.getElementById('services-section')?.scrollIntoView(), 300);
            } else {
                document.getElementById('services-section')?.scrollIntoView();
            }
        }

        // --- LIVE SEARCH ---
        function handleSearch(query) {
            const q = query.toLowerCase().trim();
            const grid = document.getElementById('product-grid');
            if (!grid) return;
            
            const filtered = allProducts.filter(p => 
                p.title.toLowerCase().includes(q) || 
                p.category.toLowerCase().includes(q) ||
                p.description.toLowerCase().includes(q)
            );
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-white/30 font-light text-xs uppercase tracking-[0.2em]">No services found for "${query}"</div>`;
            } else {
                grid.innerHTML = filtered.slice(0, 9).map(p => productCardTemplate(p)).join('');
            }
        }

        // --- VIEW RENDERING ---

        function renderHome() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="fade-in space-y-32">
                    <!-- Ultra Thin Hero Section -->
                    <header class="max-w-4xl mx-auto text-center pt-10">
                        <p class="text-orange-500 font-light text-[9px] tracking-[0.8em] uppercase mb-8">Redefining Digital Experience</p>
                        <h1 class="font-extralight text-5xl md:text-[90px] tracking-tighter leading-[1.1] mb-10">
                            Digital Elegance. <br> <span class="font-thin text-white/40">Perfect Execution.</span>
                        </h1>
                        <p class="text-white/40 max-w-lg mx-auto text-xs font-light leading-relaxed uppercase tracking-[0.1em]">
                            Khám phá bộ sưu tập dịch vụ cao cấp được chọn lọc tinh tế, mang đến hiệu suất tối đa cho hệ sinh thái của bạn.
                        </p>
                    </header>

                    <!-- Search & Filter -->
                    <section id="services-section" class="space-y-12 max-w-6xl mx-auto">
                        <div class="flex flex-col md:flex-row justify-between items-center gap-8">
                            <!-- Category Pills -->
                            <div class="flex gap-3 overflow-x-auto w-full md:w-auto pb-2 no-scrollbar">
                                <button onclick="renderHome()" class="whitespace-nowrap px-5 py-2.5 bg-white text-black rounded-xl text-[9px] font-medium uppercase tracking-[0.2em] transition-all">
                                    All
                                </button>
                                ${categories.map(cat => `
                                    <button onclick="navigate('category-${encodeURIComponent(cat)}')" class="whitespace-nowrap px-5 py-2.5 border border-white/10 rounded-xl text-[9px] font-light uppercase tracking-[0.2em] hover:bg-white/5 transition-all">
                                        ${cat}
                                    </button>
                                `).join('')}
                            </div>
                            
                            <!-- Search Bar -->
                            <div class="w-full md:w-64 relative">
                                <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-3 h-3 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                <input type="text" placeholder="Tìm kiếm dịch vụ..." onkeyup="handleSearch(this.value)" class="search-input w-full pl-10 pr-4 py-3 text-[10px] uppercase tracking-widest placeholder:text-white/20">
                            </div>
                        </div>

                        <!-- Product Grid -->
                        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${allProducts.slice(0, 9).map(p => productCardTemplate(p)).join('')}
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 pt-4">
                            ${['Chọn gói phù hợp', 'Thanh toán qua QR', 'Nhận mã kích hoạt', 'Gửi mã cho seller'].map((step, index) => `
                                <div class="border border-white/5 rounded-2xl p-5 bg-white/[0.015]">
                                    <p class="mono text-orange-500/80 text-[10px] mb-3">0${index + 1}</p>
                                    <p class="text-white/50 text-[10px] font-light uppercase tracking-[0.2em] leading-relaxed">${step}</p>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                </div>
            `;
        }

        function renderCategoryPage(catName) {
            const container = document.getElementById('app-container');
            const filtered = allProducts.filter(p => p.category === catName);
            
            container.innerHTML = `
                <div class="fade-in max-w-6xl mx-auto">
                    <div class="flex items-center justify-between mb-16 border-b border-white/5 pb-8">
                        <button onclick="navigate('home')" class="text-[9px] font-light uppercase tracking-[0.3em] text-white/40 hover:text-white transition-colors flex items-center gap-2">
                            <span>←</span> Catalog
                        </button>
                        <div class="text-right">
                            <h1 class="font-extralight text-4xl tracking-tight uppercase mb-2">${catName}</h1>
                            <p class="text-white/30 uppercase text-[8px] font-light tracking-[0.2em]">${filtered.length} Services</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${filtered.map(p => productCardTemplate(p)).join('')}
                    </div>
                </div>
            `;
        }

        function renderProductDetail(id) {
            const p = allProducts.find(item => item.id === id);
            if (!p) return navigate('home');

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="max-w-5xl mx-auto fade-in">
                    <button onclick="window.history.back()" class="mb-12 text-[9px] font-light uppercase tracking-[0.3em] text-white/40 hover:text-white transition-colors flex items-center gap-3">
                        <span class="w-8 h-[1px] bg-white/40"></span> Khám phá tiếp
                    </button>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                        <div class="aspect-[3/4] rounded-3xl overflow-hidden border border-white/5 bg-[#0a0a0a]">
                            <img src="${p.image}" onerror="this.onerror=null;this.src=LOGO_URL" alt="${p.title}" class="w-full h-full object-cover opacity-80" crossorigin="anonymous">
                        </div>

                        <div class="space-y-12">
                            <div>
                                <span class="text-orange-500 font-light text-[9px] tracking-[0.4em] uppercase block mb-4">${p.category}</span>
                                <h1 class="font-thin text-5xl md:text-6xl tracking-tighter uppercase leading-tight mb-8">${p.title}</h1>
                                <div class="flex items-end gap-4">
                                    <span class="font-light text-4xl text-white tracking-tight">${p.price}</span>
                                    <span class="text-white/30 font-light uppercase text-[10px] tracking-widest pb-1">/ ${p.duration}</span>
                                </div>
                            </div>

                            <div class="h-[1px] w-full bg-white/5"></div>

                            <div class="space-y-6">
                                <h4 class="text-[8px] font-medium uppercase tracking-[0.4em] text-white/30">Tổng quan</h4>
                                <p class="text-white/50 leading-loose font-light text-sm text-justify">${p.description}</p>
                            </div>

                            ${p.features.length > 0 ? `
                                <div class="space-y-6">
                                    <h4 class="text-[8px] font-medium uppercase tracking-[0.4em] text-white/30">Đặc quyền</h4>
                                    <ul class="space-y-3">
                                        ${p.features.map(f => `
                                            <li class="flex items-start gap-4">
                                                <span class="text-orange-500 text-xs mt-0.5 font-light">+</span>
                                                <span class="text-xs font-light tracking-wide text-white/70">${f}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            ` : ''}

                            <div class="pt-8 flex flex-col sm:flex-row gap-4">
                                <button onclick="triggerCheckoutProcess('${encodeURIComponent(p.id)}')" class="btn-accent px-10 py-4 text-[10px] uppercase tracking-[0.3em] flex-1 text-center">
                                    Khởi tạo Đơn Hàng
                                </button>
                                <button onclick="shareProduct('${encodeURIComponent(p.id)}')" class="btn-ghost px-6 py-4 flex items-center justify-center">
                                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-11-4 5-5 5 5m-5-5v11"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Checkout Process Simulator
        function triggerCheckoutProcess(id) {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[60vh] gap-6 fade-in">
                    <div class="w-10 h-10 border-[1px] border-white/10 border-t-orange-500 rounded-full animate-spin"></div>
                    <p class="text-white/50 font-light tracking-[0.3em] uppercase text-[9px] animate-pulse">Establishing Secure Connection...</p>
                    <p class="text-white/30 font-mono text-[8px]">Generating encrypted invoice ID</p>
                </div>
            `;
            setTimeout(() => navigate('checkout-' + id), 1500);
        }

        function renderCheckout(id) {
            const p = allProducts.find(item => item.id === id);
            if (!p) return navigate('home');

            const now = new Date();
            const txId = 'AZ-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            const activationCode = id.substring(0, 4).toUpperCase() + '-' + Math.random().toString().slice(2, 8) + '-' + Math.random().toString().slice(2, 6);
            const amount = p.price.replace(/[^\d]/g, '');
            const qrAmount = amount ? `amount=${amount}&` : '';

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="max-w-4xl mx-auto fade-in pb-10">
                    <nav class="flex justify-between items-center mb-10">
                        <button onclick="window.history.back()" class="text-[9px] font-light uppercase tracking-[0.3em] text-white/40 hover:text-white transition-colors">
                            ← Hủy
                        </button>
                        <button onclick="downloadPDF()" class="btn-ghost px-6 py-2.5 text-[9px] uppercase tracking-[0.2em] flex items-center gap-2">
                            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg>
                            Lưu PDF
                        </button>
                    </nav>

                    <!-- Ultra Clean Minimal Receipt -->
                    <div id="receipt-capture" class="receipt-card p-10 md:p-16 relative">
                        <!-- Header -->
                        <div class="flex justify-between items-start border-b border-gray-100 pb-10 mb-10">
                            <div>
                                <h2 class="font-extralight text-3xl tracking-tight uppercase text-black mb-1">Invoice</h2>
                                <p class="text-gray-400 text-[8px] font-medium tracking-[0.3em] uppercase">Alpha Zone Digital</p>
                            </div>
                            <div class="text-right">
                                <img src="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png" class="w-8 h-8 ml-auto grayscale opacity-80 mb-2">
                                <p class="mono text-[9px] text-gray-500 font-medium">REF: ${txId}</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-16 mb-12">
                            <!-- Details -->
                            <div class="space-y-8">
                                <div>
                                    <p class="text-gray-400 text-[8px] font-medium uppercase tracking-[0.3em] mb-2">Service Details</p>
                                    <h3 class="font-light text-2xl text-black tracking-tight mb-1">${p.title}</h3>
                                    <p class="text-gray-500 font-light text-[11px] uppercase tracking-wider">${p.category} • ${p.duration}</p>
                                </div>
                                <div class="flex gap-10">
                                    <div>
                                        <p class="text-gray-400 text-[8px] font-medium uppercase tracking-[0.3em] mb-1">Date</p>
                                        <p class="text-xs font-medium text-black">${now.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}</p>
                                    </div>
                                    <div>
                                        <p class="text-gray-400 text-[8px] font-medium uppercase tracking-[0.3em] mb-1">Total Due</p>
                                        <p class="text-sm font-semibold text-orange-500">${p.price}</p>
                                    </div>
                                </div>
                                
                                <div class="pt-6">
                                    <p class="text-gray-400 text-[8px] font-medium uppercase tracking-[0.3em] mb-3">Activation Key (Encrypted)</p>
                                    <div class="bg-gray-50 border border-gray-100 rounded-xl p-6 cursor-pointer hover:border-gray-300 transition-all" onclick="copyCode('${activationCode}')">
                                        <p class="mono text-xl font-medium text-black tracking-widest text-center">${activationCode}</p>
                                    </div>
                                </div>
                            </div>

                            <!-- QR Code Minimal -->
                            <div class="flex flex-col items-center justify-center">
                                <div class="w-56 h-56 bg-white border border-gray-100 p-4 rounded-3xl shadow-sm mb-6">
                                    <img src="https://img.vietqr.io/image/MB-4499123123-compact2.jpg?${qrAmount}addInfo=${txId}" class="w-full h-full object-contain">
                                </div>
                                <div class="text-center">
                                    <p class="text-[9px] font-medium text-gray-400 uppercase tracking-[0.3em] mb-1">MB Bank Transfer</p>
                                    <p class="text-xs font-semibold text-black uppercase tracking-widest">Nguyễn Lê Trí</p>
                                    <p class="mono text-[10px] text-gray-500 mt-1">4499.123.123</p>
                                </div>
                            </div>
                        </div>

                        <!-- Footer Note -->
                        <div class="border-t border-gray-100 pt-8 flex justify-between items-center text-[8px] uppercase tracking-[0.2em] text-gray-400">
                            <p>Send key to Zalo: 0357.130.499</p>
                            <p>Thank you for choosing Alpha</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- TEMPLATES ---
        function productCardTemplate(p) {
            return `
                <div class="product-card p-5 flex flex-col group cursor-pointer" onclick="navigate('product-${encodeURIComponent(p.id)}')">
                    <div class="w-full aspect-video rounded-xl overflow-hidden mb-6 bg-[#0a0a0a] relative">
                        <img src="${p.image}" onerror="this.onerror=null;this.src=LOGO_URL" class="w-full h-full object-cover opacity-80 transition-transform duration-1000 group-hover:scale-105" loading="lazy" alt="${p.title}">
                    </div>
                    <div class="flex-grow flex flex-col justify-between">
                        <div class="mb-6">
                            <p class="text-[8px] font-light text-white/30 uppercase tracking-[0.3em] mb-2">${p.category}</p>
                            <h3 class="text-lg font-light tracking-tight uppercase leading-snug group-hover:text-orange-500 transition-colors line-clamp-2">${p.title}</h3>
                        </div>
                        <div class="flex justify-between items-center border-t border-white/5 pt-4">
                            <p class="font-light text-white tracking-wide">${p.price}</p>
                            <span class="text-[9px] font-light uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-all text-white/50">View</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- UTILS ---
        function copyCode(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied Key: ${text}`, 'success');
            }).catch(() => {
                showToast('Failed to copy', 'error');
            });
        }

        async function shareProduct(id) {
            id = decodeURIComponent(id);
            const p = allProducts.find(prod => prod.id === id);
            const url = window.location.origin + window.location.pathname + '#product-' + encodeURIComponent(id);
            if (navigator.share) {
                await navigator.share({ title: `Alpha Zone | ${p.title}`, url: url });
            } else {
                navigator.clipboard.writeText(url);
                showToast('Link copied to clipboard', 'success');
            }
        }

        function downloadPDF() {
            showToast('Generating high-quality PDF...', 'default');
            const element = document.getElementById('receipt-capture');
            const opt = {
                margin: [0, 0],
                filename: 'AlphaZone-Invoice-' + Date.now() + '.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3, useCORS: true, logging: false },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save().then(() => {
                showToast('PDF Downloaded successfully', 'success');
            });
        }

        // --- INIT ---
        window.addEventListener('load', initApp);
        window.addEventListener('hashchange', handleRoute);

    </script>
</body>
</html>
