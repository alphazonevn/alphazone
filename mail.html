<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mail PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#020202;color:#fff}
.otp{color:#10b981;font-weight:bold;cursor:pointer}
</style>
</head>
<body class="max-w-md mx-auto p-4">

<h1 class="text-center font-bold mb-4">⚡ Mail PRO</h1>

<div id="mail" class="text-center mb-3"></div>
<div id="inbox"></div>

<script>
const GAS="https://script.google.com/macros/s/AKfycbyYxSz6TgL3jhJTbaX2TMNIaYb-VzghQ8DNFBH08PR-bb_fp3gDcieL_Ie-sg5IIK5D/exec";

let current="";
let lastTime=null;

// init
async function init(){
  current=Math.random().toString(36).slice(2,10)+"@alphazone.io.vn";
  document.getElementById("mail").innerText=current;
  load();
}

// highlight OTP
function hOTP(t){
  return t.replace(/\b\d{4,6}\b/g,
    m=>`<span class="otp" onclick="copy('${m}')">${m}</span>`);
}

// copy
function copy(t){
  navigator.clipboard.writeText(t);
}

// load incremental
async function load(){
  let url = `${GAS}?address=${current}`;
  if(lastTime) url += `&since=${lastTime}`;

  const res = await fetch(url);
  const data = await res.json();

  if(data.length){
    lastTime = data[data.length-1].time;

    new Audio("https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3").play();

    const html = data.map(m=>`
      <div class="p-3 border mb-2">
        <b>${m.subject||""}</b><br>
        ${hOTP(m.content||"")}
      </div>
    `).join("");

    document.getElementById("inbox").innerHTML = html + document.getElementById("inbox").innerHTML;
  }
}

setInterval(load,3000);
init();
</script>

</body>
</html>
