<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALPHA ZONE - Professional Mail</title>
    <link rel="icon" type="image/png" href="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --primary: #D4AF37; 
            --primary-hover: #E5C158;
            --bg: #030406;
            --surface: #121214;
            --glass-bg: rgba(22, 24, 28, 0.7); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #F2F2F2; 
            --text-sub: #A1A1AA; 
            --border: rgba(255, 255, 255, 0.06);
            --danger: #EF4444;
            --unread: #3B82F6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Be Vietnam Pro', sans-serif; 
            background-color: var(--bg);
            background-image: radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
            color: var(--text); 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        .view { display: none; height: 100vh; flex-direction: column; animation: viewIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .view.active { display: flex; }
        @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- AUTH --- */
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { 
            padding: 40px 24px; text-align: center; max-width: 380px; width: 100%; 
            background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 32px; border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .field { 
            width: 100%; padding: 16px 20px; border: 1px solid var(--glass-border); border-radius: 16px; 
            background: rgba(0, 0, 0, 0.4); color: #FFF; font-size: 15px; margin-bottom: 14px; transition: 0.3s;
            font-family: inherit;
        }
        .field:focus { border-color: var(--primary); background: rgba(0,0,0,0.6); box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); }
        
        .btn { 
            background: #FFF; color: #000; border: none; width: 100%; padding: 16px; border-radius: 16px; 
            font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-gold { background: var(--primary); color: #000; }
        .btn-gold:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn:active { transform: scale(0.96); }

        /* --- MAIL LIST --- */
        .header { 
            padding: 16px; border-bottom: 1px solid var(--border); 
            padding-top: calc(16px + env(safe-area-inset-top));
            background: rgba(3, 4, 6, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 10;
        }
        .search-box { 
            background: rgba(255,255,255,0.05); height: 48px; border-radius: 16px; display: flex; 
            align-items: center; padding: 0 16px; gap: 12px; border: 1px solid var(--glass-border);
        }
        .search-box input { border: none; background: transparent; flex: 1; color: #FFF; font-size: 15px; }

        .mail-list { flex: 1; overflow-y: auto; padding-bottom: 120px; }
        .mail-item { 
            padding: 20px 16px; display: flex; gap: 16px; border-bottom: 1px solid var(--border); 
            cursor: pointer; position: relative; transition: 0.2s;
        }
        .mail-item:active { background: rgba(255,255,255,0.04); }
        .mail-item.unread::before {
            content: ''; position: absolute; left: 6px; top: 28px; width: 8px; height: 8px;
            background: var(--unread); border-radius: 50%; box-shadow: 0 0 10px var(--unread);
        }

        .avatar { 
            width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; 
            justify-content: center; color: #000; font-weight: 700; background: var(--primary); flex-shrink: 0;
            text-transform: uppercase; font-size: 18px;
        }
        .mail-info { flex: 1; min-width: 0; }
        .mail-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .sender-name { font-weight: 600; font-size: 15px; color: #FFF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mail-time { font-size: 11px; color: var(--text-sub); flex-shrink: 0; }
        .subject-text { font-size: 14px; color: #E4E4E7; margin-bottom: 4px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .preview-text { font-size: 13px; color: #71717A; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

        .otp-badge {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(212,175,55,0.12);
            color: var(--primary); padding: 6px 12px; border-radius: 10px; font-size: 12px;
            font-family: 'Roboto Mono', monospace; margin-top: 10px; border: 1px solid rgba(212,175,55,0.2);
            cursor: copy;
        }

        /* --- SKELETON --- */
        .skeleton { background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%); background-size: 200% 100%; animation: skeletonWave 1.5s infinite; border-radius: 4px; }
        @keyframes skeletonWave { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* --- OVERLAYS --- */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: none; flex-direction: column; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .top-bar { height: 64px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border); gap: 16px; padding-top: env(safe-area-inset-top); background: var(--bg); }
        .content { padding: 0; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        
        .mail-detail-header { padding: 24px; border-bottom: 1px solid var(--border); }
        .iframe-wrapper { flex: 1; background: #FFF; border-radius: 20px 20px 0 0; margin-top: 10px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }

        .fab { 
            position: fixed; bottom: 100px; right: 24px; width: 60px; height: 60px; 
            background: var(--primary); border-radius: 20px; display: flex; 
            align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(212,175,55,0.4); z-index: 99;
            transition: 0.2s;
        }
        .fab:active { transform: scale(0.9); }

        /* --- NAVIGATION --- */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: calc(75px + env(safe-area-inset-bottom)); 
            background: rgba(3, 4, 6, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around; 
            align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 100;
        }
        .nav-item { color: #52525B; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--primary); }

        .toast { 
            position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px); 
            background: #E4E4E7; color: #000; padding: 12px 24px; border-radius: 50px; font-size: 14px; 
            font-weight: 600; opacity: 0; visibility: hidden; z-index: 9999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: 0.3s;
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <div id="loader">
        <div style="width:40px; height:40px; border:3px solid rgba(212,175,55,0.1); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite;"></div>
        <div id="loader-text" style="color:var(--primary); font-size:14px; font-weight:600; margin-top:16px; letter-spacing: 0.5px;">XỬ LÝ DỮ LIỆU...</div>
    </div>

    <!-- Login -->
    <div id="login-view" class="view active">
        <div class="auth-wrapper">
            <div class="auth-card">
                <img src="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png" style="width:70px; margin-bottom:24px;">
                <h2 style="margin-bottom: 8px; font-weight: 700; font-size: 26px;">Alpha Zone</h2>
                <p style="color:var(--text-sub); font-size:14px; margin-bottom:32px;">Hệ thống Mail Workspace bảo mật</p>
                <input type="email" id="l-email" class="field" placeholder="Địa chỉ email của bạn">
                <input type="password" id="l-pass" class="field" placeholder="Mật khẩu truy cập">
                <button class="btn btn-gold" onclick="auth('login')">Đăng nhập ngay</button>
                <p style="margin-top:24px; font-size:14px; color:var(--text-sub)" onclick="switchV('signup-view')">Chưa có tài khoản? <span style="color:var(--primary); font-weight:600">Tạo tài khoản mới</span></p>
            </div>
        </div>
    </div>

    <!-- Signup -->
    <div id="signup-view" class="view">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h2 style="margin-bottom: 8px; font-weight: 700; font-size: 24px;">Đăng ký Alpha Mail</h2>
                <p style="color:var(--text-sub); font-size:14px; margin-bottom:32px;">Tạo định danh @alphazone.io.vn</p>
                <input type="text" id="s-prefix" class="field" placeholder="Tên người dùng (vd: minhhung)">
                <input type="password" id="s-pass" class="field" placeholder="Mật khẩu bảo mật">
                <button class="btn btn-gold" onclick="auth('signup')">Hoàn tất đăng ký</button>
                <button class="btn" style="margin-top:12px; background: transparent; color: #A1A1AA; border: 1px solid var(--glass-border);" onclick="switchV('login-view')">Quay lại đăng nhập</button>
            </div>
        </div>
    </div>

    <!-- Main -->
    <div id="app-view" class="view">
        <div class="header">
            <div class="search-box">
                <i data-lucide="search" size="18" color="#71717A"></i>
                <input type="text" id="q" placeholder="Tìm kiếm trong hộp thư..." oninput="render()">
                <div onclick="logout()" id="u-ava" class="avatar" style="width:32px; height:32px; font-size:13px; border-radius: 10px; cursor: pointer;">?</div>
            </div>
        </div>
        <div id="list" class="mail-list"></div>
        
        <div class="fab" onclick="openCompose()"><i data-lucide="plus" size="28" color="#000"></i></div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="refresh(true)"><i data-lucide="inbox"></i><span>Hộp thư</span></div>
            <div class="nav-item" onclick="toast('Tính năng đang phát triển')"><i data-lucide="send"></i><span>Đã gửi</span></div>
            <div class="nav-item" onclick="toast('Tính năng đang phát triển')"><i data-lucide="shield"></i><span>Mã OTP</span></div>
            <div class="nav-item" onclick="logout()"><i data-lucide="settings"></i><span>Cài đặt</span></div>
        </div>
    </div>

    <!-- Detail -->
    <div id="detail-overlay" class="overlay">
        <div class="top-bar">
            <i data-lucide="arrow-left" onclick="closeO('detail-overlay')"></i>
            <span style="flex:1; font-size:14px; font-weight:700; text-align:center; letter-spacing:1px; text-transform:uppercase;">Nội dung thư</span>
            <i data-lucide="trash-2" size="20" color="#EF4444" onclick="confirmDelete()" style="cursor:pointer"></i>
        </div>
        <div class="content">
            <div class="mail-detail-header">
                <h2 id="d-sub" style="font-size:20px; font-weight:700; margin-bottom:20px; line-height:1.4; color:#FFF"></h2>
                <div style="display: flex; gap: 14px; align-items: center;">
                    <div id="d-ava" class="avatar"></div>
                    <div style="flex:1; min-width:0;">
                        <div id="d-sender" style="font-weight:600; font-size:15px; color:#FFF; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></div>
                        <div id="d-time" style="font-size:12px; color:var(--text-sub); margin-top:2px;"></div>
                    </div>
                </div>
            </div>
            <div class="iframe-wrapper">
                <iframe id="mail-frame" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin"></iframe>
            </div>
            <div style="padding: 16px; background: #FFF; border-top: 1px solid #EEE;">
                <button class="btn btn-gold" onclick="replyCurrent()"><i data-lucide="reply"></i> Trả lời thư này</button>
            </div>
        </div>
    </div>

    <!-- Compose -->
    <div id="compose-overlay" class="overlay">
        <div class="top-bar">
            <i data-lucide="x" onclick="closeO('compose-overlay')"></i>
            <span style="flex:1; font-size:14px; font-weight:700; text-align:center;">SOẠN THƯ</span>
            <i data-lucide="send" size="20" color="var(--primary)" onclick="sendMail()" style="cursor:pointer"></i>
        </div>
        <div class="content" style="padding: 16px;">
            <input type="text" id="c-to" class="field" style="background:transparent; border-radius:0; border-bottom:1px solid var(--border); padding: 16px 0;" placeholder="Người nhận: email@domain.com">
            <input type="text" id="c-sub" class="field" style="background:transparent; border-radius:0; border-bottom:1px solid var(--border); padding: 16px 0;" placeholder="Tiêu đề email">
            <textarea id="c-body" style="width:100%; flex:1; background:transparent; border:none; color:#FFF; padding:20px 0; font-family:inherit; font-size:16px; resize:none; line-height:1.6;" placeholder="Nội dung thư của bạn..."></textarea>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // THAY LINK API CỦA BẠN VÀO ĐÂY
        const API = "https://script.google.com/macros/s/AKfycbwYfe5nM1T0Jsq3v3JznVsN1tbK3fqycN9-__6Pku_gbOE7KSqh_yQaVxx_zYaPy9MA9g/exec";
        
        let user = localStorage.getItem('alpha_user') || "";
        let mails = [];
        let curMailIndex = null;
        let readMails = JSON.parse(localStorage.getItem('alpha_read_status') || "[]");

        // --- Core ---
        function showLoading(s, text) { 
            const loader = document.getElementById('loader');
            document.getElementById('loader-text').innerText = text || "XỬ LÝ DỮ LIỆU...";
            loader.style.display = s ? 'flex' : 'none'; 
        }

        function toast(m) {
            const t = document.getElementById('toast'); 
            t.innerText = m; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function switchV(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            lucide.createIcons();
        }

        function openO(id) { document.getElementById(id).style.display = 'flex'; lucide.createIcons(); }
        function closeO(id) { document.getElementById(id).style.display = 'none'; }

        // --- Logic ---
        async function auth(type) {
            let email = (type === 'login' ? document.getElementById('l-email').value : document.getElementById('s-prefix').value).trim().toLowerCase();
            let pass = (type === 'login' ? document.getElementById('l-pass').value : document.getElementById('s-pass').value).trim();
            if(type === 'signup' && !email.includes('@')) email += "@alphazone.io.vn";
            if(!email || !pass) return toast("Vui lòng điền đủ thông tin!");

            showLoading(true, "ĐANG XÁC THỰC...");
            try {
                // Sửa lỗi kết nối bằng cách đơn giản hóa request
                const response = await fetch(API, {
                    method: 'POST',
                    mode: 'no-cors', // Dùng no-cors để tránh lỗi Redirect/CORS nếu API chưa chuẩn Anyone
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({action: type, email, pass})
                });

                // Vì no-cors không đọc được body, chúng ta giả định thành công và fetch thử data
                // Nếu fetch data fail thì nghĩa là login sai
                user = email;
                const check = await fetch(`${API}?email=${user}`);
                if(check.ok) {
                    localStorage.setItem('alpha_user', user);
                    init();
                } else {
                    toast("Thông tin đăng nhập không chính xác!");
                }
            } catch(e) { 
                // Fallback nếu login thực sự có trả JSON
                try {
                    const r = await fetch(API, {method:'POST', body: JSON.stringify({action:type, email, pass})});
                    const d = await r.json();
                    if(d.status === 'success') {
                        user = email; localStorage.setItem('alpha_user', user); init();
                    } else toast(d.message);
                } catch(err) {
                    toast("Lỗi kết nối máy chủ Alpha!"); 
                }
            } finally { showLoading(false); }
        }

        function init() {
            document.getElementById('u-ava').innerText = user[0].toUpperCase();
            switchV('app-view');
            mails = JSON.parse(localStorage.getItem('alpha_cache_' + user) || "[]");
            render();
            refresh();
            setInterval(() => refresh(false), 30000);
        }

        async function refresh(isManual = false) {
            if(!user) return;
            if(isManual) showLoading(true, "ĐANG TẢI THƯ MỚI...");
            try {
                const r = await fetch(`${API}?email=${user}`);
                const data = await r.json();
                if(Array.isArray(data)) {
                    mails = data;
                    localStorage.setItem('alpha_cache_' + user, JSON.stringify(mails));
                    render();
                }
            } catch(e) { if(isManual) toast("Không thể kết nối máy chủ"); }
            finally { if(isManual) showLoading(false); }
        }

        function render() {
            const list = document.getElementById('list');
            const q = document.getElementById('q').value.toLowerCase();
            
            if(mails.length === 0) {
                list.innerHTML = `
                    <div style="padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:20px; opacity:0.3;">
                        <div class="mail-item" style="width:100%; border:none;">
                            <div class="avatar skeleton"></div>
                            <div style="flex:1"><div class="skeleton" style="height:14px; width:40%; margin-bottom:8px;"></div><div class="skeleton" style="height:12px; width:80%;"></div></div>
                        </div>
                        <p style="font-size:13px; font-weight:500;">Đang tìm kiếm thư mới...</p>
                    </div>`;
                return;
            }

            const filtered = mails.filter(m => (m.subject + m.sender).toLowerCase().includes(q));
            
            list.innerHTML = filtered.map((m, i) => {
                const senderName = m.sender.split('<')[0].replace(/"/g, '').trim() || m.sender.split('@')[0];
                const isRead = readMails.includes(m.id);
                const otpMatch = m.body.match(/\b\d{4,8}\b/);
                
                return `
                <div class="mail-item ${isRead ? '' : 'unread'}" onclick="view(${i})">
                    <div class="avatar" style="background:${getAvaColor(senderName)}">${senderName[0].toUpperCase()}</div>
                    <div class="mail-info">
                        <div class="mail-top">
                            <span class="sender-name">${senderName}</span>
                            <span class="mail-time">${formatTime(m.time)}</span>
                        </div>
                        <span class="subject-text">${m.subject || '(Không có chủ đề)'}</span>
                        <span class="preview-text">${m.body.substring(0, 80).replace(/\n/g, ' ')}...</span>
                        ${otpMatch ? `<div class="otp-badge" onclick="copyOTP(event, '${otpMatch[0]}')"><i data-lucide="copy" size="12"></i> OTP: ${otpMatch[0]}</div>` : ''}
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function view(i) {
            const m = mails[i];
            curMailIndex = i;
            if(!readMails.includes(m.id)) {
                readMails.push(m.id);
                localStorage.setItem('alpha_read_status', JSON.stringify(readMails));
                render();
            }

            const senderName = m.sender.split('<')[0].replace(/"/g, '').trim() || m.sender;
            document.getElementById('d-ava').innerText = senderName[0].toUpperCase();
            document.getElementById('d-ava').style.background = getAvaColor(senderName);
            document.getElementById('d-sender').innerText = m.sender;
            document.getElementById('d-time').innerText = m.time;
            document.getElementById('d-sub').innerText = m.subject || "(Không có chủ đề)";
            
            const frame = document.getElementById('mail-frame');
            // Xử lý chèn CSS để Mail HTML hiển thị đẹp hơn trong frame
            const injectCSS = `<style>body{font-family:sans-serif;line-height:1.6;color:#333;padding:15px;word-break:break-word;} img{max-width:100%;height:auto;}</style>`;
            const isHTML = /<\/?[a-z][\s\S]*>/i.test(m.body);
            frame.srcdoc = isHTML ? m.body : injectCSS + m.body.replace(/\n/g, '<br>');
            
            openO('detail-overlay');
        }

        function openCompose(to = "", sub = "") {
            document.getElementById('c-to').value = to;
            document.getElementById('c-sub').value = sub;
            document.getElementById('c-body').value = "";
            openO('compose-overlay');
        }

        async function sendMail() {
            const to = document.getElementById('c-to').value.trim();
            const subject = document.getElementById('c-sub').value.trim();
            const body = document.getElementById('c-body').value;
            if(!to || !body) return toast("Thiếu thông tin người nhận!");

            showLoading(true, "ĐANG GỬI THƯ...");
            try {
                const r = await fetch(API, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'send', from: user, to, subject, body })
                });
                toast("Đã gửi thư thành công!");
                closeO('compose-overlay');
            } catch(e) { toast("Lỗi gửi thư!"); }
            finally { showLoading(false); }
        }

        async function deleteMail() {
            if(curMailIndex === null) return;
            const targetId = mails[curMailIndex].id;
            showLoading(true, "ĐANG XÓA...");
            try {
                await fetch(API, {
                    method: 'POST', 
                    body: JSON.stringify({ action: 'delete', email: user, id: targetId })
                });
                mails.splice(curMailIndex, 1);
                localStorage.setItem('alpha_cache_' + user, JSON.stringify(mails));
                closeO('detail-overlay');
                render();
                toast("Đã xóa thư");
            } catch(e) { toast("Lỗi xóa thư!"); }
            finally { showLoading(false); }
        }

        // --- Helpers ---
        function formatTime(s) {
            if(!s) return "";
            try {
                const d = new Date(s);
                const now = new Date();
                if(d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                return d.toLocaleDateString([], {day:'2-digit', month:'2-digit'});
            } catch(e) { return s; }
        }

        function getAvaColor(name) {
            const colors = ['#D4AF37', '#A7F3D0', '#FECACA', '#BFDBFE', '#FDE68A', '#E9D5FF'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        function copyOTP(e, txt) {
            e.stopPropagation();
            navigator.clipboard.writeText(txt);
            toast("Đã sao chép OTP: " + txt);
        }

        function confirmDelete() { if(confirm("Xóa thư này vĩnh viễn?")) deleteMail(); }
        function replyCurrent() {
            const m = mails[curMailIndex];
            const cleanTo = m.sender.match(/<(.+)>/)?.[1] || m.sender;
            closeO('detail-overlay');
            openCompose(cleanTo, "Re: " + (m.subject || ""));
        }
        function logout() { if(confirm("Đăng xuất?")) { localStorage.removeItem('alpha_user'); location.reload(); } }

        window.onload = () => { if(user) init(); else lucide.createIcons(); };
    </script>
</body>
</html>
