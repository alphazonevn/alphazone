<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Alpha Mail Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#020202;color:#fff}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
  .otp{color:#10b981;font-weight:700;cursor:pointer}
  .link{color:#60a5fa}
</style>
</head>
<body class="max-w-md mx-auto p-4">

<h1 class="text-center font-bold mb-4">📩 Alpha Mail Hub</h1>

<input id="mail" class="w-full p-3 mb-3 rounded bg-black border border-gray-700" placeholder="abc@domain.com"/>
<div class="grid grid-cols-2 gap-2 mb-4">
  <button onclick="saveMail()" class="bg-emerald-500 p-3 rounded font-bold">LƯU</button>
  <button onclick="copyMail()" class="bg-white text-black p-3 rounded font-bold">COPY</button>
</div>

<div id="tabs" class="flex gap-2 overflow-x-auto mb-4"></div>

<div id="inbox"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzakSCoa9j-2e9ixoUMad-J4rQ33FpjoJKgo2gmTvUvpDcI7tnpRelxxZza2e3smm8gWw/exec";
let mails = JSON.parse(localStorage.getItem("mails")||"[]");
let current = localStorage.getItem("current")||"";

function saveMail(){
  const m=document.getElementById("mail").value.toLowerCase();
  if(!m)return;
  if(!mails.includes(m))mails.unshift(m);
  current=m;
  persist();
}

function copyMail(){
  navigator.clipboard.writeText(current);
  alert("Copied "+current);
}

function persist(){
  localStorage.setItem("mails",JSON.stringify(mails));
  localStorage.setItem("current",current);
  renderTabs();
  load();
}

function renderTabs(){
  document.getElementById("tabs").innerHTML = mails.map(m=>`
    <button onclick="switchMail('${m}')" 
      class="px-3 py-2 rounded ${m===current?'bg-emerald-500':'bg-gray-800'} text-xs">
      ${m.split('@')[0]}
    </button>`).join("");
}

function switchMail(m){
  current=m;persist();
}

function hOTP(t){
  return t.replace(/\b\d{4,8}\b/g, m=>`<span class="otp" onclick="copy('${m}')">${m}</span>`);
}
function hLink(t){
  return t.replace(/https?:\/\/[^\s]+/g, u=>`<a href="${u}" target="_blank" class="link">${u}</a>`);
}
function copy(t){ navigator.clipboard.writeText(t); }

async function load(){
  if(!current)return;
  const res=await fetch(`${GAS_URL}?mail=${current}&limit=30`);
  const data=await res.json();

  document.getElementById("inbox").innerHTML = data.map(m=>{
    let c=hLink(hOTP(m.content||""));
    return `<div class="card p-4 rounded mb-3">
      <div class="text-xs text-gray-400">${m.time}</div>
      <div class="font-bold text-sm">${m.subject||""}</div>
      <div class="text-xs text-gray-500 mb-1">${m.from||""}</div>
      <div class="text-sm break-words">${c}</div>
    </div>`;
  }).join("") || `<div class="text-center text-gray-600 mt-10">Chưa có mail</div>`;
}

setInterval(load,5000); // polling 5s
window.onload = renderTabs;
</script>

</body>
</html>
