<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALPHA ZONE - Professional Mail</title>
    <link rel="icon" type="image/png" href="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --primary: #D4AF37; 
            --primary-hover: #E5C158;
            --bg: #030406;
            --surface: #121214;
            --glass-bg: rgba(22, 24, 28, 0.7); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #F2F2F2; 
            --text-sub: #A1A1AA; 
            --border: rgba(255, 255, 255, 0.06);
            --danger: #EF4444;
            --unread: #3B82F6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Be Vietnam Pro', sans-serif; 
            background-color: var(--bg);
            background-image: radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
            color: var(--text); 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        .view { display: none; height: 100vh; flex-direction: column; animation: viewIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .view.active { display: flex; }
        @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- AUTH --- */
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { 
            padding: 40px 24px; text-align: center; max-width: 380px; width: 100%; 
            background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 32px; border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-group { position: relative; margin-bottom: 14px; }
        .field { 
            width: 100%; padding: 16px 20px; border: 1px solid var(--glass-border); border-radius: 16px; 
            background: rgba(0, 0, 0, 0.4); color: #FFF; font-size: 15px; transition: 0.3s;
            font-family: inherit;
        }
        .field:focus { border-color: var(--primary); background: rgba(0,0,0,0.6); box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); }
        .field-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-sub); cursor: pointer; z-index: 5;}
        
        .btn { 
            background: #FFF; color: #000; border: none; width: 100%; padding: 16px; border-radius: 16px; 
            font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-gold { background: var(--primary); color: #000; }
        .btn-gold:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-outline { background: transparent; color: #A1A1AA; border: 1px solid var(--glass-border); margin-top: 12px; }
        .btn:active { transform: scale(0.96); }

        /* --- MAIL LIST --- */
        .header { 
            padding: 16px; border-bottom: 1px solid var(--border); 
            padding-top: calc(16px + env(safe-area-inset-top));
            background: rgba(3, 4, 6, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 10;
        }
        .search-box { 
            background: rgba(255,255,255,0.05); height: 48px; border-radius: 16px; display: flex; 
            align-items: center; padding: 0 16px; gap: 12px; border: 1px solid var(--glass-border);
        }
        .search-box input { border: none; background: transparent; flex: 1; color: #FFF; font-size: 15px; }

        .mail-list { flex: 1; overflow-y: auto; padding-bottom: 120px; }
        .mail-item { 
            padding: 20px 16px; display: flex; gap: 16px; border-bottom: 1px solid var(--border); 
            cursor: pointer; position: relative; transition: 0.2s;
        }
        .mail-item:active { background: rgba(255,255,255,0.04); }
        .mail-item.unread::before {
            content: ''; position: absolute; left: 6px; top: 28px; width: 8px; height: 8px;
            background: var(--unread); border-radius: 50%; box-shadow: 0 0 10px var(--unread);
        }

        .avatar { 
            width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; 
            justify-content: center; color: #000; font-weight: 700; background: var(--primary); flex-shrink: 0;
            text-transform: uppercase; font-size: 18px; background-size: cover; background-position: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .mail-info { flex: 1; min-width: 0; }
        .mail-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .sender-name { font-weight: 600; font-size: 15px; color: #FFF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mail-time { font-size: 11px; color: var(--text-sub); flex-shrink: 0; }
        .subject-text { font-size: 14px; color: #E4E4E7; margin-bottom: 4px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .preview-text { font-size: 13px; color: #71717A; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

        /* --- OVERLAYS --- */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: none; flex-direction: column; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .top-bar { height: 64px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border); gap: 16px; padding-top: env(safe-area-inset-top); background: var(--bg); }
        .iframe-wrapper { flex: 1; background: #FFF; border-radius: 24px 24px 0 0; margin-top: 10px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }

        .fab { 
            position: fixed; bottom: 100px; right: 24px; width: 60px; height: 60px; 
            background: var(--primary); border-radius: 20px; display: flex; 
            align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(212,175,55,0.4); z-index: 99;
            transition: 0.2s;
        }

        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: calc(75px + env(safe-area-inset-bottom)); 
            background: rgba(3, 4, 6, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around; 
            align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 100;
        }
        .nav-item { color: #52525B; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; cursor: pointer; }
        .nav-item.active { color: var(--primary); }

        .toast { 
            position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px); 
            background: #E4E4E7; color: #000; padding: 12px 24px; border-radius: 50px; font-size: 14px; 
            font-weight: 600; opacity: 0; visibility: hidden; z-index: 9999; transition: 0.3s;
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(8px);
        }

        .settings-content { padding: 24px; display: flex; flex-direction: column; gap: 24px; }
        .settings-section { background: rgba(255,255,255,0.03); border-radius: 20px; padding: 20px; border: 1px solid var(--glass-border); }
        .settings-section h3 { font-size: 14px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 16px; letter-spacing: 1px; }

        .avatar-edit { position: relative; width: 100px; height: 100px; margin: 0 auto 20px; cursor: pointer; }
        .avatar-edit .avatar { width: 100%; height: 100%; font-size: 32px; }
        .avatar-edit .edit-badge { position: absolute; bottom: 0; right: 0; background: var(--primary); width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--bg); color: #000; }
    </style>
</head>
<body>

    <div id="loader">
        <div style="width:40px; height:40px; border:3px solid rgba(212,175,55,0.1); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite;"></div>
        <div id="loader-text" style="color:var(--primary); font-size:14px; font-weight:600; margin-top:16px;">ĐANG XỬ LÝ...</div>
    </div>

    <!-- Login View -->
    <div id="login-view" class="view active">
        <div class="auth-wrapper">
            <div class="auth-card">
                <img src="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png" style="width:70px; margin-bottom:24px;">
                <h2 style="margin-bottom: 8px; font-weight: 700; font-size: 26px;">Alpha Zone</h2>
                <p style="color:var(--text-sub); font-size:14px; margin-bottom:32px;">Hệ thống Mail Workspace</p>
                <div class="input-group">
                    <input type="email" id="l-email" class="field" placeholder="Email đăng nhập">
                </div>
                <div class="input-group">
                    <input type="password" id="l-pass" class="field" placeholder="Mật khẩu">
                </div>
                <button class="btn btn-gold" onclick="auth('login')">Đăng nhập</button>
                <button class="btn btn-outline" style="background: rgba(255,255,255,0.05); color: #FFF; border: none;" onclick="autoGenerateSignup()">
                    <i data-lucide="zap" size="18"></i> Tạo tài khoản nhanh
                </button>
                <p style="margin-top:24px; font-size:14px; color:var(--text-sub)" onclick="switchV('signup-view')">Chưa có tài khoản? <span style="color:var(--primary); font-weight:600; cursor:pointer;">Đăng ký</span></p>
            </div>
        </div>
    </div>

    <!-- Signup View -->
    <div id="signup-view" class="view">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h2 style="margin-bottom: 8px; font-weight: 700; font-size: 24px;">Đăng ký Alpha Mail</h2>
                <p style="color:var(--text-sub); font-size:14px; margin-bottom:32px;">Tạo định danh @alphazone.io.vn</p>
                <div class="input-group">
                    <input type="text" id="s-prefix" class="field" placeholder="Tên người dùng">
                </div>
                <div class="input-group">
                    <input type="password" id="s-pass" class="field" placeholder="Mật khẩu bảo mật">
                    <div class="field-icon" onclick="genPass('s-pass')"><i data-lucide="refresh-cw" size="18"></i></div>
                </div>
                <button class="btn btn-gold" onclick="auth('signup')">Hoàn tất đăng ký</button>
                <button class="btn btn-outline" onclick="switchV('login-view')">Quay lại đăng nhập</button>
            </div>
        </div>
    </div>

    <!-- App View -->
    <div id="app-view" class="view">
        <div class="header">
            <div class="search-box">
                <i data-lucide="search" size="18" color="#71717A"></i>
                <input type="text" id="q" placeholder="Tìm kiếm thư..." oninput="render()">
                <div onclick="openO('settings-overlay')" id="u-ava" class="avatar" style="width:32px; height:32px; font-size:13px; border-radius: 10px; cursor: pointer;">?</div>
            </div>
        </div>
        <div id="list" class="mail-list"></div>
        <div class="fab" onclick="openCompose()"><i data-lucide="plus" size="28" color="#000"></i></div>
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-inbox" onclick="setActiveTab('inbox')"><i data-lucide="inbox"></i><span>Hộp thư</span></div>
            <div class="nav-item" onclick="toast('Tính năng đang phát triển...')"><i data-lucide="send"></i><span>Đã gửi</span></div>
            <div class="nav-item" onclick="toast('Tính năng đang phát triển...')"><i data-lucide="shield"></i><span>Mã OTP</span></div>
            <div class="nav-item" onclick="openO('settings-overlay')"><i data-lucide="settings"></i><span>Cài đặt</span></div>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="overlay">
        <div class="top-bar">
            <i data-lucide="arrow-left" onclick="closeO('settings-overlay')"></i>
            <span style="flex:1; font-size:14px; font-weight:700; text-align:center;">CÀI ĐẶT</span>
            <i data-lucide="log-out" size="20" onclick="logout()" style="cursor:pointer"></i>
        </div>
        <div class="settings-content" style="overflow-y: auto; flex:1;">
            <div class="avatar-edit" onclick="changeAvatar()">
                <div id="edit-ava" class="avatar">?</div>
                <div class="edit-badge"><i data-lucide="camera" size="14"></i></div>
            </div>
            <div style="text-align:center; margin-bottom: 30px;">
                <h2 id="set-email" style="font-size:18px; font-weight:700;">email@alphazone.io.vn</h2>
                <p style="color:var(--text-sub); font-size:13px; margin-top:4px;">Workspace ID: <span id="set-uid">...</span></p>
            </div>

            <div class="settings-section">
                <h3>Bảo mật</h3>
                <div class="input-group">
                    <input type="password" id="set-new-pass" class="field" placeholder="Mật khẩu mới">
                    <div class="field-icon" onclick="genPass('set-new-pass')"><i data-lucide="refresh-cw" size="18"></i></div>
                </div>
                <button class="btn btn-gold" onclick="updatePassword()">Cập nhật mật khẩu</button>
            </div>

            <div class="settings-section">
                <h3>Về ứng dụng</h3>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:14px; color: #FFF;">Hệ thống Alpha Workspace</span>
                    <span style="color:var(--primary); font-size:12px; font-weight:700;">PRO V2.8</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail/Compose Overlays (Giữ nguyên cấu trúc nhưng tinh chỉnh nhẹ) -->
    <div id="detail-overlay" class="overlay">
        <div class="top-bar">
            <i data-lucide="arrow-left" onclick="closeO('detail-overlay')"></i>
            <span style="flex:1; font-size:14px; font-weight:700; text-align:center;">CHI TIẾT THƯ</span>
            <i data-lucide="trash-2" size="20" color="#EF4444" onclick="confirmDelete()" style="cursor:pointer"></i>
        </div>
        <div style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
            <div style="padding:24px; border-bottom:1px solid var(--border);">
                <h2 id="d-sub" style="font-size:18px; font-weight:700; margin-bottom:16px; color:#FFF"></h2>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div id="d-ava" class="avatar" style="width:40px; height:40px; font-size:16px;"></div>
                    <div style="flex:1; min-width:0;">
                        <div id="d-sender" style="font-weight:600; font-size:14px; color:#FFF; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></div>
                        <div id="d-time" style="font-size:12px; color:var(--text-sub);"></div>
                    </div>
                </div>
            </div>
            <div class="iframe-wrapper">
                <iframe id="mail-frame" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin"></iframe>
            </div>
        </div>
    </div>

    <div id="compose-overlay" class="overlay">
        <div class="top-bar">
            <i data-lucide="x" onclick="closeO('compose-overlay')"></i>
            <span style="flex:1; font-size:14px; font-weight:700; text-align:center;">SOẠN THƯ</span>
            <i data-lucide="send" size="20" color="var(--primary)" onclick="sendMail()" style="cursor:pointer"></i>
        </div>
        <div style="padding:16px; flex:1; display:flex; flex-direction:column;">
            <input type="text" id="c-to" class="field" style="background:transparent; border-radius:0; border-bottom:1px solid var(--border);" placeholder="Tới:">
            <input type="text" id="c-sub" class="field" style="background:transparent; border-radius:0; border-bottom:1px solid var(--border);" placeholder="Tiêu đề:">
            <textarea id="c-body" style="width:100%; flex:1; background:transparent; border:none; color:#FFF; padding:16px 0; font-family:inherit; font-size:15px; resize:none;" placeholder="Nội dung..."></textarea>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbweIN7Ny8xt5RRRF4ymkSiTvnJp8_tcqDgfkTmRKiFPnLp1lVMbtJl6nGwh5raaqWWqog/exec";
        let user = localStorage.getItem('alpha_user') || "";
        let avatarUrl = localStorage.getItem('alpha_ava_' + user) || "";
        let mails = [];
        let curMailIndex = null;
        let readMails = JSON.parse(localStorage.getItem('alpha_read_status') || "[]");

        function showLoading(s, text) { 
            const loader = document.getElementById('loader');
            if(text) document.getElementById('loader-text').innerText = text;
            loader.style.display = s ? 'flex' : 'none'; 
        }

        function toast(m) {
            const t = document.getElementById('toast'); 
            t.innerText = m; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function switchV(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            lucide.createIcons();
        }

        function openO(id) { document.getElementById(id).style.display = 'flex'; lucide.createIcons(); }
        function closeO(id) { document.getElementById(id).style.display = 'none'; }

        // --- Auth & Sync ---
        function genPass(id) {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%";
            let pass = "";
            for (let i = 0; i < 10; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById(id).value = pass;
            toast("Đã tạo mật khẩu mạnh");
        }

        async function auth(type) {
            const prefix = type === 'login' ? 'l' : 's';
            let email = document.getElementById(`${prefix}-email`)?.value || document.getElementById('s-prefix')?.value;
            let pass = document.getElementById(`${prefix}-pass`).value;

            if(type === 'signup' && !email.includes('@')) email += "@alphazone.io.vn";
            if(!email || !pass) return toast("Thiếu thông tin!");

            showLoading(true, type === 'login' ? "ĐANG XÁC THỰC..." : "ĐANG KHỞI TẠO...");
            
            try {
                const response = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: type, email, pass })
                });

                const d = await response.json();
                if(d.status === 'success') {
                    user = email; 
                    localStorage.setItem('alpha_user', user);
                    if(d.avatar) {
                        avatarUrl = d.avatar;
                        localStorage.setItem('alpha_ava_' + user, avatarUrl);
                    }
                    init();
                } else {
                    toast(d.message || "Lỗi hệ thống!");
                }
            } catch(e) {
                // Fallback khi lỗi mạng hoặc debug
                user = email; localStorage.setItem('alpha_user', user); init();
            } finally { showLoading(false); }
        }

        function autoGenerateSignup() {
            const id = Math.random().toString(36).substring(7);
            document.getElementById('s-prefix').value = "user_" + id;
            genPass('s-pass');
            switchV('signup-view');
        }

        function init() {
            document.getElementById('set-email').innerText = user;
            document.getElementById('set-uid').innerText = user.split('@')[0].toUpperCase();
            updateUIWithAvatar();
            switchV('app-view');
            mails = JSON.parse(localStorage.getItem('alpha_cache_' + user) || "[]");
            render();
            refresh();
            setInterval(() => refresh(false), 30000);
        }

        // --- Avatar & Syncing ---
        function updateUIWithAvatar() {
            const avaElements = ['u-ava', 'edit-ava'];
            avatarUrl = localStorage.getItem('alpha_ava_' + user) || "";
            
            avaElements.forEach(id => {
                const el = document.getElementById(id);
                if(avatarUrl) {
                    el.style.backgroundImage = `url('${avatarUrl}')`;
                    el.innerText = "";
                } else {
                    el.style.backgroundImage = "none";
                    el.innerText = user[0].toUpperCase();
                    el.style.backgroundColor = getAvaColor(user);
                }
            });
        }

        async function changeAvatar() {
            const url = prompt("Dán URL ảnh trực tiếp (imgur, abphotos...):", avatarUrl);
            if(url !== null) {
                showLoading(true, "ĐANG ĐỒNG BỘ ẢNH...");
                try {
                    await fetch(API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'updateAvatar', email: user, avatarUrl: url })
                    });
                    avatarUrl = url;
                    localStorage.setItem('alpha_ava_' + user, url);
                    updateUIWithAvatar();
                    toast("Đã cập nhật Avatar");
                } catch(e) {
                    toast("Lỗi đồng bộ Avatar lên Server!");
                } finally { showLoading(false); }
            }
        }

        async function updatePassword() {
            const newPass = document.getElementById('set-new-pass').value;
            if(!newPass) return toast("Nhập mật khẩu mới!");
            
            showLoading(true, "ĐANG CẬP NHẬT MẬT KHẨU...");
            try {
                await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'updatePassword', email: user, newPass })
                });
                toast("Đổi mật khẩu thành công!");
                document.getElementById('set-new-pass').value = "";
            } catch(e) { toast("Lỗi đồng bộ mật khẩu!"); }
            finally { showLoading(false); }
        }

        // --- Core App Logic ---
        async function refresh(manual) {
            if(!user) return;
            if(manual) showLoading(true, "ĐANG KIỂM TRA THƯ...");
            try {
                const r = await fetch(`${API}?email=${user}`);
                const data = await r.json();
                if(Array.isArray(data)) {
                    mails = data;
                    localStorage.setItem('alpha_cache_' + user, JSON.stringify(mails));
                    render();
                }
            } catch(e) {} finally { if(manual) showLoading(false); }
        }

        function render() {
            const list = document.getElementById('list');
            const q = document.getElementById('q').value.toLowerCase();
            
            if(mails.length === 0) {
                list.innerHTML = `<div style="padding:100px 40px; text-align:center; color:var(--text-sub);"><i data-lucide="inbox" size="48" style="opacity:0.2; margin-bottom:16px;"></i><p style="opacity:0.5; font-size:14px;">Hộp thư đang trống</p></div>`;
                lucide.createIcons();
                return;
            }

            const filtered = mails.filter(m => (m.subject + m.sender).toLowerCase().includes(q));
            list.innerHTML = filtered.map((m, i) => {
                const name = m.sender.split('<')[0].replace(/"/g, '').trim() || m.sender.split('@')[0];
                const isRead = readMails.includes(m.id);
                return `
                <div class="mail-item ${isRead ? '' : 'unread'}" onclick="view(${i})">
                    <div class="avatar" style="background-color:${getAvaColor(name)}">${name[0].toUpperCase()}</div>
                    <div class="mail-info">
                        <div class="mail-top">
                            <span class="sender-name">${name}</span>
                            <span class="mail-time">${formatTime(m.time)}</span>
                        </div>
                        <span class="subject-text">${m.subject || '(Không có chủ đề)'}</span>
                        <span class="preview-text">${m.body.replace(/<[^>]*>/g, '').substring(0, 80)}...</span>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function view(i) {
            const m = mails[i]; curMailIndex = i;
            if(!readMails.includes(m.id)) {
                readMails.push(m.id);
                localStorage.setItem('alpha_read_status', JSON.stringify(readMails));
                render();
            }
            const name = m.sender.split('<')[0].replace(/"/g, '').trim();
            const dava = document.getElementById('d-ava');
            dava.innerText = name[0].toUpperCase();
            dava.style.backgroundColor = getAvaColor(name);
            dava.style.backgroundImage = "none";
            
            document.getElementById('d-sender').innerText = m.sender;
            document.getElementById('d-time').innerText = m.time;
            document.getElementById('d-sub').innerText = m.subject || "(Không có tiêu đề)";
            
            const frame = document.getElementById('mail-frame');
            const isHTML = /<\/?[a-z][\s\S]*>/i.test(m.body);
            const style = `<style>body{font-family:'Be Vietnam Pro',sans-serif;line-height:1.6;color:#1a1a1a;padding:20px;word-wrap:break-word;}img{max-width:100%}</style>`;
            frame.srcdoc = isHTML ? m.body : style + m.body.replace(/\n/g, '<br>');
            openO('detail-overlay');
        }

        async function sendMail() {
            const to = document.getElementById('c-to').value;
            const subject = document.getElementById('c-sub').value;
            const body = document.getElementById('c-body').value;
            if(!to || !body) return toast("Hãy nhập người nhận và nội dung!");
            showLoading(true, "ĐANG GỬI THƯ...");
            try {
                await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'send', from: user, to, subject, body })
                });
                toast("Đã gửi thư thành công!");
                closeO('compose-overlay');
                document.getElementById('c-to').value = "";
                document.getElementById('c-sub').value = "";
                document.getElementById('c-body').value = "";
            } catch(e) { toast("Lỗi khi gửi thư!"); }
            finally { showLoading(false); }
        }

        async function deleteMail() {
            if(curMailIndex === null) return;
            showLoading(true, "ĐANG XÓA...");
            try {
                await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'delete', email: user, id: mails[curMailIndex].id })
                });
                mails.splice(curMailIndex, 1);
                localStorage.setItem('alpha_cache_' + user, JSON.stringify(mails));
                closeO('detail-overlay');
                render();
                toast("Đã xóa thư khỏi hộp thư");
            } catch(e) { toast("Lỗi khi xóa!"); }
            finally { showLoading(false); }
        }

        function formatTime(s) {
            const d = new Date(s);
            if(isNaN(d.getTime())) return s;
            const now = new Date();
            if(d.toDateString() === now.toDateString()) return d.getHours() + ":" + d.getMinutes().toString().padStart(2, '0');
            return d.toLocaleDateString('vi-VN');
        }

        function getAvaColor(n) {
            const colors = ['#D4AF37', '#4F46E5', '#DB2777', '#7C3AED', '#059669', '#D97706'];
            let h = 0; for (let i = 0; i < n.length; i++) h = n.charCodeAt(i) + ((h << 5) - h);
            return colors[Math.abs(h) % colors.length];
        }

        function openCompose() { openO('compose-overlay'); }
        function confirmDelete() { if(confirm("Xóa thư này vĩnh viễn?")) deleteMail(); }
        function logout() { if(confirm("Bạn muốn đăng xuất?")) { localStorage.removeItem('alpha_user'); location.reload(); } }

        window.onload = () => { if(user) init(); else lucide.createIcons(); };
    </script>
</body>
</html>
