    <!-- Thin Vietnamese-safe font -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500&family=JetBrains+Mono:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #ff5f1f;
            --bg: #050505;
            --surface: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08);
        }
        
        body {
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 300;
            background-color: var(--bg);
            color: #fff;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-synthesis: none;
        }

        .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 300; }



        /* Vietnamese-safe thin typography */
        h1, h2, h3, h4, h5, h6, button, input, textarea, select {
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-synthesis: none;
        }
        .font-thin { font-weight: 100 !important; }
        .font-extralight { font-weight: 200 !important; }
        .font-light { font-weight: 300 !important; }
        .font-medium { font-weight: 400 !important; }
        .font-semibold, .font-bold { font-weight: 500 !important; }

                /* Minimalist Mesh Background */
        .ambient-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 95, 31, 0.05) 0px, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(30, 64, 175, 0.05) 0px, transparent 40%);
            z-index: -1;
            filter: blur(60px);
            pointer-events: none;
        }

        /* Nav Glass */
        .glass-nav {
            background: rgba(5, 5, 5, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }

        /* Thin Minimal Cards */
        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-card:hover {
            border-color: rgba(255, 95, 31, 0.3);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-4px);
        }

        /* Ghost Buttons */
        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-weight: 300;
            border-radius: 12px;
            transition: all 0.4s ease;
        }

        .btn-ghost:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-accent {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 300;
            border-radius: 12px;
            transition: all 0.4s ease;
        }

        .btn-accent:hover {
            background: var(--accent);
            color: #000;
        }

        /* Search Input */
        .search-input {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: #fff;
            font-weight: 200;
            transition: all 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Fade Animations */
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Receipt PDF Styling */
        .receipt-card {
            background: #ffffff;
            color: #000;
            border-radius: 24px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
        }

        /* Minimal Scrollbar */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Production Polish */
        * {
            font-synthesis: none; box-sizing: border-box; }
        a, button, input { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, input:focus-visible, a:focus-visible { outline: 1px solid rgba(255, 95, 31, 0.7); outline-offset: 4px; }
        .mobile-menu { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, opacity 0.35s ease; opacity: 0; }
        .mobile-menu.open { max-height: 240px; opacity: 1; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        @media (max-width: 640px) { .receipt-card { border-radius: 20px; padding: 28px !important; } }
    </style>
</head>
<body>

            <img src="https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png" class="w-6 h-6 grayscale opacity-20">

    <!-- Custom Toast System -->
    <div id="toast-container" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // --- CONFIGURATION ---
        // Dán URL Web App Apps Script vào đây sau khi Deploy as Web app.
        // Ví dụ: const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycb.../exec';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwKIJmQ1eoenQ0lHXbpoVZDcpkxyGR8vNnusTgyYVoMR8ItJ2QL1jkSPOmwo8GDEFF/exec';
        const SHEET_ID = '1B2FMQ9pKHFQpY4eFMIqnEEHEqvgqq72USV86HgH6d5E';
        const PRODUCT_GID = '128531703';
        const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${PRODUCT_GID}`;
        const CACHE_KEY = 'alphazone_products_minimal_v2';
        const AUTO_SYNC_ON_LOAD = true;
        const SYNC_DEBOUNCE_MS = 600;
        const LOGO_URL = 'https://cdn.abphotos.link/photos/resized/320x/2026/03/11/1773232281_ARJvCgc348bqad67_1773238655-phpcgaoey.png';
        const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80';
        const SELLER_ZALO = '0357130499';
        const BANK_ID = 'MB';
        const BANK_ACCOUNT = '4499123123';
        const BANK_NAME = 'Nguyễn Lê Trí';
        const FALLBACK_PRODUCTS = [
            { id: 'az-demo-01', title: 'Premium Digital Workspace', category: 'Workspace', price: 'Liên hệ', duration: 'Linh hoạt', image: LOGO_URL, description: 'Gói dịch vụ mẫu hiển thị khi chưa thể đồng bộ dữ liệu từ Google Sheets hoặc Apps Script.', features: ['Catalog vẫn hoạt động khi mất kết nối', 'Có thể đồng bộ lại bằng nút Sync Data', 'Hỗ trợ đặt hàng qua Zalo'], link: '', platformName: 'Alpha Zone' },
            { id: 'az-demo-02', title: 'Account Service', category: 'Digital Service', price: 'Liên hệ', duration: 'Theo gói', image: FALLBACK_IMAGE, description: 'Giải pháp số được trình bày theo phong cách tối giản của Alpha Zone.', features: ['Quy trình rõ ràng', 'Tạo hóa đơn tự động', 'Tải PDF sau khi thanh toán'], link: '', platformName: 'Alpha Zone' }
        ];

        let allProducts = [];
        let categories = [];
        let lastOrder = null;
        let syncInProgress = false;
        let lastSyncTimer = null;
        let lastProductsSignature = '';
        let hasRenderedOnce = false;

        // --- HELPERS ---
        function safeText(value, fallback = '') {
            return String(value ?? fallback).trim();
        }

        function escapeHtml(value) {
            return safeText(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function toSlug(value) {
            return safeText(value)
                .toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '') || 'az-item';
        }

        function parseFeatures(row) {
            const raw = safeText(row.features || row.Features || row.feature || row.shortDescription || row['Mô tả ngắn']);
            if (!raw) return [];
            return raw.split(/[|\n•]+/).map(x => x.trim()).filter(Boolean).slice(0, 8);
        }

        function normalizeProduct(row, idx = 0) {
            const id = safeText(row.id || row.ID || row.productId || row.sku || row.SKU) || `${toSlug(row.name || row.Title || row.title)}-${idx + 1}`;
            const title = safeText(row.name || row.Name || row.title || row.Title || row.platformName || row['Tên sản phẩm'], 'Sản phẩm chưa đặt tên');
            const category = safeText(row.category || row.Category || row.platformName || row.Platform || row['Danh mục'], 'Uncategorized');
            const image = safeText(row.logo || row.Logo || row.image || row.Image_URL || row.categoryImage || row['Hình ảnh'], FALLBACK_IMAGE);
            const description = safeText(row.detailedDescription || row.description || row.Description || row.shortDescription || row['Mô tả'], 'Dịch vụ số bởi Alpha Zone.');
            return {
                id,
                title,
                category,
                price: safeText(row.price || row.Price || row['Giá'], 'Liên hệ'),
                duration: safeText(row.warranty || row.duration || row.Duration || row['Bảo hành'], 'Theo gói'),
                image,
                description,
                features: parseFeatures(row),
                link: safeText(row.link || row.Link || row.page || row.Page),
                platformName: safeText(row.platformName || row.PlatformName || row.platform || row.Platform, category),
                updatedAt: safeText(row.updatedAt || row.UpdatedAt || row['Cập nhật'])
            };
        }

        function getProductsSignature(products) {
            return JSON.stringify((products || []).map(p => [p.id, p.title, p.category, p.price, p.image, p.updatedAt]).sort());
        }

        function renderCurrentRoute({ preserveScroll = true } = {}) {
            const x = window.scrollX;
            const y = window.scrollY;
            handleRoute({ preserveScroll });
            if (preserveScroll) requestAnimationFrame(() => window.scrollTo(x, y));
        }

        function applyProducts(products, source = 'unknown', options = {}) {
            const { render = true, preserveScroll = true, force = false } = options;
            const cleaned = (Array.isArray(products) ? products : [])
                .map(normalizeProduct)
                .filter(p => p.title && p.title !== 'Sản phẩm chưa đặt tên');

            const nextProducts = cleaned.length ? cleaned : FALLBACK_PRODUCTS;
            const nextSignature = getProductsSignature(nextProducts);
            const changed = force || nextSignature !== lastProductsSignature;

            allProducts = nextProducts;
            categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
            lastProductsSignature = nextSignature;
            localStorage.setItem(CACHE_KEY, JSON.stringify({ syncedAt: new Date().toISOString(), source, products: allProducts }));

            if (render && (changed || !hasRenderedOnce)) {
                renderCurrentRoute({ preserveScroll });
                hasRenderedOnce = true;
            }
            return changed;
        }

        function updateSyncButton(state = 'idle') {
            const btn = document.getElementById('sync-btn');
            if (!btn) return;
            const labels = {
                idle: 'Sync Data',
                syncing: 'Syncing...',
                synced: 'Synced',
                unchanged: 'Up to date',
                failed: 'Sync Failed'
            };
            btn.innerText = labels[state] || labels.idle;
            btn.disabled = state === 'syncing';
        }

        function getAppsScriptUrl(action = 'products', params = {}) {
            if (!APPS_SCRIPT_URL) return '';
            const url = new URL(APPS_SCRIPT_URL);
            url.searchParams.set('action', action);
            Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
            return url.toString();
        }

        // --- TOAST SYSTEM ---
        function showToast(message, type = 'default') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'text-green-400 border-green-500/30' : (type === 'error' ? 'text-red-400 border-red-500/30' : 'text-white border-white/10');
            toast.className = `bg-black/80 backdrop-blur-md border ${color} px-6 py-3 rounded-xl text-[10px] font-light uppercase tracking-[0.2em] shadow-2xl transition-all duration-500 opacity-0 transform translate-y-4`;
            toast.innerHTML = escapeHtml(message);
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');
            });
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // --- DATA ENGINE: APPS SCRIPT FIRST, CSV FALLBACK ---
        async function initApp() {
            const cached = localStorage.getItem(CACHE_KEY);
            let hasCache = false;
            if (cached) {
                try {
                    const data = JSON.parse(cached);
                    const cachedProducts = Array.isArray(data.products) && data.products.length ? data.products : FALLBACK_PRODUCTS;
                    applyProducts(cachedProducts, data.source || 'cache', { render: true, preserveScroll: false, force: true });
                    hasCache = true;
                } catch (_) {}
            }

            if (!hasCache) {
                applyProducts(FALLBACK_PRODUCTS, 'fallback', { render: true, preserveScroll: false, force: true });
            }

            if (AUTO_SYNC_ON_LOAD) {
                window.setTimeout(() => syncData(true, { background: hasCache }), 250);
            }
        }

        async function fetchFromAppsScript() {
            const url = getAppsScriptUrl('products');
            if (!url) throw new Error('Apps Script URL chưa được cấu hình');
            const response = await fetch(url, { method: 'GET', cache: 'no-store' });
            if (!response.ok) throw new Error(`Apps Script HTTP ${response.status}`);
            const payload = await response.json();
            if (!payload || payload.ok === false) throw new Error(payload?.message || 'Apps Script trả về lỗi');
            return payload.products || payload.data || [];
        }

        async function fetchFromCsv() {
            const response = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
            if (!response.ok) throw new Error(`Google Sheet CSV HTTP ${response.status}`);
            const csvText = await response.text();
            return new Promise((resolve, reject) => {
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: results => resolve(results.data || []),
                    error: reject
                });
            });
        }

        async function syncData(isInitial = false, options = {}) {
            const { manual = false, background = false } = options;
            if (syncInProgress) return false;
            window.clearTimeout(lastSyncTimer);
            syncInProgress = true;
            updateSyncButton('syncing');

            // Debounce nhẹ để khi người dùng vừa mở web/nhấn nút, UI không bị giật do render liên tục.
            await new Promise(resolve => setTimeout(resolve, manual ? 0 : SYNC_DEBOUNCE_MS));

            try {
                let rows = [];
                let source = 'apps-script';
                try {
                    rows = await fetchFromAppsScript();
                } catch (appsError) {
                    console.warn('Apps Script fallback:', appsError.message);
                    source = 'google-sheet-csv';
                    rows = await fetchFromCsv();
                }

                const changed = applyProducts(rows, source, {
                    render: true,
                    preserveScroll: true,
                    force: !hasRenderedOnce
                });

                updateSyncButton(changed ? 'synced' : 'unchanged');
                lastSyncTimer = window.setTimeout(() => updateSyncButton('idle'), changed ? 1800 : 1200);

                if (manual) {
                    showToast(changed ? `Đã đồng bộ dữ liệu từ ${source}` : 'Dữ liệu đã mới nhất', 'success');
                } else if (!isInitial && !background) {
                    showToast(`Đã đồng bộ dữ liệu từ ${source}`, 'success');
                }
                return changed;
            } catch (error) {
                console.error('Sync Error:', error);
                if (!allProducts.length) applyProducts(FALLBACK_PRODUCTS, 'fallback', { render: true, preserveScroll: true, force: true });
                updateSyncButton('failed');
                lastSyncTimer = window.setTimeout(() => updateSyncButton('idle'), 2500);
                if (manual || !isInitial) showToast('Không thể đồng bộ Google Sheet', 'error');
                return false;
            } finally {
                syncInProgress = false;
            }
        }

        async function sendToAppsScript(action, data = {}) {
            if (!APPS_SCRIPT_URL) {
                console.warn('APPS_SCRIPT_URL chưa được cấu hình. Dữ liệu chỉ lưu cục bộ.', { action, data });
                return { ok: false, localOnly: true };
            }
            const form = new URLSearchParams();
            form.set('action', action);
            form.set('payload', JSON.stringify(data));
            Object.entries(data).forEach(([key, value]) => {
                if (value !== undefined && value !== null && typeof value !== 'object') form.set(key, value);
            });

            // no-cors giúp gửi dữ liệu ổn định từ GitHub Pages sang Apps Script, tránh lỗi preflight/redirect.
            await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: form.toString()
            });
            return { ok: true };
        }

        function handleRoute(options = {}) {
            const { preserveScroll = false } = options;
            const hash = window.location.hash || '#home';
            if (hash === '#home') renderHome();
            else if (hash.startsWith('#category-')) renderCategoryPage(decodeURIComponent(hash.replace('#category-', '')));
            else if (hash.startsWith('#product-')) renderProductDetail(hash.replace('#product-', ''));
            else if (hash.startsWith('#checkout-')) renderCheckout(hash.replace('#checkout-', ''));
            else renderHome();
            hasRenderedOnce = true;
            if (!preserveScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigate(path) { window.location.hash = path; }

        function toggleMobileMenu() {
            document.getElementById('mobile-menu')?.classList.toggle('open');
        }

        function scrollToServices() {
            document.getElementById('mobile-menu')?.classList.remove('open');
            if (window.location.hash !== '#home') {
                navigate('home');
                setTimeout(() => document.getElementById('services-section')?.scrollIntoView({ behavior: 'smooth' }), 300);
            } else {
                document.getElementById('services-section')?.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // --- LIVE SEARCH ---
        function handleSearch(query) {
            const q = safeText(query).toLowerCase();
            const grid = document.getElementById('product-grid');
            if (!grid) return;
            const filtered = allProducts.filter(p =>
                p.title.toLowerCase().includes(q) ||
                p.category.toLowerCase().includes(q) ||
                p.description.toLowerCase().includes(q) ||
                p.platformName.toLowerCase().includes(q)
            );
            grid.innerHTML = filtered.length
                ? filtered.map(p => productCardTemplate(p)).join('')
                : `<div class="col-span-full text-center py-20 text-white/30 font-light text-xs uppercase tracking-[0.2em]">Không tìm thấy dịch vụ cho "${escapeHtml(query)}"</div>`;
        }

        // --- VIEW RENDERING ---
        function renderHome() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="fade-in space-y-32">
                    <header class="max-w-4xl mx-auto text-center pt-10">
                        <p class="text-orange-500 font-light text-[9px] tracking-[0.8em] uppercase mb-8">Redefining Digital Experience</p>
                        <h1 class="font-extralight text-5xl md:text-[90px] tracking-tighter leading-[1.1] mb-10">
                            Digital Elegance. <br> <span class="font-thin text-white/40">Perfect Execution.</span>
                        </h1>
                        <p class="text-white/40 max-w-lg mx-auto text-xs font-light leading-relaxed uppercase tracking-[0.1em]">
                            Khám phá bộ sưu tập dịch vụ cao cấp được chọn lọc tinh tế, mang đến hiệu suất tối đa cho hệ sinh thái của bạn.
                        </p>
                    </header>

                    <section id="services-section" class="space-y-12 max-w-6xl mx-auto">
                        <div class="flex flex-col md:flex-row justify-between items-center gap-8">
                            <div class="flex gap-3 overflow-x-auto w-full md:w-auto pb-2 no-scrollbar">
                                <button onclick="renderHome()" class="whitespace-nowrap px-5 py-2.5 bg-white text-black rounded-xl text-[9px] font-medium uppercase tracking-[0.2em] transition-all">All</button>
                                ${categories.map(cat => `
                                    <button onclick="navigate('category-${encodeURIComponent(cat)}')" class="whitespace-nowrap px-5 py-2.5 border border-white/10 rounded-xl text-[9px] font-light uppercase tracking-[0.2em] hover:bg-white/5 transition-all">${escapeHtml(cat)}</button>
                                `).join('')}
                            </div>
                            <div class="w-full md:w-64 relative">
                                <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-3 h-3 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                <input type="text" placeholder="Tìm kiếm dịch vụ..." onkeyup="handleSearch(this.value)" class="search-input w-full pl-10 pr-4 py-3 text-[10px] uppercase tracking-widest placeholder:text-white/20">
                            </div>
                        </div>
                        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${allProducts.map(p => productCardTemplate(p)).join('')}
                        </div>
                    </section>
                </div>`;
        }

        function renderCategoryPage(catName) {
            const filtered = allProducts.filter(p => p.category === catName);
            document.getElementById('app-container').innerHTML = `
                <div class="fade-in max-w-6xl mx-auto">
                    <div class="flex items-center justify-between mb-16 border-b border-white/5 pb-8">
                        <button onclick="navigate('home')" class="text-[9px] font-light uppercase tracking-[0.3em] text-white/40 hover:text-white transition-colors flex items-center gap-2"><span>←</span> Catalog</button>
                        <div class="text-right"><h1 class="font-extralight text-4xl tracking-tight uppercase mb-2">${escapeHtml(catName)}</h1><p class="text-white/30 uppercase text-[8px] font-light tracking-[0.2em]">${filtered.length} Services</p></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${filtered.map(p => productCardTemplate(p)).join('')}</div>
                </div>`;
        }

        function renderProductDetail(id) {
            const p = allProducts.find(item => item.id === id);
            if (!p) return navigate('home');
            document.getElementById('app-container').innerHTML = `
                <div class="max-w-5xl mx-auto fade-in">
                    <button onclick="window.history.back()" class="mb-12 text-[9px] font-light uppercase tracking-[0.3em] text-white/40 hover:text-white transition-colors flex items-center gap-3"><span class="w-8 h-[1px] bg-white/40"></span> Khám phá tiếp</button>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                        <div class="aspect-[3/4] rounded-3xl overflow-hidden border border-white/5 bg-[#0a0a0a]"><img src="${escapeHtml(p.image)}" class="w-full h-full object-cover opacity-80" crossorigin="anonymous" onerror="this.src='${FALLBACK_IMAGE}'"></div>
                        <div class="space-y-12">
                            <div>
                                <span class="text-orange-500 font-light text-[9px] tracking-[0.4em] uppercase block mb-4">${escapeHtml(p.category)}</span>
                                <h1 class="font-thin text-5xl md:text-6xl tracking-tighter uppercase leading-tight mb-8">${escapeHtml(p.title)}</h1>
                                <div class="flex items-end gap-4"><span class="font-light text-4xl text-white tracking-tight">${escapeHtml(p.price)}</span><span class="text-white/30 font-light uppercase text-[10px] tracking-widest pb-1">/ ${escapeHtml(p.duration)}</span></div>
                            </div>
                            <div class="h-[1px] w-full bg-white/5"></div>
                            <div class="space-y-6"><h4 class="text-[8px] font-medium uppercase tracking-[0.4em] text-white/30">Tổng quan</h4><p class="text-white/50 leading-loose font-light text-sm text-justify">${escapeHtml(p.description)}</p></div>
                            ${p.features.length > 0 ? `<div class="space-y-6"><h4 class="text-[8px] font-medium uppercase tracking-[0.4em] text-white/30">Đặc quyền</h4><ul class="space-y-3">${p.features.map(f => `<li class="flex items-start gap-4"><span class="text-orange-500 text-xs mt-0.5 font-light">+</span><span class="text-xs font-light tracking-wide text-white/70">${escapeHtml(f)}</span></li>`).join('')}</ul></div>` : ''}
                            <div class="pt-8 flex flex-col sm:flex-row gap-4">
                                <button onclick="triggerCheckoutProcess('${escapeHtml(p.id)}')" class="btn-accent px-10 py-4 text-[10px] uppercase tracking-[0.3em] flex-1 text-center">Khởi tạo Đơn Hàng</button>
                                ${p.link ? `<a href="${escapeHtml(p.link)}" target="_blank" rel="noopener" class="btn-ghost px-6 py-4 text-[10px] uppercase tracking-[0.2em] flex items-center justify-center">Link</a>` : ''}
                                <button onclick="shareProduct('${escapeHtml(p.id)}')" class="btn-ghost px-6 py-4 flex items-center justify-center"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-11-4 5-5 5 5m-5-5v11"/></svg></button>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function triggerCheckoutProcess(id) {
            document.getElementById('app-container').innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[60vh] gap-6 fade-in">
                    <div class="w-10 h-10 border-[1px] border-white/10 border-t-orange-500 rounded-full animate-spin"></div>
                    <p class="text-white/50 font-light tracking-[0.3em] uppercase text-[9px] animate-pulse">Establishing Secure Connection...</p>
                    <p class="text-white/30 font-mono text-[8px]">Generating encrypted invoice ID</p>
                </div>`;
            setTimeout(() => navigate('checkout-' + id), 1000);
        }

        function renderCheckout(id) {
            const p = allProducts.find(item => item.id === id);
            if (!p) return navigate('home');
            const now = new Date();
            const txId = 'AZ-' + Math.random().toString(36).slice(2, 11).toUpperCase();
            const activationCode = `${p.id.substring(0, 4).toUpperCase()}-${Math.random().toString().slice(2, 8)}-${Math.random().toString().slice(2, 6)}`;
            const amount = safeText(p.price).replace(/[^\d]/g, '');
            lastOrder = { txId, activationCode, productId: p.id, productTitle: p.title, category: p.category, price: p.price, warranty: p.duration, createdAt: now.toISOString(), status: 'pending_payment', source: 'alphazone.io.vn' };
            sendToAppsScript('createOrder', lastOrder).then(res => {
                if (res.ok) showToast('Đã ghi đơn hàng vào Google Sheet', 'success');
                else showToast('Đơn hàng đã tạo cục bộ, hãy cấu hình Apps Script URL', 'default');
            }).catch(err => {
                console.error('Create order failed:', err);
                showToast('Không thể ghi đơn hàng vào Apps Script', 'error');
            });

            document.getElementById('app-container').innerHTML = `
                <div class="max-w-4xl mx-auto fade-in pb-10">
                    <nav class="flex justify-between items-center mb-10">
                        <button onclick="window.history.back()" class="text-[9px] font-light uppercase tracking-[0.3em] text-white/40 hover:text-white transition-colors">← Hủy</button>
                        <button onclick="downloadPDF()" class="btn-ghost px-6 py-2.5 text-[9px] uppercase tracking-[0.2em] flex items-center gap-2"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg>Lưu PDF</button>
                    </nav>
                    <div id="receipt-capture" class="receipt-card p-10 md:p-16 relative">
                        <div class="flex justify-between items-start border-b border-gray-100 pb-10 mb-10">
                            <div><h2 class="font-extralight text-3xl tracking-tight uppercase text-black mb-1">Invoice</h2><p class="text-gray-400 text-[8px] font-medium tracking-[0.3em] uppercase">Alpha Zone Digital</p></div>
                            <div class="text-right"><img src="${LOGO_URL}" class="w-8 h-8 ml-auto grayscale opacity-80 mb-2"><p class="mono text-[9px] text-gray-500 font-medium">REF: ${txId}</p></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-16 mb-12">
                            <div class="space-y-8">
                                <div><p class="text-gray-400 text-[8px] font-medium uppercase tracking-[0.3em] mb-2">Service Details</p><h3 class="font-light text-2xl text-black tracking-tight mb-1">${escapeHtml(p.title)}</h3><p class="text-gray-500 font-light text-[11px] uppercase tracking-wider">${escapeHtml(p.category)} • ${escapeHtml(p.duration)}</p></div>
                                <div class="flex gap-10"><div><p class="text-gray-400 text-[8px] font-medium uppercase tracking-[0.3em] mb-1">Date</p><p class="text-xs font-medium text-black">${now.toLocaleDateString('vi-VN')}</p></div><div><p class="text-gray-400 text-[8px] font-medium uppercase tracking-[0.3em] mb-1">Total Due</p><p class="text-sm font-semibold text-orange-500">${escapeHtml(p.price)}</p></div></div>
                                <div class="pt-6"><p class="text-gray-400 text-[8px] font-medium uppercase tracking-[0.3em] mb-3">Activation Key / Order Code</p><div class="bg-gray-50 border border-gray-100 rounded-xl p-6 cursor-pointer hover:border-gray-300 transition-all" onclick="copyCode('${activationCode}')"><p class="mono text-xl font-medium text-black tracking-widest text-center">${activationCode}</p></div></div>
                                <div class="bg-orange-50 border border-orange-100 rounded-2xl p-5"><p class="text-[9px] font-semibold text-orange-600 uppercase tracking-[0.25em] mb-2">Quy trình</p><p class="text-xs text-gray-600 leading-relaxed">Chọn gói → thanh toán → nhận mã 21 ký tự/mã đơn → gửi mã cho seller qua Zalo → hoàn tất đơn hàng.</p></div>
                            </div>
                            <div class="flex flex-col items-center justify-center"><div class="w-56 h-56 bg-white border border-gray-100 p-4 rounded-3xl shadow-sm mb-6"><img src="https://img.vietqr.io/image/${BANK_ID}-${BANK_ACCOUNT}-compact2.jpg?amount=${amount}&addInfo=${encodeURIComponent(txId)}" class="w-full h-full object-contain"></div><div class="text-center"><p class="text-[9px] font-medium text-gray-400 uppercase tracking-[0.3em] mb-1">${BANK_ID} Bank Transfer</p><p class="text-xs font-semibold text-black uppercase tracking-widest">${BANK_NAME}</p><p class="mono text-[10px] text-gray-500 mt-1">${BANK_ACCOUNT}</p></div></div>
                        </div>
                        <div class="border-t border-gray-100 pt-8 flex flex-col sm:flex-row gap-3 justify-between items-start sm:items-center text-[8px] uppercase tracking-[0.2em] text-gray-400"><p>Send key to Zalo: ${SELLER_ZALO}</p><p>Thank you for choosing Alpha</p></div>
                    </div>
                </div>`;
        }

        // --- TEMPLATES ---
        function productCardTemplate(p) {
            return `
                <div class="product-card p-5 flex flex-col group cursor-pointer" onclick="navigate('product-${escapeHtml(p.id)}')">
                    <div class="w-full aspect-video rounded-xl overflow-hidden mb-6 bg-[#0a0a0a] relative"><img src="${escapeHtml(p.image)}" class="w-full h-full object-cover opacity-80 transition-transform duration-1000 group-hover:scale-105" loading="lazy" onerror="this.src='${FALLBACK_IMAGE}'"></div>
                    <div class="flex-grow flex flex-col justify-between">
                        <div class="mb-6"><p class="text-[8px] font-light text-white/30 uppercase tracking-[0.3em] mb-2">${escapeHtml(p.category)}</p><h3 class="text-lg font-light tracking-tight uppercase leading-snug group-hover:text-orange-500 transition-colors line-clamp-2">${escapeHtml(p.title)}</h3></div>
                        <div class="flex justify-between items-center border-t border-white/5 pt-4"><p class="font-light text-white tracking-wide">${escapeHtml(p.price)}</p><span class="text-[9px] font-light uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-all text-white/50">View</span></div>
                    </div>
                </div>`;
        }

        // --- UTILS ---
        function copyCode(text) {
            navigator.clipboard.writeText(text).then(() => showToast(`Copied Key: ${text}`, 'success')).catch(() => showToast('Failed to copy', 'error'));
        }

        async function shareProduct(id) {
            const p = allProducts.find(prod => prod.id === id);
            const url = window.location.origin + window.location.pathname + '#product-' + id;
            if (navigator.share) await navigator.share({ title: `Alpha Zone | ${p?.title || 'Product'}`, url });
            else { navigator.clipboard.writeText(url); showToast('Link copied to clipboard', 'success'); }
        }

        function downloadPDF() {
            showToast('Generating high-quality PDF...', 'default');
            const element = document.getElementById('receipt-capture');
            const opt = { margin: [0, 0], filename: 'AlphaZone-Invoice-' + Date.now() + '.pdf', image: { type: 'jpeg', quality: 1 }, html2canvas: { scale: 3, useCORS: true, logging: false }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            html2pdf().set(opt).from(element).save().then(() => showToast('PDF Downloaded successfully', 'success'));
        }

        // --- INIT ---
        window.addEventListener('load', initApp);
        window.addEventListener('hashchange', () => handleRoute({ preserveScroll: false }));

    </script>
</body>
</html>
